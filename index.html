    class SfApiModal extends HTMLElement {
      connectedCallback() {
        this.render();
        window.StickForgeBus.on("modal:api:open", () => {
          this.querySelector("#apiModalWrap").classList.remove("hidden");
        });
      }
      render() {
        const store = window.StickForgeStore;
        this.innerHTML = `
          <div id="apiModalWrap" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-studio-panel border border-studio-border rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4">
              <div class="flex items-center justify-between border-b border-studio-border pb-2">
                <h2 class="text-sm font-bold text-white">🔑 Bring Your Own API Keys (BYOK)</h2>
                <button id="btnCloseApi" type="button" class="text-slate-400 hover:text-white">✕</button>
              </div>
              <div class="space-y-2 text-xs">
                <label class="block text-slate-300 font-semibold">Gemini / LLM API Key (Leave blank for Canvas runtime)</label>
                <input id="inpLlmKey" type="password" value="${store.api.llmKey}" placeholder="AIza..." class="w-full bg-studio-bg border border-studio-border rounded px-2.5 py-1.5 text-white font-mono" />
              </div>
              <div class="flex justify-end">
                <button id="btnSaveApi" type="button" class="px-4 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold">Save Key</button>
              </div>
            </div>
          </div>
        `;
        this.querySelector("#btnCloseApi").addEventListener("click", () => this.querySelector("#apiModalWrap").classList.add("hidden"));
        this.querySelector("#btnSaveApi").addEventListener("click", () => {
          store.api.llmKey = this.querySelector("#inpLlmKey").value.trim();
          this.querySelector("#apiModalWrap").classList.add("hidden");
          window.StickForgeBus.emit("status:toast", { message: "Saved API key configuration." });
        });
      }
    }
    customElements.define("sf-api-modal", SfApiModal);

    class SfModuleExporterModal extends HTMLElement {
      connectedCallback() {
        this.render();
        window.StickForgeBus.on("modal:exporter:open", () => {
          this.querySelector("#expModalWrap").classList.remove("hidden");
        });
      }
      render() {
        this.innerHTML = `
          <div id="expModalWrap" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-studio-panel border border-studio-border rounded-2xl max-w-lg w-full p-5 shadow-2xl space-y-3">
              <div class="flex items-center justify-between border-b border-studio-border pb-2">
                <h2 class="text-sm font-bold text-white">📦 Download Decoupled ES Modules for GitHub</h2>
                <button id="btnCloseExp" type="button" class="text-slate-400 hover:text-white">✕</button>
              </div>
              <p class="text-xs text-slate-400">Each part of StickForge 2D v4.0 is isolated in its own module so you can upgrade the renderer, AI services, or UI components without breaking other parts:</p>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <button type="button" data-mod="module-store|store.js" class="mod-dl-btn p-2 rounded bg-studio-card hover:bg-slate-800 border border-studio-border text-sky-300 font-mono">⬇ store.js</button>
                <button type="button" data-mod="module-services-ai|services-ai.js" class="mod-dl-btn p-2 rounded bg-studio-card hover:bg-slate-800 border border-studio-border text-sky-300 font-mono">⬇ services-ai.js</button>
                <button type="button" data-mod="module-renderer-2d|renderer-2d.js" class="mod-dl-btn p-2 rounded bg-studio-card hover:bg-slate-800 border border-studio-border text-sky-300 font-mono">⬇ renderer-2d.js</button>
                <button type="button" data-mod="module-components|components.js" class="mod-dl-btn p-2 rounded bg-studio-card hover:bg-slate-800 border border-studio-border text-sky-300 font-mono">⬇ components.js</button>
              </div>
            </div>
          </div>
        `;
        this.querySelector("#btnCloseExp").addEventListener("click", () => this.querySelector("#expModalWrap").classList.add("hidden"));
        this.querySelectorAll(".mod-dl-btn").forEach(b => {
          b.addEventListener("click", () => {
            const [id, filename] = b.dataset.mod.split("|");
            const code = document.getElementById(id)?.textContent || "";
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([code], { type: "application/javascript" }));
            a.download = filename;
            a.click();
          });
        });
      }
    }
    customElements.define("sf-module-exporter-modal", SfModuleExporterModal);
  </script>
</body>
</html>
