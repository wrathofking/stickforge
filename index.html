  <script id="module-store">
    class StickForgeEventBus extends EventTarget {
      emit(eventName, detail = {}) {
        this.dispatchEvent(new CustomEvent(eventName, { detail }));
      }
      on(eventName, handler) {
        const wrapped = (e) => handler(e.detail);
        this.addEventListener(eventName, wrapped);
        return () => this.removeEventListener(eventName, wrapped);
      }
    }

    window.StickForgeBus = new StickForgeEventBus();

      historyStack: [],
      // Writing Style Profiles Store

      // Audio & Caches
      enableSpeech: true,

      enableBgm: true,
      shotAudioUrls: {},

      presetPlateCache: {},
      // API Configuration (Gemini default)
      api: {
        llmProvider: "gemini",
        llmKey: "",

      getCurrentShot() {
        return this.shots[this.currentShotIndex] || this.shots[0];
      },
      getActiveStyle() {
        return this.writingStyles.find(s => s.id === this.activeStyleId) || this.writingStyles[0];
      },
      pushUndo() {
        this.historyStack.push(JSON.parse(JSON.stringify(this.shots)));
        if (this.historyStack.length > 20) this.historyStack.shift();
      },
      undo() {
        if (!this.historyStack.length) return false;
        this.shots = this.historyStack.pop();
        this.currentShotIndex = Math.min(this.currentShotIndex, this.shots.length - 1);
        window.StickForgeBus.emit("shots:updated");
        return true;
      },
      getTotalDuration() {
        return this.shots.reduce((acc, s) => acc + (Number(s.duration) || 5), 0);
      },
      getShotStartTime(idx) {
        let sum = 0;
        for (let i = 0; i < idx && i < this.shots.length; i++) {
          sum += Number(this.shots[i].duration) || 5;
        }
        return sum;
      }
    };

    // Load saved settings from localStorage if available
    try {
      const savedApi = localStorage.getItem("stickforge_v3_api");
      if (savedApi) Object.assign(window.StickForgeStore.api, JSON.parse(savedApi));

  <!-- =====================================================================
       MODULE 2: AI SERVICES LAYER (services-ai.js)
       Handles Gemini Script Generation, YouTube URL / Script Style Cloning
       (with Google Search Grounding), Google Flow 2D BG Gen, & Gemini 3.1 TTS.
  ====================================================================== -->
  <script id="module-ai-services">
    window.StickForgeAI = {
      // Exponential backoff fetch helper for Gemini API
      async fetchWithBackoff(url, options, retries = 3) {
        let delay = 1000;
        for (let i = 0; i <= retries; i++) {
          try {
            const res = await fetch(url, options);
            if (res.ok || i === retries || (res.status >= 400 && res.status < 500 && res.status !== 429)) {
              return res;
            }
          } catch (err) {
            if (i === retries) throw err;
          }
          await new Promise(r => setTimeout(r, delay));
          delay *= 2;
        }
      },

      // 1. ANALYZE & CLONE WRITING STYLE FROM YOUTUBE URL OR EXISTING SCRIPT
      async extractWritingStyle({ name, youtubeUrl, sampleScript }) {
        const store = window.StickForgeStore;
        const apiKey = store.api.llmKey || "";
        const model = "gemini-3-flash-preview";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;

        const systemInstruction = `You are an expert YouTube Script & Narrative Style Analyst.
Analyze the provided YouTube video URL and/or existing script sample to extract a reusable Writing Style DNA Profile.
Return ONLY valid JSON with this exact schema:
{
  "name": "Style Name",
  "hookFormula": "1-2 sentences describing how the hook grabs attention in the first 5 seconds",
  "pacing": "Description of sentence length, paragraph rhythm, and story progression",
  "vocabulary": "Key phrases, POV (1st/3rd person), tone, and recurring metric/badge tropes",
  "twistEnding": "How the climax and moral takeaway are structured"
}`;

        let userPrompt = `Style Name: ${name || "Cloned YouTube Style"}\n`;
        if (youtubeUrl) {
          userPrompt += `YouTube Video URL to research and clone style from: ${youtubeUrl}\n`;
        }
        if (sampleScript) {
          userPrompt += `Existing Reference Script / Transcript Sample:\n"""\n${sampleScript.slice(0, 6000)}\n"""\n`;
        }

        const payload = {
          contents: [{ role: "user", parts: [{ text: userPrompt }] }],
          systemInstruction: { parts: [{ text: systemInstruction }] },
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                name: { type: "STRING" },
                hookFormula: { type: "STRING" },
                pacing: { type: "STRING" },
                vocabulary: { type: "STRING" },
                twistEnding: { type: "STRING" }
              },
              required: ["name", "hookFormula", "pacing", "vocabulary", "twistEnding"]
            }
          }
        };

        // Enable Google Search grounding if a YouTube URL is provided without a full transcript
        if (youtubeUrl && (!sampleScript || sampleScript.trim().length < 80)) {
          payload.tools = [{ google_search: {} }];
        }

        try {
          const res = await this.fetchWithBackoff(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (res && res.ok) {
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              const parsed = JSON.parse(text);
              return {
                id: "style_" + Date.now(),
                name: name || parsed.name || "Cloned Style",
                source: youtubeUrl || "Custom Script Sample",
                hookFormula: parsed.hookFormula,
                pacing: parsed.pacing,
                vocabulary: parsed.vocabulary,
                twistEnding: parsed.twistEnding
              };
            }
          }
        } catch (e) {
          // Fallback to deterministic local style analyzer if offline or key restricted
        }

        // Local heuristic style analyzer fallback (works immediately even offline)
        const sample = (sampleScript || "").trim();
        const sentences = sample ? sample.split(/[.!?]+/).filter(Boolean) : [];
        const avgWords = sentences.length
          ? Math.round(sample.split(/\s+/).length / sentences.length)
          : 16;
        const hasFirstPerson = /\b(I|my|me|woke up|school)\b/i.test(sample);
        const hasMetrics = /\b(\d+\s*IQ|YES|NO|\$\d+|%|level|rank)\b/i.test(sample);

        return {
          id: "style_" + Date.now(),
          name: name || (youtubeUrl ? `YT Style (${youtubeUrl.slice(-11)})` : "Custom Script Style"),
          source: youtubeUrl || "Analyzed Script Text",
          hookFormula: sentences[0]
            ? `Open with a high-contrast premise like: "${sentences[0].trim().slice(0, 95)}..."`
            : "Start immediately with a visual metric contrast above characters' heads in a relatable setting.",
          pacing: `Average ~${avgWords} words per sentence; brisk 5-scene narrative arc with escalating social tests.`,
          vocabulary: `${hasFirstPerson ? "First-person relatable narrator ('I', 'my friend')" : "Dramatic third-person storyteller"}${hasMetrics ? " with explicit overhead floating metrics/numbers in every scene." : " with punchy visual status badges."}`,
          twistEnding: "Subvert the initial metric advantage in the final act and close with a reflective takeaway."
        };
      },

      // 2. GENERATE SCRIPT WITH GEMINI API USING ACTIVE WRITING STYLE DNA
      async generateScriptWithGemini({ topic, durationMinutes = 2 }) {
        const store = window.StickForgeStore;
        const activeStyle = store.getActiveStyle();
        const apiKey = store.api.llmKey || "";
        const model = store.api.llmModel && store.api.llmModel.includes("gemini")
          ? store.api.llmModel
          : "gemini-3-flash-preview";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;

        // At ~155 words/minute speaking rate and ~22-26 words per animated shot (~9-10 shots per minute)
        const mins = Math.max(0.5, Number(durationMinutes) || 2);
        const targetWords = Math.round(mins * 155);
        const targetShots = Math.max(3, Math.round(mins * 9));

        const systemPrompt = `You are the lead AI Scriptwriter for a 2D stick-figure animation channel.
Write a complete ${mins}-minute video script (~${targetWords} total words split across ${targetShots} paragraphs, with NO artificial cap on shots) for the user's premise, strictly following this Writing Style DNA:
- Style Name: ${activeStyle.name}
- Hook Formula: ${activeStyle.hookFormula}
- Pacing & Structure: ${activeStyle.pacing}
- Tone & Vocabulary: ${activeStyle.vocabulary}
- Climax & Ending: ${activeStyle.twistEnding}

CRITICAL RULES:
1. Every paragraph represents 1 animated 2D shot (~20-28 words per paragraph). Generate ${targetShots} paragraphs so the spoken narration lasts ${mins} minutes.
2. Include explicit overhead floating metrics/badges (e.g. "160 IQ", "70 IQ", "YES", "NO", "$12.5M", "99% LUCK") in every paragraph so the 2D character riggers can display them.
3. You may include expressive Gemini 3.1 TTS audio tags like [shocked], [excitedly], [whispers], or [short pause].
Return ONLY valid JSON matching the schema.`;

        const payload = {
          contents: [{ role: "user", parts: [{ text: `Topic / Premise: ${topic}\nTarget Video Duration: ${mins} minutes (${targetShots} paragraphs / shots, ~${targetWords} words)` }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                title: { type: "STRING" },
                paragraphs: {
                  type: "ARRAY",
                  items: { type: "STRING" }
                }
              },
              required: ["title", "paragraphs"]
            }
          }
        };

        try {
          const res = await this.fetchWithBackoff(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (res && res.ok) {
            const data = await res.json();
            const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (rawText) {
              const parsed = JSON.parse(rawText);
              if (parsed && Array.isArray(parsed.paragraphs) && parsed.paragraphs.length > 0) {
                return parsed;
              }
            }
          }
        } catch (err) {
          // Fallback to style-aware local multi-minute generator if network/key unavailable
        }

        const cleanTopic = topic.replace(/\?+$/, "");
        const baseBeats = [
          `[shocked] It started on Monday morning when I looked in the bedroom mirror and realized "${cleanTopic}" was actually real—with 160 IQ glowing in bright green right above my head.`,
          `When I walked into my first-period classroom, the top-ranked student Oliver was waving his A+ test paper with a red 70 IQ floating over him, laughing at my failed quiz.`,
          `Out in the school hallway, my best friend Jake nervously asked what his floating metric said. [short pause] Seeing 96 IQ above him, I smiled and told him he was way above average.`,
          `During lunch in the crowded hallway, everyone gathered around the popular crowd whose metrics read 108 IQ and 115 IQ, completely ignoring the quiet transfer girl sitting alone with 182 IQ.`,
          `When our strict principal walked down the city street outside the gates, a flickering 88 IQ badge hovered above him while he lectured us about standardized rankings.`,
          `That afternoon in the library, I watched Oliver study from the basics for four hours straight and realized a floating number only shows raw potential—not discipline.`,
          `[whispers] By sunset in the park, Jake admitted he had been terrified of failing his finals until my encouragement gave him the confidence to actually try.`,
          `When the qualifying round of the Regional Science Bowl began in the classroom, my 160 IQ let me spot patterns fast, but I froze on the memorization rounds that Oliver aced effortlessly.`,
          `[excitedly] At the National Student Auditorium Challenge, Oliver and I combined his relentless preparation with my pattern recognition to win the championship trophy together, proving numbers never define who you become.`
        ];

        const paragraphs = [];
        for (let i = 0; i < targetShots; i++) {
          const template = baseBeats[i % baseBeats.length];
          if (i < baseBeats.length) {
            paragraphs.push(template);
          } else {
            const actNum = Math.floor(i / baseBeats.length) + 1;
            paragraphs.push(`In Chapter ${actNum} (Scene ${i + 1}), ${template.replace(/^\[[^\]]+\]\s*/, "")}`);
          }
        }
        return {
          title: topic,
          paragraphs
        };
      },

      // 3. GOOGLE FLOW 2D CARTOON BACKGROUND GENERATOR (gemini-3.1-flash-image)
      async generateGoogleFlowBackground(shot, customPrompt) {
        const store = window.StickForgeStore;
        const desc = (customPrompt || shot.bgPrompt || shot.narration || "2D cartoon high school classroom").trim();
        shot.bgPrompt = desc;
        const apiKey = store.api.imgKey || store.api.llmKey || "";
        const flowPrompt = `Vibrant 2D flat-shaded cartoon animation background plate, clean bold ink outlines, rich atmospheric lighting, unobstructed floor in the bottom 20% for 2D stick-figure characters, no people or text in background. Scene: ${desc}`;

        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${encodeURIComponent(apiKey)}`;
          const res = await this.fetchWithBackoff(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ role: "user", parts: [{ text: flowPrompt }] }],
              generationConfig: {
                responseModalities: ["IMAGE"],
                imageConfig: { aspectRatio: store.aspectRatio === "9:16" ? "9:16" : "16:9" }
              }
            })
          }, 2);

          if (res && res.ok) {
            const result = await res.json();
            const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
            if (part && part.inlineData?.data) {
              const dataUrl = `data:${part.inlineData.mimeType || "image/png"};base64,${part.inlineData.data}`;
              await this.cacheShotImage(shot, dataUrl);
              return { ok: true, provider: "Google Flow (gemini-3.1-flash-image)" };
            }
          }
        } catch (e) {}

        // Rich Procedural 2D Illustrated Plate Fallback so it never fails
        const dataUrl = window.StickForgeRenderer.renderProceduralPlateToDataUrl(desc);
        await this.cacheShotImage(shot, dataUrl);
        return { ok: true, provider: "Google Flow 2D Procedural Compositor" };
      },

      cacheShotImage(shot, dataUrl) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            window.StickForgeStore.bgImageCache[shot.id] = img;
            shot.setting = "custom_flow";
            window.StickForgeBus.emit("shots:updated");
            resolve();
          };
          img.src = dataUrl;
        });
      },

      // 4. GEMINI 3.1 FLASH TTS VOICEOVER SYNTHESIZER
      async synthesizeGeminiTtsForShot(shot) {
        const store = window.StickForgeStore;
        const apiKey = store.api.ttsKey || store.api.llmKey || "";
        const voiceName = store.api.ttsVoiceName || "Puck";
        const directorNotes = store.api.ttsDirectorNotes || "Engaging YouTube story narrator";

        const promptText = `# AUDIO PROFILE: StickForge Story Narrator
## THE SCENE: ${shot.setting} (${shot.bgPrompt || "2D animated story scene"})
### DIRECTOR'S NOTES: ${directorNotes}
#### TRANSCRIPT:
${shot.narration}`;

        const modelsToTry = ["gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"];
        for (const modelId of modelsToTry) {
          try {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${encodeURIComponent(apiKey)}`;
            const res = await this.fetchWithBackoff(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }],
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: {
                    voiceConfig: {
                      prebuiltVoiceConfig: { voiceName }
                    }
                  }
                }
              })
            }, 1);

            if (res && res.ok) {
              const data = await res.json();
              const part = data?.candidates?.[0]?.content?.parts?.[0];
              const b64 = part?.inlineData?.data;
              const mime = part?.inlineData?.mimeType || "audio/L16;rate=24000";
              if (b64) {
                const rateMatch = mime.match(/rate=(\d+)/);
                const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
                const wavBlob = this.pcm16Base64ToWavBlob(b64, sampleRate);
                store.shotAudioUrls[shot.id] = URL.createObjectURL(wavBlob);
                window.StickForgeBus.emit("shots:updated");
                return { ok: true, model: modelId };
              }
            }
          } catch (e) {}
        }
        return { ok: false };
      },

      pcm16Base64ToWavBlob(base64Pcm, sampleRate = 24000) {
        const binary = atob(base64Pcm);
        const len = binary.length;
        const pcmBytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) pcmBytes[i] = binary.charCodeAt(i);

        const wavHeader = new ArrayBuffer(44);
        const view = new DataView(wavHeader);
        const writeStr = (offset, str) => {
          for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };
        writeStr(0, "RIFF");
        view.setUint32(4, 36 + pcmBytes.byteLength, true);
        writeStr(8, "WAVE");
        writeStr(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); // PCM
        view.setUint16(22, 1, true); // Mono
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeStr(36, "data");
        view.setUint32(40, pcmBytes.byteLength, true);

        return new Blob([wavHeader, pcmBytes], { type: "audio/wav" });
      },

      // Convert script paragraph into a structured 2D shot
      parseParagraphToShot(paragraph, index) {
        const lower = paragraph.toLowerCase();
        let setting = "classroom";
        if (lower.includes("wake") || lower.includes("mirror") || lower.includes("bedroom") || lower.includes("mom")) setting = "bedroom";
        else if (lower.includes("hallway") || lower.includes("locker") || lower.includes("friend")) setting = "hallway";
        else if (lower.includes("library") || lower.includes("study") || lower.includes("book")) setting = "library";
        else if (lower.includes("auditorium") || lower.includes("stage") || lower.includes("trophy") || lower.includes("challenge")) setting = "auditorium";
        else if (lower.includes("park") || lower.includes("bench")) setting = "park";
        else if (lower.includes("street") || lower.includes("city") || lower.includes("walk")) setting = "street";

        const badges = paragraph.match(/\b(\d+\s*IQ|YES|NO|\$\d+[KMB]?|\d+%)\b/gi) || [];
        const b1 = badges[0] ? badges[0].toUpperCase() : "160 IQ";
        const b2 = badges[1] ? badges[1].toUpperCase() : "70 IQ";
        const cleanWords = paragraph.replace(/\[[^\]]+\]/g, "").trim().split(/\s+/).length;
        const duration = Math.max(3.5, Number((cleanWords / 2.6).toFixed(1)));

        return {
          id: "shot_" + Date.now() + "_" + index,
          setting,
          camera: index % 2 === 0 ? "zoom_in" : "pan_right",
          duration,
          sfx: lower.includes("fail") || lower.includes("laugh") ? "buzzer" : lower.includes("win") || lower.includes("trophy") ? "ding" : "pop",
          bgPrompt: `Vibrant 2D cartoon ${setting} background illustration for: ${paragraph.replace(/\[[^\]]+\]/g, "").slice(0, 80)}`,
          narration: paragraph.trim(),
          characters: [
            {
              id: "c1_" + index,
              name: "Protagonist",
              outfit: "#facc15",
              badgeText: b1,
              badgeColor: "#22c55e",
              expr: lower.includes("shock") ? "shocked" : "happy",
              action: "talk",
              prop: lower.includes("trophy") ? "trophy" : "none",
              scale: 1.05,
              x: 34,
              y: 80,
              flip: false
            },
            {
              id: "c2_" + index,
              name: lower.includes("mom") ? "Mom" : lower.includes("jake") ? "Jake" : "Oliver",
              outfit: lower.includes("mom") ? "#ec4899" : lower.includes("jake") ? "#10b981" : "#3b82f6",
              badgeText: b2,
              badgeColor: b2.includes("70") || b2 === "NO" ? "#ef4444" : "#38bdf8",
              expr: lower.includes("laugh") ? "smug" : "happy",
              action: lower.includes("laugh") ? "point" : "idle",
              prop: lower.includes("book") ? "book" : "none",
              scale: 1.0,
              x: 66,
              y: 80,
              flip: true
            }
          ]
        };
      }
    };
  </script>

  <!-- =====================================================================
       MODULE 3: 2D CARTOON RENDERER & PROCEDURAL AUDIO ENGINE (renderer-2d.js)
  ====================================================================== -->
  <script id="module-renderer-2d">
    window.StickForgeRenderer = {
      audioCtx: null,
      audioDestStream: null,

      ensureAudio() {
        if (!this.audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            this.audioCtx = new AC();
            this.audioDestStream = this.audioCtx.createMediaStreamDestination();
          }
        }
        if (this.audioCtx && this.audioCtx.state === "suspended") {
          this.audioCtx.resume();
        }
        return this.audioCtx;
      },

      playSfx(type) {
        const store = window.StickForgeStore;
        if (!store.enableSfx || !type || type === "none") return;
        const ctx = this.ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (this.audioDestStream) gain.connect(this.audioDestStream);

        if (type === "pop") {
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(790, now + 0.09);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === "ding") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(587.3, now);
          osc.frequency.setValueAtTime(880, now + 0.09);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
          osc.start(now); osc.stop(now + 0.43);
        } else if (type === "buzzer") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(145, now);
          osc.frequency.linearRampToValueAtTime(108, now + 0.3);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now); osc.stop(now + 0.33);
        } else if (type === "whoosh") {
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.exponentialRampToValueAtTime(95, now + 0.22);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now); osc.stop(now + 0.25);
        }
      },

      renderProceduralPlateToDataUrl(promptText) {
        const off = document.createElement("canvas");
        off.width = 960;
        off.height = 540;
        const c = off.getContext("2d");
        const p = (promptText || "").toLowerCase();
        let setting = "classroom";
        if (p.includes("bed") || p.includes("mirror")) setting = "bedroom";
        else if (p.includes("hall") || p.includes("locker")) setting = "hallway";
        else if (p.includes("library") || p.includes("book")) setting = "library";
        else if (p.includes("auditorium") || p.includes("stage")) setting = "auditorium";
        else if (p.includes("park") || p.includes("bench")) setting = "park";
        else if (p.includes("street") || p.includes("city")) setting = "street";
        this.drawRichEnvironment(c, 960, 540, setting, "conchaser", 1.5, null, promptText);
        return off.toDataURL("image/jpeg", 0.9);
      },

      drawRichEnvironment(ctx, W, H, setting, styleMode, tSec, shot, bannerText) {
        const store = window.StickForgeStore;
        const floorY = H * 0.80;

        // If custom Google Flow image is cached for this shot, render it!
        if (shot && store.bgImageCache[shot.id]) {
          const img = store.bgImageCache[shot.id];
          if (img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, 0, 0, W, H);
            return;
          }
        }

        ctx.save();
        // Rich cel-shaded sky / wall backdrop
        const grad = ctx.createLinearGradient(0, 0, 0, floorY);
        if (styleMode === "neon" || setting === "auditorium") {
          grad.addColorStop(0, "#0f172a");
          grad.addColorStop(1, "#1e1b4b");
        } else if (styleMode === "sketch") {
          grad.addColorStop(0, "#fef9c3");
          grad.addColorStop(1, "#fde68a");
        } else if (setting === "park" || setting === "street") {
          grad.addColorStop(0, "#38bdf8");
          grad.addColorStop(0.65, "#bae6fd");
          grad.addColorStop(1, "#fef08a");
        } else if (setting === "bedroom") {
          grad.addColorStop(0, "#e0e7ff");
          grad.addColorStop(1, "#fae8ff");
        } else {
          grad.addColorStop(0, "#dbeafe");
          grad.addColorStop(1, "#f1f5f9");
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, floorY);

        // Floor plane with perspective planks
        ctx.fillStyle = styleMode === "neon" ? "#090d16" : setting === "park" ? "#4ade80" : setting === "street" ? "#64748b" : "#d97706";
        ctx.fillRect(0, floorY, W, H - floorY);
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(0, floorY);
        ctx.lineTo(W, floorY);
        ctx.stroke();

        // Detailed 2D Props per setting
        if (setting === "classroom") {
          // Sunlit window on left
          ctx.fillStyle = "#7dd3fc";
          ctx.fillRect(W * 0.04, H * 0.16, W * 0.12, H * 0.36);
          ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 3;
          ctx.strokeRect(W * 0.04, H * 0.16, W * 0.12, H * 0.36);
          // Green Chalkboard
          const bx = W * 0.20, by = H * 0.14, bw = W * 0.62, bh = H * 0.42;
          ctx.fillStyle = "#14532d";
          ctx.fillRect(bx, by, bw, bh);
          ctx.strokeStyle = "#78350f"; ctx.lineWidth = 6;
          ctx.strokeRect(bx, by, bw, bh);
          ctx.fillStyle = "rgba(255,255,255,0.85)";
          ctx.font = `700 ${Math.round(H * 0.032)}px "JetBrains Mono", monospace`;
          ctx.fillText("IQ DISTRIBUTION & APTITUDE TEST", bx + 22, by + bh * 0.35);
          ctx.fillText("∫ f(x)dx = 160     RESULTS OUT", bx + 22, by + bh * 0.68);
        } else if (setting === "bedroom") {
          // Bed, glowing mirror, window
          ctx.fillStyle = "#38bdf8";
          ctx.fillRect(W * 0.10, H * 0.16, W * 0.22, H * 0.32);
          ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 4;
          ctx.strokeRect(W * 0.10, H * 0.16, W * 0.22, H * 0.32);
          // Full-length Mirror
          ctx.fillStyle = "#bae6fd";
          ctx.fillRect(W * 0.64, H * 0.18, W * 0.16, H * 0.52);
          ctx.strokeStyle = "#475569"; ctx.lineWidth = 5;
          ctx.strokeRect(W * 0.64, H * 0.18, W * 0.16, H * 0.52);
        } else if (setting === "hallway") {
          const count = 6;
          const lw = (W * 0.78) / count;
          for (let i = 0; i < count; i++) {
            const lx = W * 0.11 + i * lw;
            ctx.fillStyle = i % 2 === 0 ? "#3b82f6" : "#2563eb";
            ctx.fillRect(lx, H * 0.20, lw - 5, floorY - H * 0.20);
            ctx.strokeStyle = "#1e3a8a"; ctx.lineWidth = 3;
            ctx.strokeRect(lx, H * 0.20, lw - 5, floorY - H * 0.20);
          }
        } else if (setting === "library") {
          for (let s = 0; s < 3; s++) {
            const sx = W * (0.12 + s * 0.27), sy = H * 0.15, sw = W * 0.21, sh = floorY - sy;
            ctx.fillStyle = "#78350f";
            ctx.fillRect(sx, sy, sw, sh);
            ctx.strokeStyle = "#451a03"; ctx.lineWidth = 3;
            ctx.strokeRect(sx, sy, sw, sh);
          }
        } else if (setting === "auditorium") {
          const sx = W * 0.20, sy = H * 0.12, sw = W * 0.60, sh = H * 0.38;
          ctx.fillStyle = "#0284c7";
          ctx.fillRect(sx, sy, sw, sh);
          ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 4;
          ctx.strokeRect(sx, sy, sw, sh);
          ctx.fillStyle = "#fde047";
          ctx.font = `800 ${Math.round(H * 0.036)}px "Inter", sans-serif`;
          ctx.textAlign = "center";
          ctx.fillText(bannerText ? bannerText.toUpperCase().slice(0, 32) : "NATIONAL STUDENT CHALLENGE", sx + sw / 2, sy + sh * 0.52);
          ctx.textAlign = "left";
        }

        // Volumetric sunbeams
        const rayGrad = ctx.createLinearGradient(0, 0, W * 0.5, floorY);
        rayGrad.addColorStop(0, "rgba(254, 240, 138, 0.22)");
        rayGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(W * 0.35, 0); ctx.lineTo(W * 0.65, floorY); ctx.lineTo(W * 0.1, floorY);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      },

      drawStickCharacter(ctx, W, H, char, idx, isSelected, styleMode, tSec, isPlaying) {
        const store = window.StickForgeStore;
        const cx = (Number(char.x) / 100) * W;
        const cy = (Number(char.y) / 100) * H;
        const scale = (Number(char.scale) || 1.0) * (H / 540);
        const dir = char.flip ? -1 : 1;

        const headR = 26 * scale;
        const torsoL = 66 * scale;
        const legL = 56 * scale;
        const armL = 46 * scale;

        let bobY = Math.sin(tSec * 3.5 + idx) * 2.5 * scale;
        let walkSwing = 0;
        if (char.action === "walk") {
          walkSwing = Math.sin(tSec * 9 + idx) * 18 * scale;
          bobY = Math.abs(Math.cos(tSec * 9 + idx)) * 5 * scale;
        } else if (char.action === "celebrate") {
          bobY = -Math.abs(Math.sin(tSec * 8 + idx)) * 10 * scale;
        }

        const hipX = cx;
        const hipY = cy - legL + bobY;
        const neckX = cx;
        const neckY = hipY - torsoL;
        const headX = neckX;
        const headY = neckY - headR * 0.95;
        const strokeMain = styleMode === "neon" ? "#f8fafc" : "#0f172a";
        const lineW = 5.2 * scale;

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (isSelected) {
          ctx.save();
          ctx.strokeStyle = "rgba(99, 102, 241, 0.9)";
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.strokeRect(cx - 54 * scale, headY - 80 * scale, 108 * scale, (cy - headY) + 95 * scale);
          ctx.restore();
        }

        // Shadow
        ctx.fillStyle = "rgba(15,23,42,0.24)";
        ctx.beginPath();
        ctx.ellipse(cx, cy + 4 * scale, 32 * scale, 8 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        ctx.strokeStyle = strokeMain;
        ctx.lineWidth = lineW;
        ctx.beginPath();
        ctx.moveTo(hipX, hipY); ctx.lineTo(cx - 16 * scale - walkSwing, cy);
        ctx.moveTo(hipX, hipY); ctx.lineTo(cx + 16 * scale + walkSwing, cy);
        ctx.stroke();

        // Torso
        if (char.outfit && char.outfit !== "stick" && styleMode !== "neon") {
          ctx.fillStyle = char.outfit;
          ctx.strokeStyle = strokeMain;
          ctx.lineWidth = lineW * 0.85;
          ctx.beginPath();
          ctx.roundRect(neckX - 20 * scale, neckY + 2 * scale, 40 * scale, torsoL - 4 * scale, 12 * scale);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.strokeStyle = strokeMain;
          ctx.lineWidth = lineW;
          ctx.beginPath();
          ctx.moveTo(neckX, neckY); ctx.lineTo(hipX, hipY);
          ctx.stroke();
        }

        // Arms
        const shY = neckY + 12 * scale;
        let lHX = neckX - 30 * scale, lHY = shY + armL * 0.85;
        let rHX = neckX + 32 * scale * dir, rHY = shY + armL * 0.75;
        if (char.action === "point") {
          rHX = neckX + 52 * scale * dir;
          rHY = shY - 6 * scale + Math.sin(tSec * 10) * 5 * scale;
        } else if (char.action === "celebrate") {
          lHX = neckX - 36 * scale; lHY = shY - 36 * scale;
          rHX = neckX + 36 * scale; rHY = shY - 36 * scale;
        } else if (char.action === "talk") {
          rHX = neckX + 40 * scale * dir;
          rHY = shY + 8 * scale + Math.sin(tSec * 8 + idx) * 10 * scale;
        }
        ctx.strokeStyle = strokeMain;
        ctx.lineWidth = lineW;
        ctx.beginPath();
        ctx.moveTo(neckX - 14 * scale, shY); ctx.lineTo(lHX, lHY);
        ctx.moveTo(neckX + 14 * scale, shY); ctx.lineTo(rHX, rHY);
        ctx.stroke();

        // Head
        ctx.fillStyle = styleMode === "neon" ? "#0f172a" : "#ffffff";
        ctx.strokeStyle = strokeMain;
        ctx.lineWidth = lineW * 0.9;
        ctx.beginPath();
        ctx.arc(headX, headY, headR, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Eyes & Mouth
        const eyeX = headX + 7 * scale * dir;
        const eyeY = headY - 4 * scale;
        ctx.fillStyle = strokeMain;
        ctx.beginPath();
        ctx.arc(eyeX - 6 * scale, eyeY, 2.8 * scale, 0, Math.PI * 2);
        ctx.arc(eyeX + 7 * scale, eyeY, 2.8 * scale, 0, Math.PI * 2);
        ctx.fill();

        const mouthY = headY + 9 * scale;
        const mouthOpen = isPlaying && (char.action === "talk" || idx === 0)
          ? Math.abs(Math.sin(tSec * 18)) * 5 * scale
          : 0;
        ctx.beginPath();
        if (mouthOpen > 1.5 * scale) {
          ctx.ellipse(eyeX, mouthY, 5 * scale, mouthOpen, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (char.expr === "shocked") {
          ctx.arc(eyeX, mouthY + 1 * scale, 4.5 * scale, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.arc(eyeX, mouthY - 2 * scale, 6.5 * scale, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.stroke();
        }

        // Overhead Floating Metric Badge
        if (store.showBadges && char.badgeText) {
          const floatY = headY - headR - 24 * scale + Math.sin(tSec * 4 + idx) * 3.5 * scale;
          const badgeColor = char.badgeColor || "#22c55e";
          ctx.font = `800 ${Math.round(16 * scale)}px "JetBrains Mono", monospace`;
          const tw = ctx.measureText(char.badgeText).width;
          const bw = tw + 24 * scale, bh = 28 * scale;
          ctx.save();
          ctx.shadowColor = badgeColor;
          ctx.shadowBlur = 12 * scale;
          ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
          ctx.strokeStyle = badgeColor;
          ctx.lineWidth = 2.5 * scale;
          ctx.beginPath();
          ctx.roundRect(headX - bw / 2, floatY - bh / 2, bw, bh, 8 * scale);
          ctx.fill();
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = badgeColor;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(char.badgeText, headX, floatY + 1 * scale);
          ctx.restore();
        }

        ctx.restore();
      },

      drawTimedCaptions(ctx, W, H, rawNarration, elapsed, duration) {
        const store = window.StickForgeStore;
        if (!store.showCaptions || !rawNarration) return;
        // Strip inline Gemini 3.1 TTS tags like [shocked] from visual captions
        const cleanText = rawNarration.replace(/\[[^\]]+\]/g, "").replace(/\s+/g, " ").trim();
        if (!cleanText) return;
        const words = cleanText.split(" ");
        const progress = Math.max(0, Math.min(0.999, elapsed / Math.max(1, duration)));
        const activeWordIdx = Math.floor(progress * words.length);
        const chunkSize = store.aspectRatio === "9:16" ? 4 : 7;
        const startIdx = Math.floor(activeWordIdx / chunkSize) * chunkSize;
        const chunk = words.slice(startIdx, startIdx + chunkSize);

        ctx.save();
        const fontSize = store.aspectRatio === "9:16" ? 24 : 21;
        ctx.font = `800 ${fontSize}px "Inter", sans-serif`;
        const fullLine = chunk.join(" ");
        const lineW = ctx.measureText(fullLine).width;
        const boxW = Math.min(W * 0.92, lineW + 34);
        const boxH = fontSize + 22;
        const boxX = (W - boxW) / 2;
        const boxY = H - boxH - 16;

        ctx.fillStyle = "rgba(9, 12, 18, 0.88)";
        ctx.strokeStyle = "rgba(99, 102, 241, 0.5)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxW, boxH, 10);
        ctx.fill();
        ctx.stroke();

        let curX = W / 2 - lineW / 2;
        ctx.textBaseline = "middle";
        chunk.forEach((w, i) => {
          const gIdx = startIdx + i;
          ctx.fillStyle = gIdx === activeWordIdx ? "#facc15" : gIdx < activeWordIdx ? "#ffffff" : "#94a3b8";
          ctx.fillText(w, curX, boxY + boxH / 2 + 1);
          curX += ctx.measureText(w + " ").width;
        });
        ctx.restore();
      }
    };
  </script>

      syncStyleSelect() {
        const sel = this.querySelector("#scriptStyleSelect");
        if (!sel) return;
        const store = window.StickForgeStore;
        sel.innerHTML = store.writingStyles.map(s => `<option value="${s.id}" ${s.id === store.activeStyleId ? "selected" : ""}>${s.name}</option>`).join("");
        const dnaPreview = this.querySelector("#activeStyleDnaSummary");
        const active = store.getActiveStyle();
        if (dnaPreview && active) {
          dnaPreview.textContent = `Hook: ${active.hookFormula} | Pacing: ${active.pacing}`;
        }
      }

      syncTextareaFromShots() {
        const ta = this.querySelector("#fullScriptBox");
        if (!ta || document.activeElement === ta) return;
        ta.value = window.StickForgeStore.shots.map(s => s.narration).join("\n\n");
        this.updateScriptMetrics();
      }

      updateDurationEstimator() {
        const minInput = this.querySelector("#scriptDurationMinutes");
        const estBadge = this.querySelector("#durationEstimateBadge");
        if (!minInput || !estBadge) return;
        const mins = Math.max(0.5, Number(minInput.value) || 2);
        const estWords = Math.round(mins * 155);
        const estShots = Math.max(3, Math.round(mins * 9));
        estBadge.textContent = `≈ ${estWords} words · ~${estShots} shots (No limit)`;
      }

      updateScriptMetrics() {
        const ta = this.querySelector("#fullScriptBox");
        const badge = this.querySelector("#scriptBoxStats");
        if (!ta || !badge) return;
        const raw = ta.value.trim();
        if (!raw) {
          badge.textContent = "0 shots · 0 words (~0.0 min)";
          return;
        }
        const paras = raw.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
        const words = raw.replace(/\[[^\]]+\]/g, "").trim().split(/\s+/).filter(Boolean).length;
        const estMin = (words / 155).toFixed(1);
        badge.textContent = `${paras.length} shots · ${words} words (~${estMin} min)`;
      }

      render() {
        const store = window.StickForgeStore;
        this.innerHTML = `
          <div class="space-y-3 text-xs">
            <div class="bg-studio-card border border-studio-border rounded-xl p-3 space-y-2.5">

              <div>

                <select id="scriptStyleSelect" class="w-full bg-studio-bg border border-studio-border rounded-lg px-2 py-1.5 text-white"></select>
              </div>

              <div class="bg-studio-bg/90 border border-studio-border rounded-lg p-2 space-y-1.5">

                  <span id="durationEstimateBadge" class="text-[10px] font-mono text-indigo-300">≈ 310 words · ~18 shots (No limit)</span>

                    <button type="button" data-min-preset="3" class="min-preset-btn px-2 py-1 rounded bg-studio-panel hover:bg-slate-800 border border-studio-border text-[10px] text-slate-300">3m</button>

                    <button type="button" data-min-preset="10" class="min-preset-btn px-2 py-1 rounded bg-studio-panel hover:bg-slate-800 border border-studio-border text-[10px] text-slate-300">10m</button>
                    <button type="button" data-min-preset="15" class="min-preset-btn px-2 py-1 rounded bg-studio-panel hover:bg-slate-800 border border-studio-border text-[10px] text-slate-300">15m</button>
                  </div>
                </div>
              </div>

                <label class="font-bold text-slate-200 text-[11px] uppercase tracking-wider">2. Full Story Script (Unlimited Shots)</label>
                <span id="scriptBoxStats" class="text-[10px] text-emerald-400 font-mono">5 shots · 115 words (~0.7 min)</span>
              </div>
              <textarea id="fullScriptBox" rows="8" placeholder="Paste or generate any length script. Every paragraph separated by a blank line becomes a 2D animated shot (unlimited shots supported)..." class="w-full bg-studio-bg border border-studio-border rounded-lg p-2.5 text-xs text-slate-200 leading-relaxed focus:outline-none focus:border-indigo-500 resize-y"></textarea>

          window.StickForgeBus.emit("style:changed");
        });

        this.querySelector("#scriptDurationMinutes").addEventListener("input", () => {
          this.updateDurationEstimator();
        });

        this.querySelectorAll(".min-preset-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            this.querySelector("#scriptDurationMinutes").value = btn.dataset.minPreset;
            this.updateDurationEstimator();
          });
        });

        this.querySelector("#fullScriptBox").addEventListener("input", () => {
          this.updateScriptMetrics();
        });

        this.querySelector("#chkAutoFlowOnBuild").addEventListener("change", (e) => {
          store.defaultGoogleFlowBg = e.target.checked;
        });

        this.querySelector("#btnGenerateGeminiScript").addEventListener("click", async () => {
          const btn = this.querySelector("#btnGenerateGeminiScript");
          const topic = this.querySelector("#geminiTopicInput").value.trim();
          const durationMinutes = Math.max(0.5, Number(this.querySelector("#scriptDurationMinutes").value) || 2);
          btn.disabled = true;
          btn.textContent = `✨ Gemini Writing ${durationMinutes}-Min Script...`;
          window.StickForgeBus.emit("status:toast", { message: `Generating ${durationMinutes}-min script with Gemini in "${store.getActiveStyle().name}" style...` });

          const res = await window.StickForgeAI.generateScriptWithGemini({ topic, durationMinutes });
          if (res && res.paragraphs) {
            this.querySelector("#fullScriptBox").value = res.paragraphs.join("\n\n");
            this.updateScriptMetrics();
            window.StickForgeBus.emit("status:toast", { message: `✨ Generated ${res.paragraphs.length} shots (~${durationMinutes} min)! Click 'Build Unlimited 2D Storyboard' below.` });
          }
          btn.disabled = false;
          btn.textContent = "✨ Write Script with Gemini API";
        });

        this.querySelector("#btnBuildStoryboard").addEventListener("click", async () => {
          const raw = this.querySelector("#fullScriptBox").value.trim();
          if (!raw) return;
          store.pushUndo();
          const paras = raw.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
          store.shots = paras.map((p, i) => window.StickForgeAI.parseParagraphToShot(p, i));
          store.currentShotIndex = 0;
          store.currentTime = 0;
          store.shotElapsed = 0;
          window.StickForgeBus.emit("shots:updated");
          document.querySelector('[data-left-tab="shots"]')?.click();

          if (store.defaultGoogleFlowBg) {
            window.StickForgeBus.emit("status:toast", { message: `🌊 Generating Google Flow 2D backgrounds for ${store.shots.length} shots...` });
            for (let i = 0; i < store.shots.length; i++) {
              const s = store.shots[i];
              window.StickForgeBus.emit("status:toast", { message: `🌊 Google Flow 2D BG (${i + 1}/${store.shots.length})...` });
              await window.StickForgeAI.generateGoogleFlowBackground(s, s.bgPrompt);
            }
            window.StickForgeBus.emit("status:toast", { message: `🌊 Built ${store.shots.length} shots with Google Flow 2D backgrounds!` });
          }
        });
      }

    // 6. <sf-stage-canvas> Component (Interactive 2D Stage + AI Director Bar)

    class SfStageCanvas extends HTMLElement {
      connectedCallback() {
        this.render();
        this.canvas = this.querySelector("#mainStageCanvas");
        this.ctx = this.canvas.getContext("2d");
        this.draggingIdx = -1;
        this.lastFrameTs = 0;
        this.lastSpokenShotId = null;

        this.setupCanvasInteractions();
        window.StickForgeBus.on("stage:ratio", () => this.updateRatio());
        window.StickForgeBus.on("video:export", () => this.exportWebmVideo());
        requestAnimationFrame((ts) => this.loop(ts));
      }

      updateRatio() {
        const store = window.StickForgeStore;
        if (store.aspectRatio === "9:16") {
          this.canvas.width = 540;
          this.canvas.height = 960;
        } else {
          this.canvas.width = 960;
          this.canvas.height = 540;
        }
      }

      render() {
        this.innerHTML = `
          <div class="flex items-center justify-between text-xs mb-2">
            <div class="flex items-center gap-2">

              </label>
              <label class="flex items-center gap-1 text-slate-300 cursor-pointer">
                <input id="chkBadges" type="checkbox" checked class="accent-indigo-500" />
                <span>Overhead Metrics</span>
              </label>
            </div>
          </div>

          <div class="flex-1 flex items-center justify-center canvas-checker rounded-xl border border-studio-border p-2 relative overflow-hidden min-h-[250px]">
            <canvas id="mainStageCanvas" width="960" height="540" class="max-w-full max-h-full rounded-lg shadow-2xl cursor-grab active:cursor-grabbing bg-slate-900"></canvas>
            <div id="recBadge" class="hidden absolute top-4 right-4 bg-rose-600 text-white px-3 py-1 rounded-full text-xs font-bold animate-pulse">● REC .WEBM</div>
          </div>

          <div class="mt-2.5 bg-studio-panel border border-studio-border rounded-xl p-2.5">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-bold text-indigo-400">⚡ Ask AI Director to Edit Current Shot:</span>
              <div class="flex gap-1">
                <button type="button" data-quick-dir="Make everyone celebrate with trophies" class="quick-dir-btn text-[10px] px-2 py-0.5 rounded bg-studio-card hover:bg-slate-700 text-slate-300 border border-studio-border">Everyone Celebrates</button>
                <button type="button" data-quick-dir="Switch to auditorium and shake camera" class="quick-dir-btn text-[10px] px-2 py-0.5 rounded bg-studio-card hover:bg-slate-700 text-slate-300 border border-studio-border">Auditorium Shake</button>
              </div>
            </div>
            <div class="flex gap-2">
              <input id="directorInput" type="text" placeholder="e.g., 'Change Oliver badge to 195 IQ in green and make him celebrate'..." class="flex-1 bg-studio-bg border border-studio-border rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500" />
              <button id="btnApplyDirector" type="button" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold">Apply</button>
              <button id="btnUndoDirector" type="button" class="px-2.5 py-1.5 rounded-lg bg-studio-card hover:bg-slate-800 border border-studio-border text-slate-300 text-xs">Undo</button>
            </div>
          </div>
        `;

        this.querySelector("#chkCaptions").addEventListener("change", (e) => {
          window.StickForgeStore.showCaptions = e.target.checked;
        });
        this.querySelector("#chkBadges").addEventListener("change", (e) => {
          window.StickForgeStore.showBadges = e.target.checked;
        });

        this.querySelector("#btnApplyDirector").addEventListener("click", () => {
          const inp = this.querySelector("#directorInput");
          this.applyNaturalEdit(inp.value);
          inp.value = "";
        });
        this.querySelectorAll(".quick-dir-btn").forEach(b => {
          b.addEventListener("click", () => this.applyNaturalEdit(b.dataset.quickDir));
        });
        this.querySelector("#btnUndoDirector").addEventListener("click", () => {
          window.StickForgeStore.undo();
        });
      }

      applyNaturalEdit(text) {
        if (!text) return;
        const store = window.StickForgeStore;
        store.pushUndo();
        const shot = store.getCurrentShot();
        const p = text.toLowerCase();
        if (p.includes("auditorium")) shot.setting = "auditorium";
        else if (p.includes("library")) shot.setting = "library";
        else if (p.includes("classroom")) shot.setting = "classroom";
        else if (p.includes("park")) shot.setting = "park";
        if (p.includes("shake")) shot.camera = "shake";
        if (p.includes("zoom in")) shot.camera = "zoom_in";

        (shot.characters || []).forEach(c => {
          if (p.includes("celebrate")) { c.action = "celebrate"; c.expr = "happy"; }
          if (p.includes("trophy") || p.includes("trophies")) c.prop = "trophy";
          const m = text.match(/\b(\d+\s*IQ|YES|NO)\b/i);
          if (m) c.badgeText = m[0].toUpperCase();
        });
        window.StickForgeBus.emit("shots:updated");
        window.StickForgeBus.emit("status:toast", { message: `Applied AI Director edit: "${text}"` });
      }

      setupCanvasInteractions() {
        const getCoords = (e) => {
          const r = this.canvas.getBoundingClientRect();
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          return { xPct: ((cx - r.left) / r.width) * 100, yPct: ((cy - r.top) / r.height) * 100 };
        };

        this.canvas.addEventListener("mousedown", (e) => {
          const store = window.StickForgeStore;
          const shot = store.getCurrentShot();
          const { xPct, yPct } = getCoords(e);
          for (let i = (shot.characters || []).length - 1; i >= 0; i--) {
            const ch = shot.characters[i];
            if (Math.abs(xPct - ch.x) < 10 && (ch.y - yPct) >= -6 && (ch.y - yPct) <= 42) {
              store.selectedCharIndex = i;
              this.draggingIdx = i;
              window.StickForgeBus.emit("char:selected", { index: i });
              break;
            }
          }
        });

        window.addEventListener("mousemove", (e) => {
          if (this.draggingIdx === -1) return;
          const shot = window.StickForgeStore.getCurrentShot();
          const ch = shot.characters?.[this.draggingIdx];
          if (!ch) return;
          const { xPct, yPct } = getCoords(e);
          ch.x = Math.round(Math.max(10, Math.min(90, xPct)));
          ch.y = Math.round(Math.max(50, Math.min(92, yPct)));
          window.StickForgeBus.emit("char:moved");
        });

        window.addEventListener("mouseup", () => {
          this.draggingIdx = -1;
        });
      }

      loop(nowMs) {
        const store = window.StickForgeStore;
        if (!this.lastFrameTs) this.lastFrameTs = nowMs;
        const dt = Math.min(0.1, (nowMs - this.lastFrameTs) / 1000) * store.playbackSpeed;
        this.lastFrameTs = nowMs;

        const shot = store.getCurrentShot();
        if (shot) {
          const badge = this.querySelector("#stageShotBadge");
          if (badge) badge.textContent = `Shot ${store.currentShotIndex + 1} / ${store.shots.length} · ${shot.setting}`;

          if (store.isPlaying) {
            const dur = Number(shot.duration) || 5;
            if (this.lastSpokenShotId !== shot.id) {
              this.lastSpokenShotId = shot.id;
              window.StickForgeRenderer.playSfx(shot.sfx);
              if (store.enableSpeech) {
                if (store.shotAudioUrls[shot.id]) {
                  const a = new Audio(store.shotAudioUrls[shot.id]);
                  a.play().catch(() => {});
                } else if ("speechSynthesis" in window) {
                  window.speechSynthesis.cancel();
                  window.speechSynthesis.speak(new SpeechSynthesisUtterance(shot.narration.replace(/\[[^\]]+\]/g, "")));
                }
              }
            }
            store.shotElapsed += dt;
            store.currentTime = store.getShotStartTime(store.currentShotIndex) + store.shotElapsed;
            if (store.shotElapsed >= dur) {
              if (store.loopShot) {
                store.shotElapsed = 0;
                this.lastSpokenShotId = null;
              } else if (store.currentShotIndex < store.shots.length - 1) {
                store.currentShotIndex++;
                store.shotElapsed = 0;
                window.StickForgeBus.emit("shot:selected", { index: store.currentShotIndex });
              } else {
                store.isPlaying = false;
                this.lastSpokenShotId = null;
                window.StickForgeBus.emit("playback:changed");
              }
            }
            window.StickForgeBus.emit("time:tick");
          } else {
            this.lastSpokenShotId = null;
          }

          // Render 2D Stage
          const W = this.canvas.width, H = this.canvas.height;
          const tSec = nowMs / 1000;
          const dur = Number(shot.duration) || 5;
          const prog = Math.max(0, Math.min(1, store.shotElapsed / dur));

          this.ctx.clearRect(0, 0, W, H);
          this.ctx.save();
          let zoom = shot.camera === "zoom_in" ? 1 + prog * 0.12 : shot.camera === "zoom_out" ? 1.12 - prog * 0.12 : 1.04;
          let panX = shot.camera === "pan_right" ? (0.5 - prog) * W * 0.06 : shot.camera === "shake" && store.isPlaying ? Math.sin(tSec * 40) * 4 : 0;
          this.ctx.translate(W / 2 + panX, H / 2);
          this.ctx.scale(zoom, zoom);
          this.ctx.translate(-W / 2, -H / 2);

          window.StickForgeRenderer.drawRichEnvironment(this.ctx, W, H, shot.setting, store.visualStyle, tSec, shot);
          (shot.characters || []).forEach((ch, idx) => {
            window.StickForgeRenderer.drawStickCharacter(
              this.ctx, W, H, ch, idx, !store.isPlaying && idx === store.selectedCharIndex, store.visualStyle, tSec, store.isPlaying
            );
          });
          this.ctx.restore();

          window.StickForgeRenderer.drawTimedCaptions(this.ctx, W, H, shot.narration, store.shotElapsed, dur);
        }

        requestAnimationFrame((ts) => this.loop(ts));
      }

      exportWebmVideo() {
        const store = window.StickForgeStore;
        window.StickForgeRenderer.ensureAudio();
        const stream = this.canvas.captureStream(30);
        const rec = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm" });
        const chunks = [];
        rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        rec.onstop = () => {
          this.querySelector("#recBadge").classList.add("hidden");
          const blob = new Blob(chunks, { type: "video/webm" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "stickforge_v3_video.webm";
          a.click();
          window.StickForgeBus.emit("status:toast", { message: "Downloaded stickforge_v3_video.webm!" });
        };
        store.currentShotIndex = 0;
        store.shotElapsed = 0;
        store.currentTime = 0;
        store.isPlaying = true;
        window.StickForgeBus.emit("playback:changed");
        this.querySelector("#recBadge").classList.remove("hidden");
        rec.start(200);
        const timer = setInterval(() => {
          if (!store.isPlaying) {
            clearInterval(timer);
            if (rec.state === "recording") rec.stop();
          }
        }, 250);
      }
    }
    customElements.define("sf-stage-canvas", SfStageCanvas);

                    <option value="#facc15">Yellow (Max)</option>
                    <option value="#3b82f6">Blue (Oliver)</option>
                    <option value="#10b981">Emerald (Jake)</option>
                    <option value="#ec4899">Rose (Mom)</option>
                    <option value="#a855f7">Purple</option>
                    <option value="stick">Pure Stickman</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-1.5 bg-studio-bg p-2 rounded border border-studio-border">
                <div class="col-span-2">
                  <label class="block text-[10px] font-mono text-indigo-300">Overhead Metric</label>
                  <input id="inspBadgeText" type="text" class="w-full bg-studio-panel border border-studio-border rounded px-2 py-1 text-white font-bold" />
                </div>
                <div>
                  <label class="block text-[10px] font-mono text-slate-400">Glow</label>
                  <select id="inspBadgeColor" class="w-full bg-studio-panel border border-studio-border rounded px-1 py-1 text-white">
                    <option value="#22c55e">Green</option>
                    <option value="#ef4444">Red</option>
                    <option value="#f59e0b">Amber</option>
                    <option value="#38bdf8">Cyan</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] text-slate-400">Expression</label>
                  <select id="inspExpr" class="w-full bg-studio-bg border border-studio-border rounded px-2 py-1 text-white">
                    <option value="neutral">Neutral</option>
                    <option value="happy">Happy</option>
                    <option value="smug">Smug</option>
                    <option value="shocked">Shocked</option>
                    <option value="thinking">Thinking</option>
                  </select>
                </div>
                <div>
                  <label class="block text-[10px] text-slate-400">Action</label>
                  <select id="inspAction" class="w-full bg-studio-bg border border-studio-border rounded px-2 py-1 text-white">
                    <option value="idle">Idle</option>
                    <option value="talk">Talking</option>
                    <option value="point">Pointing</option>
                    <option value="study">Studying</option>
                    <option value="celebrate">Celebrate</option>
                    <option value="walk">Walking</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        `;

        const store = window.StickForgeStore;
        this.querySelector("#inspSetting").addEventListener("change", (e) => {
          store.getCurrentShot().setting = e.target.value;
          window.StickForgeBus.emit("shots:updated");
        });
        this.querySelector("#inspCamera").addEventListener("change", (e) => {
          store.getCurrentShot().camera = e.target.value;
          window.StickForgeBus.emit("shots:updated");
        });
        this.querySelector("#inspDefaultFlow").addEventListener("change", (e) => {
          store.defaultGoogleFlowBg = e.target.checked;
        });
        this.querySelector("#btnGenFlowSingle").addEventListener("click", async () => {
          const btn = this.querySelector("#btnGenFlowSingle");
          const prompt = this.querySelector("#inspBgPrompt").value.trim();
          btn.disabled = true;
          btn.textContent = "🌊 Generating Google Flow BG...";
          const res = await window.StickForgeAI.generateGoogleFlowBackground(store.getCurrentShot(), prompt);
          btn.disabled = false;
          btn.textContent = "🌊 Generate with Google Flow";
          window.StickForgeBus.emit("status:toast", { message: `🌊 Generated 2D BG via ${res.provider}!` });
        });

        this.querySelector("#btnAddChar").addEventListener("click", () => {
          const shot = store.getCurrentShot();
          shot.characters.push({
            id: "c_" + Date.now(),
            name: "Actor " + (shot.characters.length + 1),
            outfit: "#a855f7",
            badgeText: "140 IQ",
            badgeColor: "#38bdf8",
            expr: "happy",
            action: "idle",
            prop: "none",
            scale: 1.0,
            x: 50,
            y: 80,
            flip: false
          });
          store.selectedCharIndex = shot.characters.length - 1;
          window.StickForgeBus.emit("shots:updated");
        });

        const bindCharField = (sel, key) => {
          this.querySelector(sel).addEventListener("input", (e) => {
            const ch = store.getCurrentShot().characters?.[store.selectedCharIndex];
            if (ch) {
              ch[key] = e.target.value;
              window.StickForgeBus.emit("shots:updated");
            }
          });
        };
        bindCharField("#inspCharName", "name");
        bindCharField("#inspCharOutfit", "outfit");
        bindCharField("#inspBadgeText", "badgeText");
        bindCharField("#inspBadgeColor", "badgeColor");
        bindCharField("#inspExpr", "expr");
        bindCharField("#inspAction", "action");

        this.syncForm();
      }

      syncForm() {
        const store = window.StickForgeStore;
        const shot = store.getCurrentShot();
        if (!shot) return;
        this.querySelector("#inspSetting").value = shot.setting;
        this.querySelector("#inspCamera").value = shot.camera;
        this.querySelector("#inspBgPrompt").value = shot.bgPrompt || "";

        const pills = this.querySelector("#inspCharPills");
        pills.innerHTML = "";
        (shot.characters || []).forEach((ch, idx) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = `px-2 py-0.5 rounded text-[11px] font-medium border ${
            idx === store.selectedCharIndex ? "bg-indigo-600 text-white border-indigo-400" : "bg-studio-bg text-slate-300 border-studio-border"
          }`;
          b.textContent = `${ch.name} (${ch.badgeText})`;
          b.addEventListener("click", () => {
            store.selectedCharIndex = idx;
            this.syncForm();
          });
          pills.appendChild(b);
        });

        const active = shot.characters?.[store.selectedCharIndex];
        if (active) {
          this.querySelector("#inspCharName").value = active.name || "";
          this.querySelector("#inspCharOutfit").value = active.outfit || "#facc15";
          this.querySelector("#inspBadgeText").value = active.badgeText || "";
          this.querySelector("#inspBadgeColor").value = active.badgeColor || "#22c55e";
          this.querySelector("#inspExpr").value = active.expr || "neutral";
          this.querySelector("#inspAction").value = active.action || "idle";
        }
      }
    }
    customElements.define("sf-inspector", SfInspector);

    // ---------------------------------------------------------------------
    // 8. <sf-timeline> Component
    // ---------------------------------------------------------------------
    class SfTimeline extends HTMLElement {
      connectedCallback() {
        this.render();
        window.StickForgeBus.on("shots:updated", () => this.renderTracks());
        window.StickForgeBus.on("shot:selected", () => this.renderTracks());
        window.StickForgeBus.on("playback:changed", () => this.syncPlayBtn());
        window.StickForgeBus.on("time:tick", () => this.syncTimeReadout());
      }

      render() {
        this.innerHTML = `
          <footer class="bg-studio-panel border-t border-studio-border px-3 py-2 h-[125px] flex flex-col justify-between z-20">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <button id="btnPlayPause" type="button" class="px-3.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow">
                  ▶ Play Movie
                </button>
                <button id="btnStop" type="button" class="px-2.5 py-1 rounded-lg bg-studio-card hover:bg-slate-800 border border-studio-border text-slate-300 text-xs">
                  ■ Reset
                </button>
                <span id="tlTimecode" class="font-mono text-xs text-slate-300 bg-studio-bg px-2 py-0.5 rounded border border-studio-border">00:00.0 / 00:31.5</span>
              </div>
              <span class="text-[11px] text-slate-400 font-mono hidden sm:inline">Decoupled Web-Component Architecture v3.0</span>
            </div>

            <div id="tlTrackBar" class="flex h-9 rounded-lg overflow-x-auto bg-studio-bg border border-studio-border gap-0.5 p-0.5"></div>
          </footer>
        `;

        const store = window.StickForgeStore;
        this.querySelector("#btnPlayPause").addEventListener("click", () => {
          window.StickForgeRenderer.ensureAudio();
          store.isPlaying = !store.isPlaying;
          if (!store.isPlaying && "speechSynthesis" in window) window.speechSynthesis.cancel();
          this.syncPlayBtn();
        });
        this.querySelector("#btnStop").addEventListener("click", () => {
          store.isPlaying = false;
          if ("speechSynthesis" in window) window.speechSynthesis.cancel();
          store.currentShotIndex = 0;
          store.shotElapsed = 0;
          store.currentTime = 0;
          this.syncPlayBtn();
          this.renderTracks();
          this.syncTimeReadout();
        });

        this.renderTracks();
        this.syncTimeReadout();
      }

      syncPlayBtn() {
        const b = this.querySelector("#btnPlayPause");
        if (b) b.textContent = window.StickForgeStore.isPlaying ? "⏸ Pause" : "▶ Play Movie";
      }

      syncTimeReadout() {
        const store = window.StickForgeStore;
        const el = this.querySelector("#tlTimecode");
        if (el) {
          el.textContent = `${store.currentTime.toFixed(1)}s / ${store.getTotalDuration().toFixed(1)}s`;
        }
      }

      renderTracks() {
        const bar = this.querySelector("#tlTrackBar");
        if (!bar) return;
        const store = window.StickForgeStore;
        const total = Math.max(1, store.getTotalDuration());
        bar.innerHTML = "";
        store.shots.forEach((s, idx) => {
          const wPct = ((Number(s.duration) || 5) / total) * 100;
          const clip = document.createElement("div");
          clip.style.width = `${wPct}%`;
          clip.style.minWidth = "68px";
          clip.className = `h-full shrink-0 rounded px-2 flex items-center justify-between text-[10px] font-medium cursor-pointer truncate transition ${
            idx === store.currentShotIndex ? "bg-indigo-600 text-white" : "bg-studio-card text-slate-300 hover:bg-slate-800"
          }`;
          clip.textContent = `${idx + 1}. ${s.setting} (${s.duration}s)`;
          clip.addEventListener("click", () => {
            store.currentShotIndex = idx;
            store.shotElapsed = 0;
            store.currentTime = store.getShotStartTime(idx);
            window.StickForgeBus.emit("shot:selected", { index: idx });
          });
          bar.appendChild(clip);
        });
      }
    }
    customElements.define("sf-timeline", SfTimeline);

    // ---------------------------------------------------------------------
    // 9. <sf-api-modal> & <sf-module-exporter-modal> Components
    // ---------------------------------------------------------------------
    class SfApiModal extends HTMLElement {
      connectedCallback() {
        this.render();
        window.StickForgeBus.on("modal:api:open", () => {
          this.querySelector("#apiModalBackdrop").classList.remove("hidden");
        });
      }

      render() {
        const store = window.StickForgeStore;
        this.innerHTML = `
          <div id="apiModalBackdrop" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-studio-panel border border-studio-border rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4 text-xs">
              <div class="flex items-center justify-between border-b border-studio-border pb-2.5">
                <h3 class="text-sm font-bold text-white">🔑 Gemini &amp; Google Flow API Configuration</h3>
                <button id="btnCloseApi" type="button" class="text-slate-400 hover:text-white font-bold">✕</button>
              </div>
              <div class="space-y-2.5">
                <div>
                  <label class="block text-[11px] text-slate-300 mb-0.5">Gemini API Key (Used for Script Gen, Style Cloning, Google Flow BG &amp; 3.1 TTS)</label>
                  <input id="modalGeminiKey" type="password" value="${store.api.llmKey}" placeholder="AIza... (Leave blank in Canvas runtime for auto-injection)" class="w-full bg-studio-bg border border-studio-border rounded-lg px-2.5 py-1.5 text-white font-mono" />
                </div>
                <div>
                  <label class="block text-[11px] text-slate-300 mb-0.5">Gemini Script &amp; Style Model</label>
                  <input id="modalGeminiModel" type="text" value="${store.api.llmModel}" class="w-full bg-studio-bg border border-studio-border rounded-lg px-2.5 py-1.5 text-white font-mono" />
                </div>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button id="btnSaveApi" type="button" class="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold">Save &amp; Apply</button>
              </div>
            </div>
          </div>
        `;

        this.querySelector("#btnCloseApi").addEventListener("click", () => {
          this.querySelector("#apiModalBackdrop").classList.add("hidden");
        });
        this.querySelector("#btnSaveApi").addEventListener("click", () => {
          const key = this.querySelector("#modalGeminiKey").value.trim();
          store.api.llmKey = key;
          store.api.ttsKey = key;
          store.api.imgKey = key;
          store.api.llmModel = this.querySelector("#modalGeminiModel").value.trim() || "gemini-3-flash-preview";
          try {
            localStorage.setItem("stickforge_v3_api", JSON.stringify(store.api));
          } catch (e) {}
          this.querySelector("#apiModalBackdrop").classList.add("hidden");
          window.StickForgeBus.emit("status:toast", { message: "Saved Gemini API configuration!" });
        });
      }
    }
    customElements.define("sf-api-modal", SfApiModal);

    // Multi-File ES Module Exporter Modal (lets user download each module separately for GitHub)
    class SfModuleExporterModal extends HTMLElement {
      connectedCallback() {
        this.render();
        window.StickForgeBus.on("modal:exporter:open", () => {
          this.querySelector("#exporterBackdrop").classList.remove("hidden");
        });
      }

      downloadFile(filename, content) {
        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
      }

      render() {
        this.innerHTML = `
          <div id="exporterBackdrop" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-studio-panel border border-studio-border rounded-2xl max-w-lg w-full p-5 shadow-2xl space-y-4 text-xs">
              <div class="flex items-center justify-between border-b border-studio-border pb-2.5">
                <div>
                  <h3 class="text-sm font-bold text-white">📦 Modular Web-Component File Splitter</h3>
                  <p class="text-[11px] text-slate-400">Download decoupled ES module files ready to push to your GitHub repo.</p>
                </div>
                <button id="btnCloseExporter" type="button" class="text-slate-400 hover:text-white font-bold">✕</button>
              </div>

              <div class="space-y-2">
                <div class="flex items-center justify-between p-2.5 rounded-lg bg-studio-card border border-studio-border">
                  <div>
                    <span class="font-mono font-bold text-indigo-300">1. store.js</span>
                    <p class="text-[11px] text-slate-400">Central EventBus &amp; State Store (upgradeable state schema)</p>
                  </div>
                  <button type="button" data-dl-mod="store.js" class="dl-mod-btn px-2.5 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Download</button>
                </div>

                <div class="flex items-center justify-between p-2.5 rounded-lg bg-studio-card border border-studio-border">
                  <div>
                    <span class="font-mono font-bold text-emerald-300">2. services-ai.js</span>
                    <p class="text-[11px] text-slate-400">Gemini Script Gen, YT Style Cloner, Google Flow &amp; 3.1 TTS</p>
                  </div>
                  <button type="button" data-dl-mod="services-ai.js" class="dl-mod-btn px-2.5 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Download</button>
                </div>

                <div class="flex items-center justify-between p-2.5 rounded-lg bg-studio-card border border-studio-border">
                  <div>
                    <span class="font-mono font-bold text-amber-300">3. renderer-2d.js</span>
                    <p class="text-[11px] text-slate-400">2D Cel-Shaded Environment, Stickman Rig &amp; WebAudio Engine</p>
                  </div>
                  <button type="button" data-dl-mod="renderer-2d.js" class="dl-mod-btn px-2.5 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Download</button>
                </div>

                <div class="flex items-center justify-between p-2.5 rounded-lg bg-studio-card border border-studio-border">
                  <div>
                    <span class="font-mono font-bold text-pink-300">4. components.js</span>
                    <p class="text-[11px] text-slate-400">All 9 Custom Web Components (&lt;sf-style-cloner&gt;, &lt;sf-script-writer&gt;, etc.)</p>
                  </div>
                  <button type="button" data-dl-mod="components.js" class="dl-mod-btn px-2.5 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Download</button>
                </div>
              </div>
            </div>
          </div>
        `;

        this.querySelector("#btnCloseExporter").addEventListener("click", () => {
          this.querySelector("#exporterBackdrop").classList.add("hidden");
        });

        this.querySelectorAll(".dl-mod-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const file = btn.dataset.dlMod;
            if (file === "store.js") this.downloadFile("store.js", document.getElementById("module-store").textContent);
            else if (file === "services-ai.js") this.downloadFile("services-ai.js", document.getElementById("module-ai-services").textContent);
            else if (file === "renderer-2d.js") this.downloadFile("renderer-2d.js", document.getElementById("module-renderer-2d").textContent);
            else if (file === "components.js") this.downloadFile("components.js", document.getElementById("module-components").textContent);
          });
        });
      }
    }
    customElements.define("sf-module-exporter-modal", SfModuleExporterModal);

    // Tab Switcher Wiring for Left Column
    document.querySelectorAll(".left-tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const target = btn.dataset.leftTab;
        document.querySelectorAll(".left-tab-btn").forEach(b => {
          const active = b.dataset.leftTab === target;
          b.classList.toggle("border-indigo-500", active);
          b.classList.toggle("text-white", active);
          b.classList.toggle("border-transparent", !active);
          b.classList.toggle("text-slate-400", !active);
        });
        ["script", "style", "shots", "voice"].forEach(id => {
          const el = document.getElementById(`tabPanel_${id}`);
          if (el) el.classList.toggle("hidden", id !== target);
        });
      });
    });
  </script>
