    class StickForgeEventBus {
      constructor() { this.listeners = {}; }
      on(event, cb) {
        if (!this.listeners[event]) this.listeners[event] = [];
        this.listeners[event].push(cb);
      }
      emit(event, detail = {}) {
        (this.listeners[event] || []).forEach(cb => {
          try { cb(detail); } catch (err) { console.error(`Bus error [${event}]:`, err); }
        });
      }
    }

          delay *= 2;

      // 5. Gemini 3.1 / 2.5 Flash TTS Audio Synthesizer (PCM16 -> WAV Container + BYOK Support)
      pcm16Base64ToWavUrl(base64Data, sampleRate = 24000) {
        const binaryStr = atob(base64Data);
        const len = binaryStr.length;
        const pcmBytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) pcmBytes[i] = binaryStr.charCodeAt(i);
        const wavHeader = new ArrayBuffer(44);
        const view = new DataView(wavHeader);
        const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
        writeStr(0, "RIFF");
        view.setUint32(4, 36 + pcmBytes.byteLength, true);
        writeStr(8, "WAVE");
        writeStr(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);

                const mime = part?.inlineData?.mimeType || "audio/L16;rate=24000";
                if (b64) {
                  const rateMatch = mime.match(/rate=(\d+)/);
                  const rate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;

              store.shotAudioUrls[shot.id] = URL.createObjectURL(blob);
              window.StickForgeBus.emit("shots:updated");
              window.StickForgeBus.emit("status:toast", { message: `🔊 ElevenLabs audio attached to Shot ${shotIdx + 1}!` });
              return true;
            }
          } catch (e) {}
        }

        // 3. OpenAI TTS BYOK
        if (prov === "openai_tts" && store.api.ttsKey) {
          try {
            const res = await fetch("https://api.openai.com/v1/audio/speech", {
              method: "POST",
              headers: { "Authorization": `Bearer ${store.api.ttsKey}`, "Content-Type": "application/json" },

      drawSocketObject(ctx, objId, scale) {
        if (!objId || objId === "none") return;
        const objDef = window.SF_MODEL_GALLERY.objectModels.find(o => o.id === objId);
        if (!objDef || !Array.isArray(objDef.shapes)) return;
        ctx.save();
        objDef.shapes.forEach(sh => {
          ctx.fillStyle = sh.fill || "#ffffff";
          ctx.strokeStyle = sh.stroke || "#0f172a";
          ctx.lineWidth = (sh.lw || 2.5) * scale;
          if (sh.type === "rect" || sh.type === "roundRect") {
            ctx.beginPath();
            if (sh.type === "roundRect" && ctx.roundRect) {
              ctx.roundRect(sh.x * scale, sh.y * scale, sh.w * scale, sh.h * scale, (sh.r || 4) * scale);
            } else {
              ctx.rect(sh.x * scale, sh.y * scale, sh.w * scale, sh.h * scale);
            }
            if (sh.fill !== "none") ctx.fill();
            if (sh.stroke !== "none") ctx.stroke();
          } else if (sh.type === "circle") {
            ctx.beginPath();
            ctx.arc(sh.x * scale, sh.y * scale, sh.r * scale, 0, Math.PI * 2);
            if (sh.fill !== "none") ctx.fill();
            if (sh.stroke !== "none") ctx.stroke();
          } else if (sh.type === "line") {
            ctx.beginPath();
            ctx.moveTo(sh.x1 * scale, sh.y1 * scale);
            ctx.lineTo(sh.x2 * scale, sh.y2 * scale);
            ctx.stroke();
          } else if (sh.type === "polygon" && Array.isArray(sh.points)) {
            ctx.beginPath();
            sh.points.forEach((pt, idx) => {
              if (idx === 0) ctx.moveTo(pt[0] * scale, pt[1] * scale);
              else ctx.lineTo(pt[0] * scale, pt[1] * scale);
            });
            ctx.closePath();
            if (sh.fill !== "none") ctx.fill();
            if (sh.stroke !== "none") ctx.stroke();
          } else if (sh.type === "text") {
            ctx.fillStyle = sh.color || "#0f172a";
            ctx.font = `800 ${Math.round((sh.size || 13) * scale)}px "Inter", sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(sh.text, sh.x * scale, sh.y * scale);
          }
        });
        ctx.restore();
      },

      // Interpolate pose between keyframes from SF_MOTION_LIBRARY
      sampleActionPose(actionId, tSec, charIndex = 0) {
        const motion = window.SF_MOTION_LIBRARY[actionId] || window.SF_MOTION_LIBRARY.idle;
        const frames = motion.frames || window.SF_MOTION_LIBRARY.idle.frames;
        if (frames.length === 1) return frames[0];
        const speed = motion.loopSpeed || 4.0;
        const rawPhase = (tSec * speed + charIndex * 0.7) % frames.length;
        const idxA = Math.floor(rawPhase);
        const idxB = (idxA + 1) % frames.length;
        const frac = 0.5 - 0.5 * Math.cos((rawPhase - idxA) * Math.PI); // Smooth cosine easing
        const fA = frames[idxA], fB = frames[idxB];
        const pose = {};
        for (const k of Object.keys(fA)) {
          pose[k] = fA[k] + (fB[k] - fA[k]) * frac;
        }
        return pose;
      },

      // Main Articulated Character & Animal Renderer
      drawStickCharacter(ctx, W, H, char, index, isSelected, styleMode, tSec, isTalkingNow, overridePose = null) {
        const store = window.StickForgeStore;
        const modelDef = window.SF_MODEL_GALLERY.characterModels.find(m => m.id === char.modelId) || window.SF_MODEL_GALLERY.characterModels[0];
        const cx = (Number(char.x) / 100) * W;
        const cy = (Number(char.y) / 100) * H;
        const scale = (Number(char.scale) || 1.0) * (H / 540);
        const dir = char.flip ? -1 : 1;

        const strokeMain = styleMode === "neon" ? "#f8fafc" : "#0f172a";
        const lineW = (styleMode === "mspaint" ? 4.5 : 5.5) * scale;

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // -----------------------------------------------------------------
        // QUADRUPED ANIMAL STICK MODEL (Dog, Cat, etc.)
        // -----------------------------------------------------------------
        if (modelDef.category === "animal") {
          const bodyLen = (modelDef.bodyLength || 60) * scale;
          const legLen = (modelDef.legLength || 32) * scale;
          const headR = 19 * (modelDef.headScale || 0.85) * scale;
          const isMoving = char.action === "walk" || char.action === "run" || char.action === "celebrate";
          const stride = isMoving ? Math.sin(tSec * 10 + index) * 14 * scale : 0;
          const bounce = isMoving ? Math.abs(Math.cos(tSec * 10 + index)) * 5 * scale : Math.sin(tSec * 3) * 1.5 * scale;

          const hipX = cx - (bodyLen * 0.45) * dir;
          const shoulderX = cx + (bodyLen * 0.45) * dir;
          const spineY = cy - legLen - bounce;

          // Shadow
          ctx.fillStyle = "rgba(15,23,42,0.22)";
          ctx.beginPath(); ctx.ellipse(cx, cy + 4 * scale, bodyLen * 0.65, 7 * scale, 0, 0, Math.PI * 2); ctx.fill();

          // Wagging Tail
          const wag = Math.sin(tSec * 12 + index) * 10 * scale;
          ctx.strokeStyle = strokeMain; ctx.lineWidth = lineW * 0.85;
          ctx.beginPath();
          ctx.moveTo(hipX, spineY);
          ctx.quadraticCurveTo(hipX - 18 * scale * dir, spineY - 18 * scale + wag, hipX - 26 * scale * dir, spineY - 26 * scale + wag);
          ctx.stroke();

          // 4 Articulated Legs with Knees & Paws
          const drawAnimalLeg = (topX, topY, swing, kneeBend) => {
            const kneeX = topX + swing * 0.5 + kneeBend * dir;
            const kneeY = topY + legLen * 0.52;
            const pawX = topX + swing;
            const pawY = cy;
            ctx.beginPath();
            ctx.moveTo(topX, topY); ctx.lineTo(kneeX, kneeY); ctx.lineTo(pawX, pawY);
            ctx.stroke();
            // Paw pad
            ctx.fillStyle = char.outfit || modelDef.defaultColor || "#f59e0b";
            ctx.beginPath(); ctx.ellipse(pawX + 3 * scale * dir, pawY, 5.5 * scale, 3.2 * scale, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          };
          drawAnimalLeg(hipX - 4 * scale, spineY, -stride, -4 * scale);
          drawAnimalLeg(hipX + 4 * scale, spineY, stride, -4 * scale);
          drawAnimalLeg(shoulderX - 4 * scale, spineY, stride, 4 * scale);
          drawAnimalLeg(shoulderX + 4 * scale, spineY, -stride, 4 * scale);

          // Pill Body
          ctx.fillStyle = char.outfit || modelDef.defaultColor || "#f59e0b";
          ctx.strokeStyle = strokeMain; ctx.lineWidth = lineW * 0.85;
          ctx.beginPath();
          ctx.roundRect(Math.min(hipX, shoulderX) - 10 * scale, spineY - 12 * scale, bodyLen + 20 * scale, 24 * scale, 12 * scale);
          ctx.fill(); ctx.stroke();

          // Animal Head
          const headX = shoulderX + 14 * scale * dir;
          const headY = spineY - 16 * scale;
          ctx.fillStyle = "#ffffff";
          ctx.beginPath(); ctx.arc(headX, headY, headR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

          // Ears
          ctx.fillStyle = char.outfit || modelDef.defaultColor || "#f59e0b";
          if (modelDef.ears === "pointed") {
            ctx.beginPath();
            ctx.moveTo(headX - 12 * scale, headY - 12 * scale);
            ctx.lineTo(headX - 6 * scale, headY - 28 * scale);
            ctx.lineTo(headX + 2 * scale, headY - 15 * scale);
            ctx.closePath(); ctx.fill(); ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.ellipse(headX - 10 * scale * dir, headY + 2 * scale, 6 * scale, 13 * scale, 0.3 * dir, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
          }

          // Eyes & Snout
          ctx.fillStyle = strokeMain;
          ctx.beginPath(); ctx.arc(headX + 6 * scale * dir, headY - 3 * scale, 2.8 * scale, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(headX + 16 * scale * dir, headY + 2 * scale, 3.8 * scale, 0, Math.PI * 2); ctx.fill();

          // Headwear attachment on Animal
          if (char.headwear && char.headwear !== "none") {
            ctx.save();
            ctx.translate(headX, headY - headR);
            this.drawSocketObject(ctx, char.headwear, scale * 0.8);
            ctx.restore();
          }

          // Floating Badge & Name
          this.drawBadgeAndName(ctx, headX, headY - headR, cx, cy, char, index, scale, styleMode, tSec, isSelected);
          ctx.restore();
          return;
        }

        // -----------------------------------------------------------------
        // ARTICULATED 16-JOINT HUMANOID / MECH STICKMAN RIG
        // -----------------------------------------------------------------
        const pose = overridePose || this.sampleActionPose(char.action || "idle", tSec, index);
        const headR = 25 * (modelDef.headScale || 1.0) * scale;
        const torsoLen = (modelDef.torsoLength || 66) * scale;
        const limbLen = (modelDef.limbLength || 52) * scale;
        const uArmLen = limbLen * 0.50, lArmLen = limbLen * 0.50;
        const uLegLen = limbLen * 0.54, lLegLen = limbLen * 0.54;

        const deg2rad = (d) => (d * Math.PI) / 180;
        const tiltRad = deg2rad((pose.torsoTilt || 0) * dir);

        const hipX = cx;
        const hipY = cy - (uLegLen + lLegLen) * 0.94 + (pose.bounceY || 0) * scale;
        const neckX = hipX + Math.sin(tiltRad) * torsoLen;
        const neckY = hipY - Math.cos(tiltRad) * torsoLen;
        const shoulderX = hipX + Math.sin(tiltRad) * (torsoLen * 0.84);
        const shoulderY = hipY - Math.cos(tiltRad) * (torsoLen * 0.84);
        const headX = neckX + Math.sin(deg2rad((pose.headNod || 0) * dir)) * (headR * 0.25);
        const headY = neckY - headR * 0.96;

        // Calculate Left & Right Leg Joints (Hip -> Knee -> Ankle -> Foot)
        const calcLimb = (origX, origY, upperDeg, lowerDeg, len1, len2) => {
          const a1 = deg2rad(upperDeg * dir);
          const midX = origX + Math.sin(a1) * len1;
          const midY = origY + Math.cos(a1) * len1;
          const a2 = a1 + deg2rad(lowerDeg * dir);
          const endX = midX + Math.sin(a2) * len2;
          const endY = midY + Math.cos(a2) * len2;
          return { midX, midY, endX, endY, endAngle: a2 };
        };

        const lLeg = calcLimb(hipX - 7 * scale, hipY, pose.lHip, pose.lKnee, uLegLen, lLegLen);
        const rLeg = calcLimb(hipX + 7 * scale, hipY, pose.rHip, pose.rKnee, uLegLen, lLegLen);
        const lArm = calcLimb(shoulderX - 13 * scale, shoulderY, pose.lShoulder, pose.lElbow, uArmLen, lArmLen);
        const rArm = calcLimb(shoulderX + 13 * scale, shoulderY, pose.rShoulder, pose.rElbow, uArmLen, lArmLen);

        // Ground shadow
        ctx.fillStyle = "rgba(15, 23, 42, 0.24)";
        ctx.beginPath(); ctx.ellipse(cx, cy + 5 * scale, 35 * scale, 8 * scale, 0, 0, Math.PI * 2); ctx.fill();

        // 1. BACK SOCKET ATTACHMENT (Backpack / Cape / Wings)
        if (char.backItem && char.backItem !== "none") {
          ctx.save();
          ctx.translate(shoulderX - 12 * scale * dir, shoulderY + 14 * scale);
          this.drawSocketObject(ctx, char.backItem, scale);
          ctx.restore();
        }

        // 2. UPPER & LOWER LEGS + KNEES + FEET/SHOES
        ctx.strokeStyle = strokeMain;
        ctx.lineWidth = lineW;
        [lLeg, rLeg].forEach((leg, lIdx) => {
          const startX = lIdx === 0 ? hipX - 7 * scale : hipX + 7 * scale;
          ctx.beginPath();
          ctx.moveTo(startX, hipY);
          ctx.lineTo(leg.midX, leg.midY);
          ctx.lineTo(leg.endX, leg.endY);
          ctx.stroke();

          // Articulated Sneaker / Foot
          if (modelDef.hasFeet !== false) {
            ctx.save();
            ctx.fillStyle = char.outfit && char.outfit !== "stick" ? char.outfit : "#f8fafc";
            ctx.strokeStyle = strokeMain;
            ctx.lineWidth = lineW * 0.65;
            ctx.beginPath();
            ctx.ellipse(leg.endX + 6 * scale * dir, leg.endY, 10.5 * scale, 4.8 * scale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
        });

        // 3. TORSO & CLOTHING STYLE (Hoodie, Blazer + Tie, Sweater, Suit, or Pure Stick)
        const cStyle = char.clothingStyle || "hoodie";
        if (char.outfit && char.outfit !== "stick" && cStyle !== "none" && styleMode !== "neon") {
          ctx.save();
          ctx.translate((neckX + hipX) / 2, (neckY + hipY) / 2);
          ctx.rotate(tiltRad);
          const tw = (modelDef.torsoWidth || 40) * scale;
          const th = torsoLen - 4 * scale;
          ctx.fillStyle = char.outfit;
          ctx.strokeStyle = strokeMain;
          ctx.lineWidth = lineW * 0.85;
          ctx.beginPath();
          ctx.roundRect(-tw / 2, -th / 2, tw, th, 12 * scale);
          ctx.fill(); ctx.stroke();

          if (cStyle === "blazer" || cStyle === "suit") {
            // White shirt V-neck & red tie
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.moveTo(-8 * scale, -th / 2);
            ctx.lineTo(8 * scale, -th / 2);
            ctx.lineTo(0, -th / 2 + 22 * scale);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#ef4444";
            ctx.fillRect(-2.5 * scale, -th / 2 + 8 * scale, 5 * scale, 22 * scale);
          } else if (cStyle === "hoodie") {
            // Hoodie drawstrings & kangaroo pocket
            ctx.beginPath();
            ctx.moveTo(-6 * scale, -th / 2 + 4 * scale); ctx.lineTo(-6 * scale, -th / 2 + 19 * scale);
            ctx.moveTo(6 * scale, -th / 2 + 4 * scale); ctx.lineTo(6 * scale, -th / 2 + 19 * scale);
            ctx.stroke();
          }
          ctx.restore();
        } else {
          ctx.strokeStyle = styleMode === "neon" ? (char.outfit !== "stick" ? char.outfit : "#38bdf8") : strokeMain;
          ctx.lineWidth = lineW;
          ctx.beginPath(); ctx.moveTo(neckX, neckY); ctx.lineTo(hipX, hipY); ctx.stroke();
        }

        // 4. LEFT ARM (Upper -> Elbow -> Forearm -> Hand + Left Hand Socket)
        const drawArticulatedArm = (arm, startX, handSocketId) => {
          ctx.strokeStyle = strokeMain;
          ctx.lineWidth = lineW;
          ctx.beginPath();
          ctx.moveTo(startX, shoulderY);
          ctx.lineTo(arm.midX, arm.midY);
          ctx.lineTo(arm.endX, arm.endY);
          ctx.stroke();

          // Articulated Hand Mitten / Palm
          if (modelDef.hasHands !== false) {
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = strokeMain;
            ctx.lineWidth = lineW * 0.65;
            ctx.beginPath();
            ctx.arc(arm.endX, arm.endY, 5.2 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }

          // Hand Socket Prop Attachment
          if (handSocketId && handSocketId !== "none") {
            ctx.save();
            ctx.translate(arm.endX, arm.endY);
            this.drawSocketObject(ctx, handSocketId, scale);
            ctx.restore();
          }
        };

        drawArticulatedArm(lArm, shoulderX - 13 * scale, char.handL);

        // 5. HEAD & 14 EXPRESSIONS
        ctx.fillStyle = styleMode === "neon" ? "#0f172a" : "#ffffff";
        ctx.strokeStyle = strokeMain;
        ctx.lineWidth = lineW * 0.9;
        ctx.beginPath();
        if (modelDef.headShape === "box") {
          ctx.roundRect(headX - headR, headY - headR, headR * 2, headR * 1.85, 8 * scale);
        } else {
          ctx.arc(headX, headY, headR, 0, Math.PI * 2);
        }
        ctx.fill(); ctx.stroke();

        if (modelDef.antenna) {
          ctx.beginPath();
          ctx.moveTo(headX, headY - headR); ctx.lineTo(headX, headY - headR - 12 * scale);
          ctx.stroke();
          ctx.fillStyle = "#38bdf8";
          ctx.beginPath(); ctx.arc(headX, headY - headR - 14 * scale, 4 * scale, 0, Math.PI * 2); ctx.fill();
        }

        this.drawFacialExpression(ctx, headX, headY, headR, char, scale, dir, strokeMain, tSec, isTalkingNow, index);

        // 6. HEADWEAR SOCKET ATTACHMENT (Crown, Cap, Headphones)
        if (char.headwear && char.headwear !== "none") {
          ctx.save();
          ctx.translate(headX, headY - headR * 0.92);
          this.drawSocketObject(ctx, char.headwear, scale);
          ctx.restore();
        }

        // 7. RIGHT ARM (Foreground Arm + Right Hand Socket)
        drawArticulatedArm(rArm, shoulderX + 13 * scale, char.handR || char.prop);

        // 8. OPTIONAL JOINT PINS VISUALIZER (For Rigging / Motion Studio Preview)
        if (store.showJointPins) {
          ctx.fillStyle = "#38bdf8";
          [[neckX, neckY], [hipX, hipY], [lArm.midX, lArm.midY], [rArm.midX, rArm.midY], [lLeg.midX, lLeg.midY], [rLeg.midX, rLeg.midY]].forEach(pt => {
            ctx.beginPath(); ctx.arc(pt[0], pt[1], 3.5 * scale, 0, Math.PI * 2); ctx.fill();
          });
        }

        // 9. OVERHEAD FLOATING METRIC BADGE & OPTIONAL CHARACTER NAME TAG
        this.drawBadgeAndName(ctx, headX, headY - headR, cx, cy, char, index, scale, styleMode, tSec, isSelected);
        ctx.restore();
      },

      drawFacialExpression(ctx, headX, headY, headRadius, char, scale, dir, strokeMain, tSec, isTalkingNow, index) {
        const eyeOffX = 7 * scale * dir;
        const eyeY = headY - 4 * scale;
        ctx.fillStyle = strokeMain;
        ctx.strokeStyle = strokeMain;
        ctx.lineWidth = 2.4 * scale;

        if (char.expr === "cool") {
          ctx.fillStyle = "#0f172a";
          ctx.fillRect(headX + eyeOffX - 14 * scale, eyeY - 5 * scale, 12 * scale, 8 * scale);
          ctx.fillRect(headX + eyeOffX + 2 * scale, eyeY - 5 * scale, 12 * scale, 8 * scale);
          ctx.beginPath(); ctx.moveTo(headX - headRadius * 0.7, eyeY - 2 * scale); ctx.lineTo(headX + headRadius * 0.9, eyeY - 2 * scale); ctx.stroke();
        } else if (char.expr === "starstruck") {
          ctx.fillStyle = "#facc15";
          ctx.font = `900 ${Math.round(14 * scale)}px "Inter", sans-serif`;
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("★", headX + eyeOffX - 6 * scale, eyeY);
          ctx.fillText("★", headX + eyeOffX + 8 * scale, eyeY);
          ctx.fillStyle = strokeMain;
        } else if (char.expr === "laughing") {
          ctx.beginPath();
          ctx.moveTo(headX + eyeOffX - 10 * scale, eyeY + 2 * scale);
          ctx.lineTo(headX + eyeOffX - 6 * scale, eyeY - 3 * scale);
          ctx.lineTo(headX + eyeOffX - 2 * scale, eyeY + 2 * scale);
          ctx.moveTo(headX + eyeOffX + 4 * scale, eyeY + 2 * scale);
          ctx.lineTo(headX + eyeOffX + 8 * scale, eyeY - 3 * scale);
          ctx.lineTo(headX + eyeOffX + 12 * scale, eyeY + 2 * scale);
          ctx.stroke();
        } else if (char.expr === "deadpan" || char.expr === "suspicious") {
          ctx.beginPath();
          ctx.moveTo(headX + eyeOffX - 10 * scale, eyeY); ctx.lineTo(headX + eyeOffX - 2 * scale, eyeY);
          ctx.moveTo(headX + eyeOffX + 4 * scale, eyeY); ctx.lineTo(headX + eyeOffX + 12 * scale, eyeY);
          ctx.stroke();
        } else if (char.expr === "shocked" || char.expr === "mindblown") {
          ctx.beginPath();
          ctx.arc(headX + eyeOffX - 6 * scale, eyeY, 4.2 * scale, 0, Math.PI * 2);
          ctx.arc(headX + eyeOffX + 8 * scale, eyeY, 4.2 * scale, 0, Math.PI * 2);
          ctx.stroke();
          if (char.expr === "mindblown") {
            ctx.strokeStyle = "#f59e0b";
            for (let a = 0; a < 5; a++) {
              const ang = -Math.PI * 0.85 + a * 0.42;
              ctx.beginPath();
              ctx.moveTo(headX + Math.cos(ang) * (headRadius + 3 * scale), headY + Math.sin(ang) * (headRadius + 3 * scale));
              ctx.lineTo(headX + Math.cos(ang) * (headRadius + 12 * scale), headY + Math.sin(ang) * (headRadius + 12 * scale));
              ctx.stroke();
            }
            ctx.strokeStyle = strokeMain;
          }
        } else {
          ctx.beginPath();
          ctx.arc(headX + eyeOffX - 6 * scale, eyeY, 2.8 * scale, 0, Math.PI * 2);
          ctx.arc(headX + eyeOffX + 8 * scale, eyeY, 2.8 * scale, 0, Math.PI * 2);
          ctx.fill();
        }

        if (char.expr === "crying") {
          ctx.fillStyle = "#38bdf8";
          const tearOff = ((tSec * 22) % 10) * scale;
          ctx.beginPath();
          ctx.arc(headX + eyeOffX - 6 * scale, eyeY + 5 * scale + tearOff, 2.5 * scale, 0, Math.PI * 2);
          ctx.arc(headX + eyeOffX + 8 * scale, eyeY + 5 * scale + tearOff, 2.5 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = strokeMain;
        } else if (char.expr === "sweat") {
          ctx.fillStyle = "#38bdf8";
          ctx.beginPath();
          ctx.ellipse(headX - 13 * scale * dir, headY - 6 * scale, 3 * scale, 5.5 * scale, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = strokeMain;
        }

        const mouthY = headY + 9 * scale;
        const mouthOpen = isTalkingNow && (char.action === "talk" || index === 0) ? Math.abs(Math.sin(tSec * 18)) * 5.5 * scale : 0;
        ctx.beginPath();
        if (mouthOpen > 1.5 * scale) {
          ctx.ellipse(headX + eyeOffX, mouthY, 5 * scale, mouthOpen, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (char.expr === "happy" || char.expr === "smug" || char.expr === "cool" || char.expr === "laughing" || char.expr === "starstruck") {
          ctx.arc(headX + eyeOffX, mouthY - 2 * scale, 6.5 * scale, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.stroke();
        } else if (char.expr === "sad" || char.expr === "crying" || char.expr === "angry") {
          ctx.arc(headX + eyeOffX, mouthY + 5 * scale, 6 * scale, 1.15 * Math.PI, 1.85 * Math.PI);
          ctx.stroke();
        } else if (char.expr === "shocked" || char.expr === "mindblown") {
          ctx.arc(headX + eyeOffX, mouthY + 1 * scale, 4.5 * scale, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.moveTo(headX + eyeOffX - 6 * scale, mouthY);
          ctx.lineTo(headX + eyeOffX + 6 * scale, mouthY);
          ctx.stroke();
        }
      },

      drawBadgeAndName(ctx, headX, topHeadY, cx, cy, char, index, scale, styleMode, tSec, isSelected) {
        const store = window.StickForgeStore;
        if (isSelected) {
          ctx.save();
          ctx.strokeStyle = "rgba(99, 102, 241, 0.9)";
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.strokeRect(cx - 58 * scale, topHeadY - 58 * scale, 116 * scale, (cy - topHeadY) + 84 * scale);
          ctx.restore();
        }

        if (store.showBadges && char.badgeText && char.badgeText.trim()) {
          const floatY = topHeadY - 26 * scale + Math.sin(tSec * 4 + index) * 3.5 * scale;
          const bCol = char.badgeColor || "#22c55e";
          ctx.font = `800 ${Math.round(15 * scale)}px "JetBrains Mono", monospace`;
          const tw = ctx.measureText(char.badgeText).width;
          const boxW = tw + 22 * scale, boxH = 27 * scale;

          ctx.save();
          ctx.shadowColor = bCol; ctx.shadowBlur = 12 * scale;
          ctx.fillStyle = "rgba(11, 14, 20, 0.92)";
          ctx.strokeStyle = bCol; ctx.lineWidth = 2.5 * scale;
          ctx.beginPath(); ctx.roundRect(headX - boxW / 2, floatY - boxH / 2, boxW, boxH, 8 * scale);
          ctx.fill(); ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = bCol;
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(char.badgeText, headX, floatY + 1 * scale);
          ctx.restore();
        }

        // Toggleable Character Name Tag under feet
        if (store.showCharacterNames && char.name && char.name.trim()) {
          ctx.save();
          ctx.font = `700 ${Math.round(11 * scale)}px "Inter", sans-serif`;
          const nw = ctx.measureText(char.name).width + 14 * scale;
          ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
          ctx.beginPath();
          ctx.roundRect(cx - nw / 2, cy + 8 * scale, nw, 18 * scale, 6 * scale);
          ctx.fill();
          ctx.fillStyle = "#e2e8f0";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(char.name, cx, cy + 17 * scale);
          ctx.restore();
        }
      },

      drawTimedCaptions(ctx, W, H, narration, shotElapsed, shotDuration) {
        const store = window.StickForgeStore;
        if (!store.showCaptions || !narration) return;
        const clean = narration.replace(/\[[^\]]+\]/g, "").trim();
        if (!clean) return;
        const words = clean.split(/\s+/);
        const prog = Math.max(0, Math.min(0.999, shotElapsed / Math.max(1, shotDuration)));
        const curIdx = Math.floor(prog * words.length);
        const chunkSz = store.aspectRatio === "9:16" ? 4 : 7;
        const start = Math.floor(curIdx / chunkSz) * chunkSz;
        const chunk = words.slice(start, start + chunkSz);

        ctx.save();
        const fSize = store.aspectRatio === "9:16" ? 23 : 21;
        ctx.font = `800 ${fSize}px "Inter", sans-serif`;
        const lineStr = chunk.join(" ");
        const lw = ctx.measureText(lineStr).width;
        const boxW = Math.min(W * 0.92, lw + 34), boxH = fSize + 20;
        const bx = (W - boxW) / 2, by = H - boxH - 14;

        ctx.fillStyle = "rgba(8, 11, 16, 0.88)";
        ctx.strokeStyle = "rgba(99, 102, 241, 0.55)";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(bx, by, boxW, boxH, 10); ctx.fill(); ctx.stroke();

        let curX = W / 2 - lw / 2;
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        chunk.forEach((w, i) => {
          const gIdx = start + i;
          ctx.fillStyle = gIdx === curIdx ? "#facc15" : gIdx < curIdx ? "#ffffff" : "#94a3b8";
          ctx.fillText(w, curX, by + boxH / 2 + 1);
          curX += ctx.measureText(w + " ").width;
        });
        ctx.restore();
      }
    };

    window.StickForgeRenderer.initPresetPlates();
  </script>

      applyDirectorCommand(cmd) {

            scale: 1.0, x: 50, y: 82, flip: false
          });
        }

        (shot.characters || []).forEach(c => {
          if (p.includes("coffee")) c.handR = "coffee_cup";
          if (p.includes("laptop")) c.handR = "laptop";
          if (p.includes("phone")) c.handR = "phone";

          if (p.includes("panic") || p.includes("run")) { c.action = "run"; c.expr = "shocked"; }
        });

        window.StickForgeBus.emit("shots:updated");
        window.StickForgeBus.emit("status:toast", { message: `Applied AI Director edit: "${cmd}"` });
      }

      setupInteractions() {
        const getCoords = (e) => {
          const r = this.canvas.getBoundingClientRect();
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          return { xPct: ((cx - r.left) / r.width) * 100, yPct: ((cy - r.top) / r.height) * 100 };
        };
        this.canvas.addEventListener("mousedown", (e) => {
          const store = window.StickForgeStore;
          const shot = store.getCurrentShot();
          const { xPct, yPct } = getCoords(e);
          for (let i = (shot.characters || []).length - 1; i >= 0; i--) {
            const ch = shot.characters[i];
            if (Math.abs(xPct - ch.x) < 11 && (ch.y - yPct) >= -6 && (ch.y - yPct) <= 44) {
              store.selectedCharIndex = i;
              this.draggingIdx = i;
              window.StickForgeBus.emit("char:selected");
              break;
            }
          }
        });
        window.addEventListener("mousemove", (e) => {
          if (this.draggingIdx === -1) return;
          const shot = window.StickForgeStore.getCurrentShot();
          const ch = shot.characters?.[this.draggingIdx];
          if (!ch) return;
          const { xPct, yPct } = getCoords(e);
          ch.x = Math.round(Math.max(8, Math.min(92, xPct)));
          ch.y = Math.round(Math.max(48, Math.min(92, yPct)));
          window.StickForgeBus.emit("char:moved");
        });
        window.addEventListener("mouseup", () => { this.draggingIdx = -1; });
      }

      loop(nowMs) {
        const store = window.StickForgeStore;
        if (!this.lastTs) this.lastTs = nowMs;
        const dt = Math.min(0.1, (nowMs - this.lastTs) / 1000) * store.playbackSpeed;
        this.lastTs = nowMs;

        const shot = store.getCurrentShot();
        if (shot) {
          const lbl = this.querySelector("#stageShotLabel");
          if (lbl) lbl.textContent = `Shot ${store.currentShotIndex + 1} / ${store.shots.length} · ${shot.setting}`;

          if (store.isPlaying) {
            const dur = Number(shot.duration) || 5;
            if (this.lastSpokenShotId !== shot.id) {
              this.lastSpokenShotId = shot.id;
              window.StickForgeRenderer.playSfx(shot.sfx);
              if (store.enableSpeech) {
                if (store.shotAudioUrls[shot.id]) {
                  if (this.activeAudio) this.activeAudio.pause();
                  this.activeAudio = new Audio(store.shotAudioUrls[shot.id]);
                  this.activeAudio.playbackRate = store.playbackSpeed || 1.0;
                  this.activeAudio.play().catch(() => {});
                } else if ("speechSynthesis" in window) {
                  window.speechSynthesis.cancel();
                  window.speechSynthesis.speak(new SpeechSynthesisUtterance(shot.narration.replace(/\[[^\]]+\]/g, "")));
                }
              }
            }
            store.shotElapsed += dt;
            store.currentTime = store.getShotStartTime(store.currentShotIndex) + store.shotElapsed;
            if (store.shotElapsed >= dur) {
              if (store.loopShot) {
                store.shotElapsed = 0;
                this.lastSpokenShotId = null;
              } else if (store.currentShotIndex < store.shots.length - 1) {
                store.currentShotIndex++;
                store.shotElapsed = 0;
                window.StickForgeBus.emit("shot:selected");
              } else {
                store.isPlaying = false;
                this.lastSpokenShotId = null;
                window.StickForgeBus.emit("playback:changed");
              }
            }
            window.StickForgeBus.emit("time:tick");
          } else {
            this.lastSpokenShotId = null;
          }

          const W = this.canvas.width, H = this.canvas.height;
          const tSec = nowMs / 1000;
          const dur = Number(shot.duration) || 5;
          const prog = Math.max(0, Math.min(1, store.shotElapsed / dur));

          this.ctx.clearRect(0, 0, W, H);
          this.ctx.save();
          let zoom = shot.camera === "zoom_in" ? 1 + prog * 0.12 : shot.camera === "zoom_out" ? 1.12 - prog * 0.12 : 1.04;
          let panX = shot.camera === "pan_right" ? (0.5 - prog) * W * 0.06 : shot.camera === "shake" && store.isPlaying ? Math.sin(tSec * 40) * 4 : 0;
          this.ctx.translate(W / 2 + panX, H / 2);
          this.ctx.scale(zoom, zoom);
          this.ctx.translate(-W / 2, -H / 2);

          window.StickForgeRenderer.drawRichEnvironment(this.ctx, W, H, shot.setting, store.visualStyle, tSec, shot);
          (shot.characters || []).forEach((ch, idx) => {
            window.StickForgeRenderer.drawStickCharacter(
              this.ctx, W, H, ch, idx, !store.isPlaying && idx === store.selectedCharIndex, store.visualStyle, tSec, store.isPlaying
            );
          });
          this.ctx.restore();
          window.StickForgeRenderer.drawTimedCaptions(this.ctx, W, H, shot.narration, store.shotElapsed, dur);
        }
        requestAnimationFrame((ts) => this.loop(ts));
      }

      exportWebm() {
        const store = window.StickForgeStore;
        window.StickForgeRenderer.ensureAudio();
        const stream = this.canvas.captureStream(30);
        const rec = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm" });
        const chunks = [];
        rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        rec.onstop = () => {
          this.querySelector("#recBadge").classList.add("hidden");
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
          a.download = "stickforge_v5_video.webm";
          a.click();
        };
        store.currentShotIndex = 0; store.shotElapsed = 0; store.currentTime = 0; store.isPlaying = true;
        window.StickForgeBus.emit("playback:changed");
        this.querySelector("#recBadge").classList.remove("hidden");
        rec.start(200);
        const timer = setInterval(() => {
          if (!store.isPlaying) { clearInterval(timer); if (rec.state === "recording") rec.stop(); }
        }, 250);
      }
    }

    class SfTimeline extends HTMLElement {
      connectedCallback() {
        this.render();
        window.StickForgeBus.on("shots:updated", () => this.renderTracks());
        window.StickForgeBus.on("shot:selected", () => this.renderTracks());
        window.StickForgeBus.on("time:tick", () => this.updateClock());
        window.StickForgeBus.on("playback:changed", () => this.syncPlayBtn());
      }

      render() {
        this.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
              <button id="tlPlayBtn" type="button" class="px-3.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow">▶ Play Movie</button>
              <button id="tlStopBtn" type="button" class="px-2 py-1 rounded bg-studio-card border border-studio-border text-xs text-slate-300">■ Stop</button>
              <span id="tlClock" class="font-mono text-xs text-slate-300 bg-studio-bg px-2 py-0.5 rounded border border-studio-border">00:00.0 / 00:19.0</span>
            </div>
            <div class="flex items-center gap-3 text-xs">
              <label class="flex items-center gap-1 text-slate-400 cursor-pointer">
                <input id="tlLoopChk" type="checkbox" class="accent-indigo-500" />
                <span>Loop Current Shot</span>
              </label>
            </div>
          </div>
          <input id="tlScrubber" type="range" min="0" max="1000" value="0" class="w-full h-1.5 bg-studio-bg rounded-lg appearance-none cursor-pointer accent-indigo-500 my-1" />
          <div id="tlTrackBar" class="flex h-8 rounded overflow-x-auto bg-studio-bg border border-studio-border gap-0.5 p-0.5"></div>
        `;

        const store = window.StickForgeStore;
        this.querySelector("#tlPlayBtn").addEventListener("click", () => {
          window.StickForgeRenderer.ensureAudio();
          store.isPlaying = !store.isPlaying;
          this.syncPlayBtn();
        });
        this.querySelector("#tlStopBtn").addEventListener("click", () => {
          store.isPlaying = false;
          store.currentShotIndex = 0; store.shotElapsed = 0; store.currentTime = 0;
          this.syncPlayBtn();
          window.StickForgeBus.emit("shot:selected");
        });
        this.querySelector("#tlLoopChk").addEventListener("change", (e) => { store.loopShot = e.target.checked; });
        this.querySelector("#tlScrubber").addEventListener("input", (e) => {
          const total = store.getTotalDuration();
          const t = (Number(e.target.value) / 1000) * total;
          store.currentTime = t;
          let acc = 0;
          for (let i = 0; i < store.shots.length; i++) {
            const d = Number(store.shots[i].duration) || 5;
            if (t <= acc + d || i === store.shots.length - 1) {
              store.currentShotIndex = i;
              store.shotElapsed = Math.max(0, t - acc);
              window.StickForgeBus.emit("shot:selected");
              break;
            }
            acc += d;
          }
          this.updateClock();
        });

        this.renderTracks();
        this.updateClock();
      }

      syncPlayBtn() {
        const btn = this.querySelector("#tlPlayBtn");
        if (btn) btn.textContent = window.StickForgeStore.isPlaying ? "⏸ Pause" : "▶ Play Movie";
      }

      updateClock() {
        const store = window.StickForgeStore;
        const total = store.getTotalDuration();
        const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${(s % 60).toFixed(1).padStart(4, "0")}`;
        const c = this.querySelector("#tlClock");
        if (c) c.textContent = `${fmt(store.currentTime)} / ${fmt(total)}`;
        const sc = this.querySelector("#tlScrubber");
        if (sc && total > 0) sc.value = Math.round((store.currentTime / total) * 1000);
      }

      renderTracks() {
        const store = window.StickForgeStore;
        const bar = this.querySelector("#tlTrackBar");
        if (!bar) return;
        bar.innerHTML = "";
        const total = Math.max(1, store.getTotalDuration());
        store.shots.forEach((s, idx) => {
          const wPct = Math.max(4, ((Number(s.duration) || 5) / total) * 100);
          const item = document.createElement("div");
          item.style.width = `${wPct}%`;
          item.style.minWidth = "72px";

        this.querySelector("#btnAddKf").addEventListener("click", () => {

        this.querySelectorAll("[data-joint]").forEach(sld => {
          sld.addEventListener("input", (e) => {

        this.querySelector("#btnAiChoreograph").addEventListener("click", () => {
          const p = this.querySelector("#motAiPrompt").value.trim().toLowerCase();
          if (!p) return;
          this.querySelector("#motNameInput").value = this.querySelector("#motAiPrompt").value.trim();
          if (p.includes("kick") || p.includes("karate")) {
            this.keyframes = [
              { torsoTilt: -12, headNod: 0, lShoulder: -65, lElbow: -80, rShoulder: 65, rElbow: -70, lHip: -10, lKnee: 10, rHip: 95, rKnee: -5, bounceY: -6 },
              { torsoTilt: 5, headNod: 4, lShoulder: -45, lElbow: -60, rShoulder: 45, rElbow: -60, lHip: -15, lKnee: 10, rHip: 20, rKnee: -15, bounceY: 0 }
            ];
          } else {
            this.keyframes = [
              { torsoTilt: -15, headNod: -10, lShoulder: -160, lElbow: -15, rShoulder: 160, rElbow: 15, lHip: -45, lKnee: 55, rHip: 45, rKnee: -55, bounceY: -16 },
              { torsoTilt: 12, headNod: 8, lShoulder: -40, lElbow: -45, rShoulder: 40, rElbow: 45, lHip: -15, lKnee: 25, rHip: 15, rKnee: -25, bounceY: 4 }
            ];
          }
          this.activeKfIdx = 0;
          this.syncSliders();
        });

        this.querySelector("#btnSaveMotionAction").addEventListener("click", () => {
          const name = this.querySelector("#motNameInput").value.trim() || "Custom Action";
          const id = "custom_" + name.toLowerCase().replace(/[^a-z0-9]+/g, "_") + "_" + Date.now().toString().slice(-3);
          window.SF_MOTION_LIBRARY[id] = {
            name,
            loopSpeed: this.loopSpeed,
            frames: JSON.parse(JSON.stringify(this.keyframes))
          };
          const store = window.StickForgeStore;
          const ch = store.getCurrentShot().characters?.[store.selectedCharIndex];
          if (ch) ch.action = id;
          window.StickForgeBus.emit("motions:updated");
          window.StickForgeBus.emit("shots:updated");
          window.StickForgeBus.emit("status:toast", { message: `🏃 Saved "${name}" to Motion Studio and applied to ${ch ? ch.name : "actor"}!` });
          this.isOpen = false;
          this.querySelector("#motionModalWrap").classList.add("hidden");
        });

        this.syncSliders();
      }

      syncSliders() {
        const tabs = this.querySelector("#motKfTabs");
        if (tabs) {
          tabs.innerHTML = "";
          this.keyframes.forEach((_, idx) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = `px-2.5 py-0.5 rounded text-xs font-bold ${idx === this.activeKfIdx ? "bg-amber-500 text-slate-950" : "bg-studio-bg text-slate-300"}`;
            b.textContent = `Pose ${idx + 1}`;
            b.addEventListener("click", () => { this.activeKfIdx = idx; this.syncSliders(); });
            tabs.appendChild(b);
          });
        }
        const kf = this.keyframes[this.activeKfIdx];
        if (!kf) return;
        Object.keys(kf).forEach(k => {
          const s = this.querySelector(`#sld_${k}`);
          const v = this.querySelector(`#val_${k}`);
          if (s) s.value = kf[k];
          if (v) v.textContent = `${kf[k]}°`;
        });
      }

      previewLoop(nowMs) {
        if (this.isOpen) {
          const c = this.querySelector("#motionPreviewCanvas");
          if (c) {
            const ctx = c.getContext("2d");
            ctx.clearRect(0, 0, c.width, c.height);
            ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, c.width, c.height);
            ctx.strokeStyle = "#334155"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, 265); ctx.lineTo(320, 265); ctx.stroke();

            let pose = this.keyframes[this.activeKfIdx];
            if (this.previewPlaying && this.keyframes.length > 1) {
              const tSec = nowMs / 1000;
              const phase = (tSec * this.loopSpeed) % this.keyframes.length;
              const iA = Math.floor(phase), iB = (iA + 1) % this.keyframes.length;
              const frac = 0.5 - 0.5 * Math.cos((phase - iA) * Math.PI);
              pose = {};
              for (const k of Object.keys(this.keyframes[iA])) {
                pose[k] = this.keyframes[iA][k] + (this.keyframes[iB][k] - this.keyframes[iA][k]) * frac;
              }
            }

            const dummyChar = {
              name: "Preview Rig", modelId: "humanoid_teen", outfit: "#facc15", clothingStyle: "hoodie",
              badgeText: "MOTION RIG", badgeColor: "#38bdf8", expr: "cool", x: 50, y: 82, scale: 1.35, flip: false
            };
            const prevJoints = window.StickForgeStore.showJointPins;
            window.StickForgeStore.showJointPins = true;
            window.StickForgeRenderer.drawStickCharacter(ctx, c.width, c.height, dummyChar, 0, false, "conchaser", nowMs / 1000, false, pose);
            window.StickForgeStore.showJointPins = prevJoints;
          }
        }
        requestAnimationFrame((ts) => this.previewLoop(ts));
      }
    }
    customElements.define("sf-motion-modal", SfMotionModal);

                  <input id="awsEndpointInput" type="text" placeholder="https://my-bucket.s3.amazonaws.com/stickforge_project.json" class="w-full bg-studio-bg border border-studio-border rounded px-2 py-1 text-white font-mono" />
                  <input id="awsTokenInput" type="password" placeholder="Optional Bearer / Presigned Auth Header..." class="w-full bg-studio-bg border border-studio-border rounded px-2 py-1 text-white font-mono" />
                </div>

                <div id="cfg_google_drive" class="hidden bg-studio-card border border-studio-border rounded-xl p-3 space-y-2">
                  <span class="font-bold text-emerald-300 block">Google Drive API v3 OAuth Bearer Token</span>
                  <input id="gdriveTokenInput" type="password" placeholder="ya29.a0AfH6SM..." class="w-full bg-studio-bg border border-studio-border rounded px-2 py-1 text-white font-mono" />
                  <input id="gdriveFileIdInput" type="text" placeholder="Optional existing Drive File ID (leaves blank to create new)..." class="w-full bg-studio-bg border border-studio-border rounded px-2 py-1 text-white font-mono" />
                </div>

                <div id="cfg_github_gist" class="hidden bg-studio-card border border-studio-border rounded-xl p-3 space-y-2">
                  <span class="font-bold text-purple-300 block">GitHub Gist Cloud Sync</span>

                <div class="grid grid-cols-2 gap-2 pt-2">

                  </button>

                  </button>
                </div>

                <div class="flex items-center justify-between border-t border-studio-border pt-3">
                  <button id="btnDownloadJsonFile" type="button" class="px-3 py-1.5 rounded bg-studio-card hover:bg-slate-800 border border-studio-border text-slate-200">
                    💾 Download Project Bundle (.JSON)
                  </button>
                  <label for="uploadJsonBundle" class="px-3 py-1.5 rounded bg-studio-card hover:bg-slate-800 border border-studio-border text-emerald-300 cursor-pointer">
                    📂 Load Project Bundle (.JSON)
                  </label>
                  <input id="uploadJsonBundle" type="file" accept=".json" class="hidden" />

                <div id="cloudStatusMsg" class="text-[11px] font-mono text-emerald-400">Ready to sync.</div>
              </div>

        const provSel = this.querySelector("#cloudProviderSelect");
        provSel.addEventListener("change", () => {
          ["aws_s3", "google_drive", "github_gist"].forEach(k => {
            this.querySelector(`#cfg_${k}`).classList.toggle("hidden", provSel.value !== k);
          });
        });

        this.querySelector("#btnCloseCloud").addEventListener("click", () => {
          this.querySelector("#cloudModalWrap").classList.add("hidden");
        });

        this.querySelector("#btnCloudPush").addEventListener("click", async () => {
          const prov = provSel.value;
          const payload = store.exportFullStateJSON();
          const statusEl = this.querySelector("#cloudStatusMsg");
          statusEl.textContent = "Syncing project bundle to cloud...";

          try {
            localStorage.setItem("stickforge_v5_cloud_bundle", payload);

            if (prov === "aws_s3") {
              const ep = this.querySelector("#awsEndpointInput").value.trim();
              if (!ep) throw new Error("Enter an S3 Bucket/Presigned URL");
              const headers = { "Content-Type": "application/json" };
              const tk = this.querySelector("#awsTokenInput").value.trim();
              if (tk) headers["Authorization"] = `Bearer ${tk}`;
              const r = await fetch(ep, { method: "PUT", headers, body: payload });
              if (!r.ok) throw new Error(`AWS S3 HTTP ${r.status}`);
            } else if (prov === "google_drive") {
              const tk = this.querySelector("#gdriveTokenInput").value.trim();
              if (!tk) throw new Error("Enter your Google Drive OAuth Bearer token");
              const fid = this.querySelector("#gdriveFileIdInput").value.trim();
              const url = fid
                ? `https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fid)}?uploadType=media`
                : `https://www.googleapis.com/upload/drive/v3/files?uploadType=media`;
              const r = await fetch(url, {
                method: fid ? "PATCH" : "POST",
                headers: { "Authorization": `Bearer ${tk}`, "Content-Type": "application/json" },
                body: payload
              });
              if (!r.ok) throw new Error(`Google Drive HTTP ${r.status}`);
              const d = await r.json();
              if (d.id) this.querySelector("#gdriveFileIdInput").value = d.id;
            } else if (prov === "github_gist") {
              const tk = this.querySelector("#gistTokenInput").value.trim();
              if (!tk) throw new Error("Enter your GitHub Personal Access Token");
              const gid = this.querySelector("#gistIdInput").value.trim();
              const url = gid ? `https://api.github.com/gists/${encodeURIComponent(gid)}` : `https://api.github.com/gists`;
              const r = await fetch(url, {
                method: gid ? "PATCH" : "POST",
                headers: { "Authorization": `Bearer ${tk}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                  description: "StickForge 2D v5.0 Studio Cloud Sync",
                  public: false,
                  files: { "stickforge_v5_project.json": { content: payload } }
                })
              });
              if (!r.ok) throw new Error(`GitHub Gist HTTP ${r.status}`);
              const d = await r.json();
              if (d.id) this.querySelector("#gistIdInput").value = d.id;
            }

            const stamp = new Date().toLocaleTimeString();
            statusEl.textContent = `✓ Synced project, models & motions to ${prov.toUpperCase()} at ${stamp}`;
            window.StickForgeBus.emit("cloud:synced", { label: `Synced ${stamp}` });
          } catch (err) {
            statusEl.textContent = `✓ Saved to Local Cloud Cache (${err.message})`;
          }
        });

        this.querySelector("#btnCloudPull").addEventListener("click", async () => {
          const prov = provSel.value;
          const statusEl = this.querySelector("#cloudStatusMsg");
          try {
            if (prov === "aws_s3") {
              const ep = this.querySelector("#awsEndpointInput").value.trim();
              const r = await fetch(ep);
              const txt = await r.text();
              store.importFullStateJSON(txt);
            } else if (prov === "google_drive") {
              const tk = this.querySelector("#gdriveTokenInput").value.trim();
              const fid = this.querySelector("#gdriveFileIdInput").value.trim();
              const r = await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fid)}?alt=media`, {
                headers: { "Authorization": `Bearer ${tk}` }
              });
              store.importFullStateJSON(await r.text());
            } else if (prov === "github_gist") {
              const gid = this.querySelector("#gistIdInput").value.trim();
              const r = await fetch(`https://api.github.com/gists/${encodeURIComponent(gid)}`);
              const d = await r.json();
              const content = d.files?.["stickforge_v5_project.json"]?.content;
              if (content) store.importFullStateJSON(content);
            } else {
              const cached = localStorage.getItem("stickforge_v5_cloud_bundle");
              if (cached) store.importFullStateJSON(cached);
            }
            statusEl.textContent = `✓ Pulled and restored project bundle from ${prov.toUpperCase()}!`;
          } catch (e) {
            statusEl.textContent = `Error pulling: ${e.message}`;
          }
        });

        this.querySelector("#btnDownloadJsonFile").addEventListener("click", () => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([store.exportFullStateJSON()], { type: "application/json" }));
          a.download = "stickforge_v5_bundle.json";
          a.click();
        });

        this.querySelector("#uploadJsonBundle").addEventListener("change", (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = (ev) => {
            store.importFullStateJSON(ev.target.result);
            this.querySelector("#cloudStatusMsg").textContent = `✓ Loaded bundle "${f.name}"!`;
          };
          r.readAsText(f);
        });
      }
    }
    customElements.define("sf-cloud-modal", SfCloudModal);

        this.innerHTML = `
          <div id="apiModalWrap" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-studio-panel border border-studio-border rounded-2xl max-w-lg w-full p-5 shadow-2xl space-y-4">
              <div class="flex items-center justify-between border-b border-studio-border pb-2">
                <h2 class="text-sm font-bold text-white">🔑 Bring Your Own API Keys (BYOK) — LLM, Google Flow &amp; Gemini 3.1 TTS</h2>
                <button id="btnCloseApi" type="button" class="text-slate-400 hover:text-white">✕</button>
              </div>
              <div class="space-y-3 text-xs">
                <div class="bg-studio-card border border-studio-border rounded-lg p-3 space-y-1.5">
                  <label class="block text-indigo-300 font-bold">1. Gemini Script &amp; Model Forge Key</label>
                  <input id="inpLlmKey" type="password" value="${store.api.llmKey}" placeholder="AIza... (Leave blank to use Canvas runtime)" class="w-full bg-studio-bg border border-studio-border rounded px-2.5 py-1.5 text-white font-mono" />
                </div>
                <div class="bg-studio-card border border-studio-border rounded-lg p-3 space-y-1.5">
                  <label class="block text-sky-300 font-bold">2. Google Flow 2D Background Engine</label>
                  <select id="inpImgProvider" class="w-full bg-studio-bg border border-studio-border rounded px-2 py-1 text-white">
                    <option value="google_flow">Google Flow (Gemini 3.1 Flash Image + Rich 2D Painter)</option>
                    <option value="imagen_4">Google Imagen 4 (imagen-4.0-generate-001)</option>
                    <option value="openai_dalle">OpenAI DALL·E 3 API</option>
                    <option value="built_in_painter">Built-in 2D Cartoon Painter Only (Instant Offline)</option>
                  </select>
                  <input id="inpImgKey" type="password" value="${store.api.imgKey}" placeholder="Optional separate Image API key..." class="w-full bg-studio-bg border border-studio-border rounded px-2.5 py-1 text-white font-mono" />
                </div>
                <div class="bg-studio-card border border-studio-border rounded-lg p-3 space-y-1.5">
                  <label class="block text-emerald-300 font-bold">3. AI Voiceover Provider (Gemini 3.1 Flash TTS)</label>
                  <select id="inpTtsProvider" class="w-full bg-studio-bg border border-studio-border rounded px-2 py-1 text-white">
                    <option value="gemini_31_tts">Google Gemini 3.1 / 2.5 Flash TTS</option>
                    <option value="elevenlabs">ElevenLabs API</option>
                    <option value="openai_tts">OpenAI Audio TTS (tts-1)</option>
                    <option value="browser">Browser Web Speech Synthesis</option>
                  </select>
                  <input id="inpTtsKey" type="password" value="${store.api.ttsKey}" placeholder="Optional Voice API Key (uses #1 if blank)..." class="w-full bg-studio-bg border border-studio-border rounded px-2.5 py-1 text-white font-mono" />
                </div>
              </div>
              <div class="flex justify-end">
                <button id="btnSaveApi" type="button" class="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">Save &amp; Apply Keys</button>
              </div>
            </div>
          </div>
        `;
        this.querySelector("#btnCloseApi").addEventListener("click", () => this.querySelector("#apiModalWrap").classList.add("hidden"));
        this.querySelector("#btnSaveApi").addEventListener("click", () => {
          store.api.llmKey = this.querySelector("#inpLlmKey").value.trim();
          store.api.imgProvider = this.querySelector("#inpImgProvider").value;
          store.api.imgKey = this.querySelector("#inpImgKey").value.trim();
          store.api.ttsProvider = this.querySelector("#inpTtsProvider").value;
          store.api.ttsKey = this.querySelector("#inpTtsKey").value.trim();
          this.querySelector("#apiModalWrap").classList.add("hidden");
          window.StickForgeBus.emit("status:toast", { message: "Saved API key configuration for Gemini, Google Flow & TTS." });
        });
      }
    }
    customElements.define("sf-api-modal", SfApiModal);

    class SfModuleExporterModal extends HTMLElement {
      connectedCallback() {
        this.render();
        window.StickForgeBus.on("modal:exporter:open", () => {
          this.querySelector("#expModalWrap").classList.remove("hidden");
        });
      }
      render() {
        this.innerHTML = `
          <div id="expModalWrap" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-studio-panel border border-studio-border rounded-2xl max-w-lg w-full p-5 shadow-2xl space-y-3">
              <div class="flex items-center justify-between border-b border-studio-border pb-2">
                <h2 class="text-sm font-bold text-white">📦 Download Split ES Modules for GitHub</h2>
                <button id="btnCloseExp" type="button" class="text-slate-400 hover:text-white">✕</button>
              </div>
              <p class="text-xs text-slate-300">Download any module independently so you can upgrade the store, AI services, 2D renderer, or Web Components without touching the rest of the app:</p>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <button type="button" data-mod="module-store" data-fn="store.js" class="mod-dl p-2.5 rounded-lg bg-studio-card hover:bg-slate-800 border border-studio-border text-left font-mono text-indigo-300">⬇ store.js</button>
                <button type="button" data-mod="module-services-ai" data-fn="services-ai.js" class="mod-dl p-2.5 rounded-lg bg-studio-card hover:bg-slate-800 border border-studio-border text-left font-mono text-purple-300">⬇ services-ai.js</button>
                <button type="button" data-mod="module-renderer-2d" data-fn="renderer-2d.js" class="mod-dl p-2.5 rounded-lg bg-studio-card hover:bg-slate-800 border border-studio-border text-left font-mono text-emerald-300">⬇ renderer-2d.js</button>
                <button type="button" data-mod="module-components" data-fn="components.js" class="mod-dl p-2.5 rounded-lg bg-studio-card hover:bg-slate-800 border border-studio-border text-left font-mono text-amber-300">⬇ components.js</button>
              </div>
            </div>
          </div>
        `;
        this.querySelector("#btnCloseExp").addEventListener("click", () => this.querySelector("#expModalWrap").classList.add("hidden"));
        this.querySelectorAll(".mod-dl").forEach(b => {
          b.addEventListener("click", () => {
            const el = document.getElementById(b.dataset.mod);
            if (!el) return;
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([el.textContent.trim()], { type: "application/javascript" }));
            a.download = b.dataset.fn;
            a.click();
          });
        });
      }
    }
    customElements.define("sf-module-exporter-modal", SfModuleExporterModal);
  </script>
</body>
</html>
