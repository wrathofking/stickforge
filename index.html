  <!-- MODULE 0: BUILT-IN CLOUD SYNC ENGINE (Firebase Firestore Integration) -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.StickForgeBuiltInCloud = {
      ready: false,
      user: null,
      db: null,
      appId: typeof __app_id !== 'undefined' ? __app_id : 'stickforge-v4-studio',
      async init() {
        try {
          if (typeof __firebase_config === 'undefined' || !__firebase_config) return false;
          const firebaseConfig = JSON.parse(__firebase_config);
          const app = initializeApp(firebaseConfig);
          this.db = getFirestore(app);
          const auth = getAuth(app);
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
          onAuthStateChanged(auth, (u) => {
            this.user = u;
            this.ready = !!u;
            if (window.StickForgeBus) window.StickForgeBus.emit("cloud:status", { ready: this.ready, uid: u?.uid });
          });
          return true;
        } catch (err) {
          return false;
        }
      },
      async saveProject(slotName, payloadObj) {
        if (!this.user || !this.db) throw new Error("Built-in Cloud Auth not active");
        const docRef = doc(this.db, 'artifacts', this.appId, 'users', this.user.uid, 'projects', slotName);
        await setDoc(docRef, {
          slotName,
          updatedAt: Date.now(),
          payloadJson: JSON.stringify(payloadObj)
        });
        return true;
      },
      async listProjects() {
        if (!this.user || !this.db) return [];
        const colRef = collection(this.db, 'artifacts', this.appId, 'users', this.user.uid, 'projects');
        const snap = await getDocs(colRef);
        const list = [];
        snap.forEach(d => list.push(d.data()));
        return list;
      }
    };
    window.StickForgeBuiltInCloud.init();
  </script>

      constructor() { this.listeners = {}; }
      on(event, cb) {
        if (!this.listeners[event]) this.listeners[event] = [];
        this.listeners[event].push(cb);
      }
      emit(event, detail = {}) {
        (this.listeners[event] || []).forEach(cb => {
          try { cb(detail); } catch (err) { console.error(`EventBus error [${event}]:`, err); }
        });
      }
    }

          awsEndpoint: "",
          awsToken: "",
          gdriveToken: "",
          gdriveFolderId: "",
          githubToken: "",
          githubGistId: ""
        };
      }

      pushUndo() {
        this.historyStack.push(JSON.parse(JSON.stringify(this.shots)));
        if (this.historyStack.length > 25) this.historyStack.shift();
      }

      undo() {
        if (!this.historyStack.length) return false;
        this.shots = this.historyStack.pop();
        this.currentShotIndex = Math.min(this.currentShotIndex, this.shots.length - 1);
        window.StickForgeBus.emit("shots:updated");
        return true;
      }

      getCurrentShot() {
        return this.shots[this.currentShotIndex] || this.shots[0];
      }

      getActiveChar() {
        const s = this.getCurrentShot();
        return s && s.characters ? s.characters[this.selectedCharIndex] : null;
      }

      getTotalDuration() {
        return this.shots.reduce((acc, s) => acc + (Number(s.duration) || 5), 0);
      }

      getShotStartTime(idx) {
        let sum = 0;
        for (let i = 0; i < idx && i < this.shots.length; i++) {
          sum += Number(this.shots[i].duration) || 5;
        }
        return sum;
      }

        return {
          version: "4.0",

          visualStyle: this.visualStyle,

          customObjectModels: window.SF_MODEL_GALLERY.objectModels,
          customMotions: window.SF_MOTIONS
        };

        if (!bundle) return;
        this.projectTitle = bundle.projectTitle || this.projectTitle;
        if (Array.isArray(bundle.shots) && bundle.shots.length) this.shots = bundle.shots;
        if (Array.isArray(bundle.styleProfiles)) this.styleProfiles = bundle.styleProfiles;

        if (Array.isArray(bundle.customObjectModels)) window.SF_MODEL_GALLERY.objectModels = bundle.customObjectModels;
        if (bundle.customMotions) Object.assign(window.SF_MOTIONS, bundle.customMotions);
        this.currentShotIndex = 0;
        this.selectedCharIndex = 0;
        window.StickForgeBus.emit("shots:updated");
        window.StickForgeBus.emit("gallery:updated");
        window.StickForgeBus.emit("motions:updated");

  <script id="module-services-ai">
    window.StickForgeAI = {
      async fetchWithBackoff(url, options, retries = 3) {
        let delay = 1000;
        for (let i = 0; i < retries; i++) {
          try {
            const res = await fetch(url, options);
            if (res.status === 429 && i < retries - 1) {
              await new Promise(r => setTimeout(r, delay));
              delay *= 2;
              continue;
            }
            return res;
          } catch (err) {
            if (i === retries - 1) throw err;
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
          }
        }
      },

      // 1. Analyze YouTube URL or Script Sample to Clone Writing Style DNA
      async analyzeWritingStyle({ youtubeUrl, sampleText, styleName }) {
        const store = window.StickForgeStore;
        const apiKey = store.api.llmKey || "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey)}`;

        const prompt = `Analyze the following YouTube video URL or script transcript and extract a reusable Writing Style DNA profile for a 2D stick-figure story channel.
${youtubeUrl ? `YouTube Video URL: ${youtubeUrl}` : ""}
${sampleText ? `Sample Script / Transcript:\n${sampleText}` : ""}
Return JSON with: name, tone, hookFormula, pacing, twistPattern.`;

        const payload = {
          contents: [{ role: "user", parts: [{ text: prompt }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                name: { type: "STRING" },
                tone: { type: "STRING" },
                hookFormula: { type: "STRING" },
                pacing: { type: "STRING" },
                twistPattern: { type: "STRING" }
              },
              required: ["name", "tone", "hookFormula", "pacing", "twistPattern"]
            }
          }
        };
        if (youtubeUrl && youtubeUrl.trim()) payload.tools = [{ "google_search": {} }];

        try {
          const res = await this.fetchWithBackoff(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (res && res.ok) {
            const data = await res.json();
            const raw = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (raw) {
              const parsed = JSON.parse(raw);
              return {
                id: "style_" + Date.now(),
                name: styleName || parsed.name || "Cloned Style DNA",
                sourceUrl: youtubeUrl || "Custom Script Sample",
                tone: parsed.tone,
                hookFormula: parsed.hookFormula,
                pacing: parsed.pacing,
                twistPattern: parsed.twistPattern
              };
            }
          }
        } catch (e) {}

        return {
          id: "style_" + Date.now(),
          name: styleName || (youtubeUrl ? `YT Style (${youtubeUrl.slice(-11)})` : "Custom Cloned Style"),
          sourceUrl: youtubeUrl || "Custom Sample",
          tone: "Fast-paced first-person stick-story with floating metrics",
          hookFormula: "Start mid-scene with a dramatic contrast between two floating numbers above characters' heads.",

          twistPattern: "Reveal the hidden truth behind the metric in the climax."

      // 2. Write Script with Gemini API (Configurable Duration in Minutes, No Shot Limit)
      async generateScriptWithGemini({ topic, styleProfile, targetMinutes = 1 }) {
        const store = window.StickForgeStore;
        const apiKey = store.api.llmKey || "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey)}`;

        const mins = Math.max(0.5, Number(targetMinutes) || 1);
        const targetShots = Math.max(3, Math.round(mins * 9));
        const targetWords = Math.round(mins * 150);

        const sysPrompt = `You are a YouTube Stick-Story Scriptwriter.
Write a ${mins}-minute (~${targetWords} words) first-person script divided into ${targetShots} paragraphs (1 paragraph = 1 animated shot).
Writing Style DNA:
- Tone: ${styleProfile.tone}
- Hook: ${styleProfile.hookFormula}
- Twist: ${styleProfile.twistPattern}

            method: "POST",

            body: JSON.stringify({
              contents: [{ role: "user", parts: [{ text: `Topic: ${topic}\nWrite ${targetShots} paragraphs.` }] }],
              systemInstruction: { parts: [{ text: sysPrompt }] },
              generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                  type: "OBJECT",

        // Fallback procedural multi-minute generator
        const clean = topic.replace(/\?+$/, "");
        const base = [
          `[shocked] The smartest kid in my school had 70 IQ glowing above his head, yet he was laughing at my failed test while a bright green 160 IQ floated over mine.`,

        ];

  <script id="module-renderer-2d">
    window.StickForgeRenderer = {
      audioCtx: null,
      audioDestStream: null,

      ensureAudio() {
        if (!this.audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            this.audioCtx = new AC();
            this.audioDestStream = this.audioCtx.createMediaStreamDestination();
          }
        }
        if (this.audioCtx && this.audioCtx.state === "suspended") this.audioCtx.resume();
        return this.audioCtx;
      },

      playSfx(type) {
        if (!window.StickForgeStore.enableSfx || !type || type === "none") return;
        const ctx = this.ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (this.audioDestStream) gain.connect(this.audioDestStream);

        if (type === "pop") {
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(790, now + 0.09);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === "ding") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(587.3, now);
          osc.frequency.setValueAtTime(880, now + 0.09);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
          osc.start(now); osc.stop(now + 0.43);
        } else if (type === "buzzer") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(145, now);
          osc.frequency.linearRampToValueAtTime(108, now + 0.3);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.33);
          osc.start(now); osc.stop(now + 0.34);
        } else if (type === "whoosh") {
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.exponentialRampToValueAtTime(95, now + 0.22);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now); osc.stop(now + 0.25);
        }
      },

      paintPresetBackgroundToDataUrl(setting) {
        const c = document.createElement("canvas");
        c.width = 960; c.height = 540;
        const ctx = c.getContext("2d");
        const W = 960, H = 540, floorY = H * 0.80;

        if (setting === "classroom") {
          const wg = ctx.createLinearGradient(0, 0, 0, floorY);
          wg.addColorStop(0, "#fef3c7"); wg.addColorStop(1, "#fde68a");
          ctx.fillStyle = wg; ctx.fillRect(0, 0, W, floorY);
          ctx.fillStyle = "#b45309"; ctx.fillRect(0, floorY, W, H - floorY);
          ctx.fillStyle = "#064e3b"; ctx.fillRect(210, 58, 560, 220);
          ctx.strokeStyle = "#78350f"; ctx.lineWidth = 8; ctx.strokeRect(210, 58, 560, 220);
          ctx.fillStyle = "rgba(255,255,255,0.85)";
          ctx.font = '700 22px "JetBrains Mono", monospace';
          ctx.fillText("IQ DISTRIBUTION & APTITUDE TEST", 250, 120);
          ctx.fillText("f(x) = ∫ e^(-x²) dx   [POP QUIZ]", 250, 180);
        } else if (setting === "bedroom") {
          const wg = ctx.createLinearGradient(0, 0, 0, floorY);
          wg.addColorStop(0, "#e0e7ff"); wg.addColorStop(1, "#c7d2fe");
          ctx.fillStyle = wg; ctx.fillRect(0, 0, W, floorY);
          ctx.fillStyle = "#7c2d12"; ctx.fillRect(0, floorY, W, H - floorY);
          ctx.fillStyle = "#bae6fd"; ctx.fillRect(620, 80, 150, 280);
          ctx.strokeStyle = "#475569"; ctx.lineWidth = 8; ctx.strokeRect(620, 80, 150, 280);
          ctx.fillStyle = "#3b82f6"; ctx.fillRect(90, 290, 240, 140);
          ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 4; ctx.strokeRect(90, 290, 240, 140);
        } else if (setting === "library") {
          ctx.fillStyle = "#fef3c7"; ctx.fillRect(0, 0, W, floorY);
          ctx.fillStyle = "#78350f"; ctx.fillRect(0, floorY, W, H - floorY);
          for (let s = 0; s < 3; s++) {
            const sx = 95 + s * 280;
            ctx.fillStyle = "#78350f"; ctx.fillRect(sx, 60, 210, floorY - 60);
            ctx.strokeStyle = "#451a03"; ctx.lineWidth = 5; ctx.strokeRect(sx, 60, 210, floorY - 60);
          }
        } else if (setting === "auditorium") {
          const wg = ctx.createLinearGradient(0, 0, 0, floorY);
          wg.addColorStop(0, "#090d16"); wg.addColorStop(1, "#1e1b4b");
          ctx.fillStyle = wg; ctx.fillRect(0, 0, W, floorY);
          ctx.fillStyle = "#451a03"; ctx.fillRect(0, floorY, W, H - floorY);
          ctx.fillStyle = "#0284c7"; ctx.fillRect(210, 52, 540, 210);
          ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 5; ctx.strokeRect(210, 52, 540, 210);
          ctx.fillStyle = "#ffffff"; ctx.font = '800 26px "Inter", sans-serif'; ctx.textAlign = "center";
          ctx.fillText("NATIONAL STUDENT CHALLENGE", 480, 130);
        } else {
          const wg = ctx.createLinearGradient(0, 0, 0, floorY);
          wg.addColorStop(0, "#bae6fd"); wg.addColorStop(1, "#e2e8f0");
          ctx.fillStyle = wg; ctx.fillRect(0, 0, W, floorY);
          ctx.fillStyle = "#64748b"; ctx.fillRect(0, floorY, W, H - floorY);
        }
        ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();
        return c.toDataURL("image/jpeg", 0.9);
      },

      initPresetPlates() {
        const store = window.StickForgeStore;
        ["classroom", "bedroom", "hallway", "library", "auditorium", "street", "park"].forEach(k => {
          const img = new Image();
          img.src = this.paintPresetBackgroundToDataUrl(k);
          store.presetBgImages[k] = img;
        });
      },

      attachDataUrlToShot(shot, dataUrl) {
        const store = window.StickForgeStore;
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            store.bgImageCache[shot.id] = img;
            shot.setting = "custom_image";
            window.StickForgeBus.emit("shots:updated");
            resolve();
          };
          img.onerror = () => resolve();
          img.src = dataUrl;
        });
      },

      async buildRichProceduralPlateForShot(shot, promptText) {
        const store = window.StickForgeStore;
        const c = document.createElement("canvas");
        c.width = 960; c.height = 540;
        const ctx = c.getContext("2d");
        const baseImg = store.presetBgImages["classroom"];
        if (baseImg && baseImg.complete) ctx.drawImage(baseImg, 0, 0, 960, 540);
        ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(220, 48, 520, 62, 10);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#fde047";
        ctx.font = '800 20px "Inter", sans-serif';
        ctx.textAlign = "center";
        ctx.fillText((promptText || "CUSTOM 2D SCENE").toUpperCase().slice(0, 36), 480, 85);
        await this.attachDataUrlToShot(shot, c.toDataURL("image/jpeg", 0.92));
      },

      drawRichEnvironment(ctx, W, H, setting, styleMode, tSec, shot) {
        const store = window.StickForgeStore;
        if (setting === "custom_image" && shot && store.bgImageCache[shot.id]?.complete) {
          ctx.drawImage(store.bgImageCache[shot.id], 0, 0, W, H);
          return;
        }
        const plate = store.presetBgImages[setting] || store.presetBgImages["classroom"];
        if (plate && plate.complete) {
          ctx.save();
          if (styleMode === "neon") ctx.filter = "brightness(0.55) contrast(1.35) hue-rotate(175deg)";
          else if (styleMode === "sketch") ctx.filter = "sepia(0.45) brightness(1.05)";
          ctx.drawImage(plate, 0, 0, W, H);
          ctx.restore();
        }
      },

      // Helper to render any 2D Object/Prop/Clothing Attachment from window.SF_MODEL_GALLERY.objectModels
      drawAttachedObject(ctx, objId, scale) {
        if (!objId || objId === "none") return;
        const objSpec = window.SF_MODEL_GALLERY.objectModels.find(o => o.id === objId);
        if (!objSpec || !Array.isArray(objSpec.primitives)) return;

        ctx.save();
        objSpec.primitives.forEach(prim => {
          ctx.fillStyle = prim.fill || "#ffffff";
          ctx.strokeStyle = prim.stroke || "#0f172a";
          ctx.lineWidth = (prim.lw || 2) * scale;
          if (prim.type === "rect") {
            ctx.beginPath();
            ctx.rect((prim.x || 0) * scale, (prim.y || 0) * scale, (prim.w || 20) * scale, (prim.h || 20) * scale);
            if (prim.fill !== "none") ctx.fill();
            if (prim.stroke !== "none") ctx.stroke();
          } else if (prim.type === "roundRect") {
            ctx.beginPath();
            ctx.roundRect((prim.x || 0) * scale, (prim.y || 0) * scale, (prim.w || 20) * scale, (prim.h || 20) * scale, (prim.r || 4) * scale);
            if (prim.fill !== "none") ctx.fill();
            if (prim.stroke !== "none") ctx.stroke();
          } else if (prim.type === "circle") {
            ctx.beginPath();
            ctx.arc((prim.x || 0) * scale, (prim.y || 0) * scale, (prim.r || 8) * scale, 0, Math.PI * 2);
            if (prim.fill !== "none") ctx.fill();
            if (prim.stroke !== "none") ctx.stroke();
          } else if (prim.type === "line") {
            ctx.beginPath();
            ctx.moveTo((prim.x1 || 0) * scale, (prim.y1 || 0) * scale);
            ctx.lineTo((prim.x2 || 0) * scale, (prim.y2 || 0) * scale);
            ctx.stroke();
          } else if (prim.type === "polygon" && Array.isArray(prim.points)) {
            ctx.beginPath();
            prim.points.forEach((pt, idx) => {
              if (idx === 0) ctx.moveTo(pt[0] * scale, pt[1] * scale);
              else ctx.lineTo(pt[0] * scale, pt[1] * scale);
            });
            ctx.closePath();
            if (prim.fill !== "none") ctx.fill();
            if (prim.stroke !== "none") ctx.stroke();
          } else if (prim.type === "text") {
            ctx.fillStyle = prim.color || "#0f172a";
            ctx.font = `800 ${Math.round((prim.size || 12) * scale)}px "Inter", sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(prim.text || "", (prim.x || 0) * scale, (prim.y || 0) * scale);
          }
        });
        ctx.restore();
      },

      // Interpolate between keyframe poses in window.SF_MOTIONS
      computeInterpolatedPose(actionId, tSec, charIndex, customJointOverrides) {
        if (customJointOverrides) return customJointOverrides;
        const motion = window.SF_MOTIONS[actionId] || window.SF_MOTIONS.idle;
        const frames = motion.frames || window.SF_MOTIONS.idle.frames;
        if (frames.length === 1) return frames[0];

        const speed = actionId === "run" ? 6.0 : actionId === "walk" ? 3.8 : 2.2;
        const rawPhase = (tSec * speed + charIndex * 0.35) % frames.length;
        const idxA = Math.floor(rawPhase);
        const idxB = (idxA + 1) % frames.length;
        const frac = rawPhase - idxA;
        // Smooth cosine interpolation for fluid movement
        const mu = (1 - Math.cos(frac * Math.PI)) / 2;

        const fA = frames[idxA];
        const fB = frames[idxB];
        const pose = {};
        ["torsoTilt", "headTilt", "lShoulder", "lElbow", "rShoulder", "rElbow", "lHip", "lKnee", "rHip", "rKnee", "bounceY"].forEach(k => {
          pose[k] = (fA[k] || 0) * (1 - mu) + (fB[k] || 0) * mu;
        });
        return pose;
      },

      // Draw Quadruped Stick Animal (Dog, Cat, etc.) with articulated legs, tail & ears
      drawAnimalStickCharacter(ctx, W, H, char, modelSpec, index, isSelected, styleMode, tSec) {
        const store = window.StickForgeStore;
        const cx = (Number(char.x) / 100) * W;
        const cy = (Number(char.y) / 100) * H;
        const scale = (Number(char.scale) || 1.0) * (H / 540);
        const dir = char.flip ? -1 : 1;
        const strokeMain = styleMode === "neon" ? "#38bdf8" : "#0f172a";
        const lw = 5 * scale;

        const bodyLen = (modelSpec.bodyLen || 60) * scale;
        const legLen = (modelSpec.legLen || 22) * scale;
        const headR = 19 * (modelSpec.headScale || 1.0) * scale;
        const isMoving = char.action === "walk" || char.action === "run";
        const swing = isMoving ? Math.sin(tSec * 8 + index) * 12 * scale : 0;
        const bobY = Math.abs(Math.cos(tSec * 6 + index)) * 3 * scale;

        const hipX = cx - (bodyLen * 0.45) * dir;
        const shoulderX = cx + (bodyLen * 0.45) * dir;
        const spineY = cy - legLen * 1.6 - bobY;
        const headX = shoulderX + 18 * scale * dir;
        const headY = spineY - 14 * scale;

        ctx.save();
        ctx.lineCap = "round"; ctx.lineJoin = "round";

        // Shadow
        ctx.fillStyle = "rgba(15,23,42,0.22)";
        ctx.beginPath(); ctx.ellipse(cx, cy + 3 * scale, bodyLen * 0.65, 7 * scale, 0, 0, Math.PI * 2); ctx.fill();

        // Wagging Tail
        if (modelSpec.tail) {
          const wag = Math.sin(tSec * 12) * 10 * scale;
          ctx.strokeStyle = strokeMain; ctx.lineWidth = lw * 0.85;
          ctx.beginPath();
          ctx.moveTo(hipX, spineY);
          ctx.quadraticCurveTo(hipX - 18 * scale * dir, spineY - 18 * scale + wag, hipX - 26 * scale * dir, spineY - 28 * scale + wag);
          ctx.stroke();
        }

        // 4 Articulated Legs with Paws
        ctx.strokeStyle = strokeMain; ctx.lineWidth = lw;
        const legs = [
          { sx: hipX - 5 * scale, off: swing },
          { sx: hipX + 6 * scale, off: -swing },
          { sx: shoulderX - 5 * scale, off: -swing },
          { sx: shoulderX + 6 * scale, off: swing }
        ];
        legs.forEach(lg => {
          const kneeX = lg.sx + lg.off * 0.4;
          const kneeY = spineY + legLen * 0.8;
          const pawX = lg.sx + lg.off;
          const pawY = cy;
          ctx.beginPath();
          ctx.moveTo(lg.sx, spineY);
          ctx.lineTo(kneeX, kneeY);
          ctx.lineTo(pawX, pawY);
          ctx.stroke();
          // Paw oval
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.ellipse(pawX + 3 * scale * dir, pawY, 5 * scale, 3 * scale, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        });

        // Spine / Body Pill
        ctx.fillStyle = char.outfit && char.outfit !== "stick" ? char.outfit : "#f59e0b";
        ctx.beginPath();
        ctx.roundRect(Math.min(hipX, shoulderX) - 8 * scale, spineY - 12 * scale, bodyLen + 16 * scale, 24 * scale, 12 * scale);
        ctx.fill(); ctx.stroke();

        // Head
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(headX, headY, headR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // Ears
        ctx.fillStyle = char.outfit && char.outfit !== "stick" ? char.outfit : "#d97706";
        if (modelSpec.ears === "pointed") {
          ctx.beginPath();
          ctx.moveTo(headX - 12 * scale, headY - headR * 0.6);
          ctx.lineTo(headX - 6 * scale, headY - headR * 1.45);
          ctx.lineTo(headX + 2 * scale, headY - headR * 0.8);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.ellipse(headX - 8 * scale * dir, headY + 2 * scale, 6 * scale, 12 * scale, 0.3 * dir, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        }

        // Eyes & Nose
        ctx.fillStyle = strokeMain;
        ctx.beginPath();
        ctx.arc(headX + 6 * scale * dir, headY - 3 * scale, 2.5 * scale, 0, Math.PI * 2);
        ctx.arc(headX + headR * 0.9 * dir, headY + 2 * scale, 3.5 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Overhead Badge & Name Tag
        this.drawBadgeAndNameTag(ctx, cx, cy, headX, headY, headR, scale, char, index, isSelected, styleMode, tSec);
        ctx.restore();
      },

      drawBadgeAndNameTag(ctx, cx, cy, headX, headY, headRadius, scale, char, index, isSelected, styleMode, tSec) {
        const store = window.StickForgeStore;
        if (isSelected) {
          ctx.save();
          ctx.strokeStyle = "rgba(99, 102, 241, 0.9)";
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.strokeRect(cx - 58 * scale, headY - 82 * scale, 116 * scale, (cy - headY) + 98 * scale);
          ctx.restore();
        }

        // Overhead Floating Metric Badge
        if (store.showBadges && char.badgeText && char.badgeText.trim() !== "") {
          const floatY = headY - headRadius - 26 * scale + Math.sin(tSec * 4 + index) * 3.5 * scale;
          const badgeColor = char.badgeColor || "#22c55e";
          ctx.font = `800 ${Math.round(16 * scale)}px "JetBrains Mono", monospace`;
          const tw = ctx.measureText(char.badgeText).width;
          const boxW = tw + 24 * scale, boxH = 28 * scale;

          ctx.save();
          ctx.shadowColor = badgeColor; ctx.shadowBlur = 12 * scale;
          ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
          ctx.strokeStyle = badgeColor; ctx.lineWidth = 2.5 * scale;
          ctx.beginPath(); ctx.roundRect(headX - boxW / 2, floatY - boxH / 2, boxW, boxH, 8 * scale);
          ctx.fill(); ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = badgeColor;
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(char.badgeText, headX, floatY + 1 * scale);
          ctx.restore();
        }

        // Option to Enable or Disable Names Under Characters
        if (store.showCharacterNames && char.name) {
          ctx.save();
          const labelY = cy + 19 * scale;
          ctx.font = `700 ${Math.round(11.5 * scale)}px "Inter", sans-serif`;
          const nameW = ctx.measureText(char.name).width + 14 * scale;
          ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
          ctx.beginPath();
          ctx.roundRect(cx - nameW / 2, labelY - 9 * scale, nameW, 18 * scale, 5 * scale);
          ctx.fill();
          ctx.fillStyle = "#f8fafc";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(char.name, cx, labelY);
          ctx.restore();
        }
      },

      // Main Articulated 16-Joint Stick Figure Renderer (Shoulder -> Elbow -> Hand, Hip -> Knee -> Foot + Attachments)
      drawStickCharacter(ctx, W, H, char, index, isSelected, styleMode, tSec, isTalkingNow, customPoseOverride = null) {
        const store = window.StickForgeStore;
        const modelSpec = window.SF_MODEL_GALLERY.characterModels.find(m => m.id === char.modelId) || window.SF_MODEL_GALLERY.characterModels[0];

        if (modelSpec.category === "animal") {
          this.drawAnimalStickCharacter(ctx, W, H, char, modelSpec, index, isSelected, styleMode, tSec);
          return;
        }

        const cx = (Number(char.x) / 100) * W;
        const cy = (Number(char.y) / 100) * H;
        const scale = (Number(char.scale) || 1.0) * (H / 540);
        const dir = char.flip ? -1 : 1;

        const pose = this.computeInterpolatedPose(char.action || "idle", tSec, index, customPoseOverride);

        const headRadius = 25 * (modelSpec.headScale || 1.0) * scale;
        const torsoLen = (modelSpec.torsoLen || 66) * scale;
        const upperArmLen = (modelSpec.limbLen || 28) * scale;
        const lowerArmLen = (modelSpec.limbLen || 28) * 0.95 * scale;
        const upperLegLen = (modelSpec.limbLen || 28) * 1.08 * scale;
        const lowerLegLen = (modelSpec.limbLen || 28) * 1.05 * scale;

        const rad = (deg) => (deg * Math.PI) / 180;
        const torsoRad = rad((pose.torsoTilt || 0) * dir);

        const hipX = cx;
        const hipY = cy - (upperLegLen + lowerLegLen) * 0.92 + (pose.bounceY || 0) * scale;
        const neckX = hipX + Math.sin(torsoRad) * torsoLen;
        const neckY = hipY - Math.cos(torsoRad) * torsoLen;

        const headTiltRad = rad((pose.headTilt || 0) * dir);
        const headX = neckX + Math.sin(torsoRad + headTiltRad) * (headRadius * 0.95);
        const headY = neckY - Math.cos(torsoRad + headTiltRad) * (headRadius * 0.95);

        // Compute Hip -> Knee -> Ankle/Foot coordinates
        const lHipAngle = rad((pose.lHip || -12) * dir);
        const lKneeAngle = lHipAngle + rad((pose.lKnee || 5) * dir);
        const lHipX = hipX - 7 * scale;
        const lKneeX = lHipX + Math.sin(lHipAngle) * upperLegLen;
        const lKneeY = hipY + Math.cos(lHipAngle) * upperLegLen;
        const lFootX = lKneeX + Math.sin(lKneeAngle) * lowerLegLen;
        const lFootY = Math.min(cy + 2 * scale, lKneeY + Math.cos(lKneeAngle) * lowerLegLen);

        const rHipAngle = rad((pose.rHip || 12) * dir);
        const rKneeAngle = rHipAngle + rad((pose.rKnee || -5) * dir);
        const rHipX = hipX + 7 * scale;
        const rKneeX = rHipX + Math.sin(rHipAngle) * upperLegLen;
        const rKneeY = hipY + Math.cos(rHipAngle) * upperLegLen;
        const rFootX = rKneeX + Math.sin(rKneeAngle) * lowerLegLen;
        const rFootY = Math.min(cy + 2 * scale, rKneeY + Math.cos(rKneeAngle) * lowerLegLen);

        // Compute Shoulder -> Elbow -> Wrist/Hand coordinates
        const shoulderY = neckY + 11 * scale;
        const shoulderX = neckX;

        const lShAngle = torsoRad + rad((pose.lShoulder || -22) * dir);
        const lElAngle = lShAngle + rad((pose.lElbow || -15) * dir);
        const lShX = shoulderX - 13 * scale;
        const lElbowX = lShX + Math.sin(lShAngle) * upperArmLen;
        const lElbowY = shoulderY + Math.cos(lShAngle) * upperArmLen;
        const lHandX = lElbowX + Math.sin(lElAngle) * lowerArmLen;
        const lHandY = lElbowY + Math.cos(lElAngle) * lowerArmLen;

        const rShAngle = torsoRad + rad((pose.rShoulder || 22) * dir);
        const rElAngle = rShAngle + rad((pose.rElbow || 15) * dir);
        const rShX = shoulderX + 13 * scale;
        const rElbowX = rShX + Math.sin(rShAngle) * upperArmLen;
        const rElbowY = shoulderY + Math.cos(rShAngle) * upperArmLen;
        const rHandX = rElbowX + Math.sin(rElAngle) * lowerArmLen;
        const rHandY = rElbowY + Math.cos(rElAngle) * lowerArmLen;

        const strokeMain = styleMode === "neon" ? "#f8fafc" : "#0f172a";
        const lineW = (styleMode === "mspaint" ? 4.5 : 5.5) * scale;
        const attachments = char.attachments || {
          rightHand: char.prop || "none",
          leftHand: "none",
          head: "none",
          back: "none"
        };

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // Ground shadow
        ctx.fillStyle = "rgba(15, 23, 42, 0.24)";
        ctx.beginPath();
        ctx.ellipse(cx, cy + 4 * scale, 35 * scale, 8 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        // 0. Back Socket Attachment (Backpack, Hero Cape, etc.)
        if (attachments.back && attachments.back !== "none") {
          ctx.save();
          ctx.translate(neckX, shoulderY);
          ctx.scale(dir, 1);
          this.drawAttachedObject(ctx, attachments.back, scale);
          ctx.restore();
        }

        // 1. ARTICULATED LEGS (Hip -> Knee -> Foot + Shoes)
        ctx.strokeStyle = strokeMain;
        ctx.lineWidth = lineW;
        ctx.beginPath();
        ctx.moveTo(lHipX, hipY); ctx.lineTo(lKneeX, lKneeY); ctx.lineTo(lFootX, lFootY);
        ctx.moveTo(rHipX, hipY); ctx.lineTo(rKneeX, rKneeY); ctx.lineTo(rFootX, rFootY);
        ctx.stroke();

        // Articulated Feet / Sneakers
        if (modelSpec.hasHandsFeet !== false) {
          ctx.fillStyle = "#ffffff";
          ctx.lineWidth = 2.5 * scale;
          ctx.beginPath();
          ctx.ellipse(lFootX + 5 * scale * dir, lFootY, 8.5 * scale, 4.2 * scale, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(rFootX + 5 * scale * dir, rFootY, 8.5 * scale, 4.2 * scale, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        }

        // 2. TORSO & CLOTHING OUTFIT (Hoodie, Blazer, Sweater, Suit, or Pure Stick)
        const torsoW = (modelSpec.torsoWidth || 40) * scale;
        if (char.outfit && char.outfit !== "stick" && styleMode !== "neon") {
          ctx.save();
          ctx.translate((neckX + hipX) / 2, (neckY + hipY) / 2);
          ctx.rotate(torsoRad);
          ctx.fillStyle = char.outfit;
          ctx.strokeStyle = strokeMain;
          ctx.lineWidth = lineW * 0.85;
          ctx.beginPath();
          ctx.roundRect(-torsoW / 2, -torsoLen / 2 + 2 * scale, torsoW, torsoLen - 4 * scale, 12 * scale);
          ctx.fill();
          ctx.stroke();

          // Clothing details (Tie for blazer/suit, pocket & strings for hoodie)
          const oStyle = char.outfitStyle || "hoodie";
          if (oStyle === "blazer" || oStyle === "suit") {
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.moveTo(-3 * scale, -torsoLen / 2 + 4 * scale);
            ctx.lineTo(3 * scale, -torsoLen / 2 + 4 * scale);
            ctx.lineTo(4 * scale, 8 * scale);
            ctx.lineTo(0, 14 * scale);
            ctx.lineTo(-4 * scale, 8 * scale);
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.moveTo(-6 * scale, -torsoLen / 2 + 6 * scale);
            ctx.lineTo(-6 * scale, -torsoLen / 2 + 22 * scale);
            ctx.moveTo(6 * scale, -torsoLen / 2 + 6 * scale);
            ctx.lineTo(6 * scale, -torsoLen / 2 + 22 * scale);
            ctx.stroke();
          }
          ctx.restore();
        } else {
          ctx.strokeStyle = styleMode === "neon" ? (char.outfit !== "stick" ? char.outfit : "#38bdf8") : strokeMain;
          ctx.lineWidth = lineW;
          ctx.beginPath();
          ctx.moveTo(neckX, neckY);
          ctx.lineTo(hipX, hipY);
          ctx.stroke();
        }

        // 3. ARTICULATED ARMS (Shoulder -> Elbow -> Wrist/Hand)
        ctx.strokeStyle = strokeMain;
        ctx.lineWidth = lineW;
        ctx.beginPath();
        ctx.moveTo(lShX, shoulderY); ctx.lineTo(lElbowX, lElbowY); ctx.lineTo(lHandX, lHandY);
        ctx.moveTo(rShX, shoulderY); ctx.lineTo(rElbowX, rElbowY); ctx.lineTo(rHandX, rHandY);
        ctx.stroke();

        // Joint Articulation Pins (Elbows & Knees) + Circular Hands
        if (store.showJointPins) {
          ctx.fillStyle = char.outfit && char.outfit !== "stick" ? char.outfit : "#cbd5e1";
          ctx.lineWidth = 2 * scale;
          [[lElbowX, lElbowY], [rElbowX, rElbowY], [lKneeX, lKneeY], [rKneeX, rKneeY]].forEach(([jx, jy]) => {
            ctx.beginPath();
            ctx.arc(jx, jy, 3.8 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });
        }

        // Articulated Hands (Mittens/Circles)
        if (modelSpec.hasHandsFeet !== false) {
          ctx.fillStyle = "#ffffff";
          ctx.lineWidth = 2.5 * scale;
          ctx.beginPath(); ctx.arc(lHandX, lHandY, 5.2 * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(rHandX, rHandY, 5.2 * scale, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }

        // 4. HEAD & EARS/ANTENNA
        ctx.fillStyle = styleMode === "neon" ? "#0f172a" : "#ffffff";
        ctx.strokeStyle = strokeMain;
        ctx.lineWidth = lineW * 0.9;
        ctx.beginPath();
        ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (modelSpec.ears === "antenna") {
          ctx.beginPath();
          ctx.moveTo(headX, headY - headRadius);
          ctx.lineTo(headX, headY - headRadius - 14 * scale);
          ctx.stroke();
          ctx.fillStyle = "#38bdf8";
          ctx.beginPath();
          ctx.arc(headX, headY - headRadius - 16 * scale, 4 * scale, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        }

        // 5. FACIAL EXPRESSIONS (14 Expressive Rig States)
        const eyeOffX = 8 * scale * dir;
        const eyeY = headY - 4 * scale;
        const expr = char.expr || "neutral";
        ctx.fillStyle = strokeMain;
        ctx.strokeStyle = strokeMain;
        ctx.lineWidth = 2.4 * scale;

        if (modelSpec.visor) {
          ctx.fillStyle = "#38bdf8";
          ctx.beginPath();
          ctx.roundRect(headX + eyeOffX - 14 * scale, eyeY - 6 * scale, 28 * scale, 10 * scale, 4 * scale);
          ctx.fill(); ctx.stroke();
        } else if (expr === "cool") {
          ctx.fillStyle = "#0f172a";
          ctx.fillRect(headX + eyeOffX - 15 * scale, eyeY - 6 * scale, 13 * scale, 9 * scale);
          ctx.fillRect(headX + eyeOffX + 1 * scale, eyeY - 6 * scale, 13 * scale, 9 * scale);
          ctx.beginPath();
          ctx.moveTo(headX - headRadius, eyeY - 3 * scale);
          ctx.lineTo(headX + headRadius, eyeY - 3 * scale);
          ctx.stroke();
        } else if (expr === "laughing") {
          ctx.beginPath();
          ctx.moveTo(headX + eyeOffX - 11 * scale, eyeY + 2 * scale);
          ctx.lineTo(headX + eyeOffX - 6 * scale, eyeY - 4 * scale);
          ctx.lineTo(headX + eyeOffX - 1 * scale, eyeY + 2 * scale);
          ctx.moveTo(headX + eyeOffX + 3 * scale, eyeY + 2 * scale);
          ctx.lineTo(headX + eyeOffX + 8 * scale, eyeY - 4 * scale);
          ctx.lineTo(headX + eyeOffX + 13 * scale, eyeY + 2 * scale);
          ctx.stroke();
        } else if (expr === "starstruck") {
          ctx.fillStyle = "#facc15";
          ctx.font = `800 ${Math.round(14 * scale)}px sans-serif`;
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("★", headX + eyeOffX - 6 * scale, eyeY);
          ctx.fillText("★", headX + eyeOffX + 8 * scale, eyeY);
        } else if (expr === "shocked" || expr === "mindblown" || expr === "nervous") {
          ctx.beginPath();
          ctx.arc(headX + eyeOffX - 6 * scale, eyeY, 4.2 * scale, 0, Math.PI * 2);
          ctx.arc(headX + eyeOffX + 8 * scale, eyeY, 4.2 * scale, 0, Math.PI * 2);
          ctx.stroke();
          if (expr === "nervous") {
            ctx.fillStyle = "#38bdf8";
            ctx.beginPath();
            ctx.arc(headX - 14 * scale * dir, headY - 8 * scale + (tSec * 12 % 8) * scale, 3.2 * scale, 0, Math.PI * 2);
            ctx.fill();
          }
          if (expr === "mindblown") {
            ctx.strokeStyle = "#facc15";
            for (let a = 0; a < 5; a++) {
              const ang = -Math.PI * 0.85 + a * 0.42;
              ctx.beginPath();
              ctx.moveTo(headX + Math.cos(ang) * (headRadius + 4 * scale), headY + Math.sin(ang) * (headRadius + 4 * scale));
              ctx.lineTo(headX + Math.cos(ang) * (headRadius + 14 * scale), headY + Math.sin(ang) * (headRadius + 14 * scale));
              ctx.stroke();
            }
            ctx.strokeStyle = strokeMain;
          }
        } else {
          ctx.beginPath();
          ctx.arc(headX + eyeOffX - 6 * scale, eyeY, 2.8 * scale, 0, Math.PI * 2);
          ctx.arc(headX + eyeOffX + 8 * scale, eyeY, 2.8 * scale, 0, Math.PI * 2);
          ctx.fill();
          if (expr === "crying") {
            ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 3 * scale;
            ctx.beginPath();
            ctx.moveTo(headX + eyeOffX - 6 * scale, eyeY + 4 * scale);
            ctx.lineTo(headX + eyeOffX - 6 * scale, eyeY + 16 * scale);
            ctx.moveTo(headX + eyeOffX + 8 * scale, eyeY + 4 * scale);
            ctx.lineTo(headX + eyeOffX + 8 * scale, eyeY + 16 * scale);
            ctx.stroke();
            ctx.strokeStyle = strokeMain;
          }
        }

        // Mouth & Lip-Sync
        const mouthY = headY + 9 * scale;
        const mouthOpen = isTalkingNow && (char.action === "talk" || index === 0)
          ? Math.abs(Math.sin(tSec * 18)) * 5.5 * scale : 0;
        ctx.beginPath();
        if (mouthOpen > 1.5 * scale) {
          ctx.fillStyle = strokeMain;
          ctx.ellipse(headX + eyeOffX, mouthY, 5 * scale, mouthOpen, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (expr === "happy" || expr === "smug" || expr === "cool" || expr === "laughing" || expr === "starstruck") {
          ctx.arc(headX + eyeOffX, mouthY - 2 * scale, 7 * scale, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.stroke();
        } else if (expr === "sad" || expr === "crying" || expr === "angry") {
          ctx.arc(headX + eyeOffX, mouthY + 5 * scale, 6 * scale, 1.15 * Math.PI, 1.85 * Math.PI);
          ctx.stroke();
        } else {
          ctx.moveTo(headX + eyeOffX - 6 * scale, mouthY);
          ctx.lineTo(headX + eyeOffX + 6 * scale, mouthY);
          ctx.stroke();
        }

        // 6. SOCKET ATTACHMENTS (Headwear, Left Hand, Right Hand)
        if (attachments.head && attachments.head !== "none") {
          ctx.save();
          ctx.translate(headX, headY - headRadius * 0.92);
          ctx.rotate(headTiltRad);
          this.drawAttachedObject(ctx, attachments.head, scale);
          ctx.restore();
        }
        if (attachments.leftHand && attachments.leftHand !== "none") {
          ctx.save();
          ctx.translate(lHandX, lHandY);
          this.drawAttachedObject(ctx, attachments.leftHand, scale);
          ctx.restore();
        }
        if (attachments.rightHand && attachments.rightHand !== "none") {
          ctx.save();
          ctx.translate(rHandX, rHandY);
          this.drawAttachedObject(ctx, attachments.rightHand, scale);
          ctx.restore();
        }

        // 7. Overhead Badge & Optional Character Name Under Feet
        this.drawBadgeAndNameTag(ctx, cx, cy, headX, headY, headRadius, scale, char, index, isSelected, styleMode, tSec);

        ctx.restore();
      },

      drawTimedCaptions(ctx, W, H, narration, shotElapsed, shotDuration) {
        const store = window.StickForgeStore;
        if (!store.showCaptions || !narration) return;
        const clean = narration.replace(/\[[^\]]+\]/g, "").trim();
        const words = clean.split(/\s+/).filter(Boolean);
        if (!words.length) return;

        const prog = Math.max(0, Math.min(0.999, shotElapsed / Math.max(1, shotDuration)));
        const curIdx = Math.floor(prog * words.length);
        const chunkSize = store.aspectRatio === "9:16" ? 4 : 7;
        const start = Math.floor(curIdx / chunkSize) * chunkSize;
        const chunk = words.slice(start, start + chunkSize);

        ctx.save();
        const fontSize = store.aspectRatio === "9:16" ? 24 : 21;
        ctx.font = `800 ${fontSize}px "Inter", sans-serif`;
        const fullLine = chunk.join(" ");
        const lineW = ctx.measureText(fullLine).width;
        const boxW = Math.min(W * 0.92, lineW + 34), boxH = fontSize + 20;
        const boxX = (W - boxW) / 2, boxY = H - boxH - 14;

        ctx.fillStyle = "rgba(9, 12, 18, 0.88)";
        ctx.strokeStyle = "rgba(99, 102, 241, 0.5)";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 10); ctx.fill(); ctx.stroke();

        let cursorX = W / 2 - lineW / 2;
        ctx.textBaseline = "middle";
        chunk.forEach((w, i) => {
          const gIdx = start + i;
          ctx.fillStyle = gIdx === curIdx ? "#facc15" : gIdx < curIdx ? "#ffffff" : "#94a3b8";
          ctx.fillText(w, cursorX, boxY + boxH / 2 + 1);
          cursorX += ctx.measureText(w + " ").width;
        });
        ctx.restore();
      }
    };

    window.StickForgeRenderer.initPresetPlates();
  </script>

          store.pushUndo();
          const copy = JSON.parse(JSON.stringify(store.getCurrentShot()));
          copy.id = "shot_" + Date.now();
          store.shots.splice(store.currentShotIndex + 1, 0, copy);
          store.currentShotIndex++;

          b.addEventListener("click", () => { minInp.value = b.dataset.min; updateMinEst(); });

        this.querySelector("#scrFullTextarea").value = store.shots.map(s => s.narration).join("\n\n");

        this.querySelector("#btnWriteGeminiScript").addEventListener("click", async () => {
          const topic = this.querySelector("#scrTopicInput").value.trim();
          const mins = Number(minInp.value) || 1;
          const style = store.styleProfiles.find(s => s.id === store.activeStyleId) || store.styleProfiles[0];
          window.StickForgeBus.emit("status:toast", { message: `✨ Writing ${mins}-min script with Gemini API...` });
          const paras = await window.StickForgeAI.generateScriptWithGemini({ topic, styleProfile: style, targetMinutes: mins });
          this.querySelector("#scrFullTextarea").value = paras.join("\n\n");
          window.StickForgeBus.emit("status:toast", { message: `✨ Generated ${paras.length} paragraphs! Click Build Storyboard.` });
        });

        this.querySelector("#btnBuildStoryboard").addEventListener("click", () => {
          const raw = this.querySelector("#scrFullTextarea").value.trim();
          if (!raw) return;
          store.pushUndo();
          const paras = raw.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
          store.shots = paras.map((p, idx) => ({
            id: "shot_" + Date.now() + "_" + idx,
            setting: idx % 3 === 0 ? "classroom" : idx % 3 === 1 ? "hallway" : "library",
            camera: idx % 2 === 0 ? "zoom_in" : "pan_right",
            duration: Math.max(4.5, Math.min(12, Number((p.split(/\s+/).length / 2.8).toFixed(1)))),

          store.styleProfiles.unshift(profile);
          store.activeStyleId = profile.id;
          window.StickForgeBus.emit("styles:updated");
          window.StickForgeBus.emit("status:toast", { message: `🧬 Cloned & saved "${profile.name}"!` });

          const prompt = this.querySelector("#forgePromptInput").value.trim();
          if (!prompt) return;
          window.StickForgeBus.emit("status:toast", { message: `🎨 Generating 2D ${genType} "${prompt}"...` });
          const newItem = await window.StickForgeAI.generateStickModelOrProp({ prompt, genType, slot });
          if (genType === "character") {
            window.SF_MODEL_GALLERY.characterModels.unshift(newItem);
            const activeChar = store.getActiveChar();
            if (activeChar) activeChar.modelId = newItem.id;

            window.SF_MODEL_GALLERY.objectModels.push(newItem);

            if (activeChar) {
              if (!activeChar.attachments) activeChar.attachments = { rightHand: "none", leftHand: "none", head: "none", back: "none" };

              else activeChar.attachments.rightHand = newItem.id;

          window.StickForgeBus.emit("shots:updated");
          window.StickForgeBus.emit("status:toast", { message: `🎨 Saved "${newItem.name}" to Model Gallery & applied to character!` });

      renderShotsList() {
        const store = window.StickForgeStore;
        const countEl = this.querySelector("#hubShotCount");

        const list = this.querySelector("#hubShotsList");

          const div = document.createElement("div");
          div.className = `p-2 rounded-lg border border-studio-border bg-studio-card cursor-pointer transition ${idx === store.currentShotIndex ? "shot-active" : "hover:border-slate-600"}`;
          div.innerHTML = `

    // ---------------------------------------------------------------------
    // 3. <sf-stage-canvas> Component (With Character Names & Joint Toggles)
    // ---------------------------------------------------------------------
    class SfStageCanvas extends HTMLElement {
      connectedCallback() {
        this.render();
        this.canvas = this.querySelector("#mainStageCanvas");
        this.ctx = this.canvas.getContext("2d");
        this.draggingIdx = -1;
        this.lastSpokenShotId = null;
        this.setupInteractions();
        requestAnimationFrame((ts) => this.loop(ts));

        window.StickForgeBus.on("stage:ratio", () => {
          const store = window.StickForgeStore;
          this.canvas.width = store.aspectRatio === "9:16" ? 540 : 960;
          this.canvas.height = store.aspectRatio === "9:16" ? 960 : 540;
        });
        window.StickForgeBus.on("shots:updated", () => this.syncTopToggles());
        window.StickForgeBus.on("video:export", () => this.exportWebm());
      }

      syncTopToggles() {
        const store = window.StickForgeStore;
        const nameCb = this.querySelector("#chkShowCharNames");

        const pinCb = this.querySelector("#chkShowJoints");

      }

      render() {
        const store = window.StickForgeStore;
        this.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 mb-1.5">
            <div class="flex items-center gap-2">
              <span id="stageShotBadge" class="px-2 py-0.5 rounded bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 text-xs font-mono font-semibold">Shot 1 / 3</span>
              <span class="text-[11px] text-slate-400">Drag characters directly on stage</span>
            </div>
            <div class="flex flex-wrap items-center gap-3 text-xs">
              <label class="flex items-center gap-1 text-slate-300 cursor-pointer">
                <input id="chkShowCaptions" type="checkbox" checked class="accent-indigo-500" />
                <span>Captions</span>

              <label class="flex items-center gap-1 text-slate-300 cursor-pointer">

                <span>Overhead Metrics</span>
              </label>
              <label class="flex items-center gap-1 text-emerald-300 font-medium cursor-pointer" title="Enable or disable character names under stick figures">
                <input id="chkShowCharNames" type="checkbox" ${store.showCharacterNames ? "checked" : ""} class="accent-emerald-500" />
                <span>Character Names</span>
              </label>
              <label class="flex items-center gap-1 text-amber-300 font-medium cursor-pointer" title="Show articulated elbow & knee joint pins">
                <input id="chkShowJoints" type="checkbox" ${store.showJointPins ? "checked" : ""} class="accent-amber-500" />
                <span>Joint Pins</span>
              </label>
            </div>
          </div>

          <div class="flex-1 flex items-center justify-center canvas-checker rounded-xl border border-studio-border p-2 relative overflow-hidden min-h-[250px]">
            <canvas id="mainStageCanvas" width="960" height="540" class="max-w-full max-h-full rounded-lg shadow-2xl cursor-pointer bg-slate-900"></canvas>
            <div id="recBadge" class="hidden absolute top-4 right-4 bg-rose-600 text-white px-3 py-1 rounded-full text-xs font-bold animate-pulse">● REC .WEBM</div>
          </div>

          <!-- AI Director Quick Edit Bar -->
          <div class="mt-2 bg-studio-panel border border-studio-border rounded-xl p-2 shadow">
            <div class="flex flex-wrap items-center justify-between gap-1 mb-1">
              <span class="text-xs font-bold text-indigo-400">⚡ Ask AI Director to Edit Scene or Rig:</span>
              <div class="flex flex-wrap gap-1">
                <button type="button" data-qdir="Make everyone celebrate with graduation caps and trophies" class="qdir-btn text-[10px] px-2 py-0.5 rounded bg-studio-card hover:bg-slate-700 text-slate-300 border border-studio-border">Celebrate + Caps</button>
                <button type="button" data-qdir="Make character facepalm in disappointment" class="qdir-btn text-[10px] px-2 py-0.5 rounded bg-studio-card hover:bg-slate-700 text-slate-300 border border-studio-border">Facepalm</button>
                <button type="button" data-qdir="Add a loyal dog with GOOD BOY badge" class="qdir-btn text-[10px] px-2 py-0.5 rounded bg-studio-card hover:bg-slate-700 text-slate-300 border border-studio-border">+ Add Stick-Dog</button>
                <button type="button" data-qdir="Hide character names" class="qdir-btn text-[10px] px-2 py-0.5 rounded bg-studio-card hover:bg-slate-700 text-slate-300 border border-studio-border">Toggle Names</button>
              </div>
            </div>
            <div class="flex gap-1.5">
              <input id="dirPromptInput" type="text" placeholder="e.g. 'Give Max a coffee cup in left hand and gold crown on head, action run'..." class="flex-1 bg-studio-bg border border-studio-border rounded-lg px-2.5 py-1 text-xs text-white" />
              <button id="btnApplyDir" type="button" class="px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold">Apply</button>
              <button id="btnUndoDir" type="button" class="px-2.5 py-1 rounded-lg bg-studio-card hover:bg-slate-700 border border-studio-border text-slate-300 text-xs">Undo</button>

        `;

        this.querySelector("#chkShowCaptions").addEventListener("change", (e) => { store.showCaptions = e.target.checked; });
        this.querySelector("#chkShowBadges").addEventListener("change", (e) => { store.showBadges = e.target.checked; });
        this.querySelector("#chkShowCharNames").addEventListener("change", (e) => {
          store.showCharacterNames = e.target.checked;
          window.StickForgeBus.emit("shots:updated");
        });
        this.querySelector("#chkShowJoints").addEventListener("change", (e) => {
          store.showJointPins = e.target.checked;
        });

          this.applyDirectorCommand(inp.value);

          b.addEventListener("click", () => this.applyDirectorCommand(b.dataset.qdir));

      applyDirectorCommand(cmd) {
        if (!cmd) return;
        const store = window.StickForgeStore;
        store.pushUndo();
        const shot = store.getCurrentShot();
        const p = cmd.toLowerCase();

        if (p.includes("hide") && p.includes("name")) store.showCharacterNames = false;
        else if (p.includes("show") && p.includes("name")) store.showCharacterNames = true;
        else if (p.includes("toggle") && p.includes("name")) store.showCharacterNames = !store.showCharacterNames;

        if (p.includes("add") && p.includes("dog")) {
          shot.characters.push({
            id: "dog_" + Date.now(), name: "Buddy (Dog)", modelId: "animal_dog", outfit: "#d97706", outfitStyle: "stick",
            badgeText: "GOOD BOY", badgeColor: "#f59e0b", expr: "happy", action: "walk",
            attachments: { rightHand: "none", leftHand: "none", head: "none", back: "none" },
            scale: 0.95, x: 82, y: 82, flip: true
          });
        }

        (shot.characters || []).forEach(c => {
          if (!c.attachments) c.attachments = { rightHand: "none", leftHand: "none", head: "none", back: "none" };
          if (p.includes("celebrate")) { c.action = "celebrate"; c.expr = "starstruck"; }
          if (p.includes("facepalm")) { c.action = "facepalm"; c.expr = "deadpan"; }
          if (p.includes("run")) c.action = "run";
          if (p.includes("cap")) c.attachments.head = "grad_cap";
          if (p.includes("crown")) c.attachments.head = "gold_crown";
          if (p.includes("trophy") || p.includes("trophies")) c.attachments.rightHand = "trophy";
          if (p.includes("coffee")) c.attachments.leftHand = "coffee_cup";
        });
        window.StickForgeBus.emit("shots:updated");
      }

      setupInteractions() {
        const getCoords = (e) => {
          const r = this.canvas.getBoundingClientRect();
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          return { xPct: ((cx - r.left) / r.width) * 100, yPct: ((cy - r.top) / r.height) * 100 };
        };
        this.canvas.addEventListener("mousedown", (e) => {
          const store = window.StickForgeStore;
          const shot = store.getCurrentShot();
          const { xPct, yPct } = getCoords(e);
          for (let i = (shot.characters || []).length - 1; i >= 0; i--) {
            const ch = shot.characters[i];
            if (Math.abs(xPct - ch.x) < 10 && (ch.y - yPct) >= -6 && (ch.y - yPct) <= 44) {
              store.selectedCharIndex = i;
              this.draggingIdx = i;
              window.StickForgeBus.emit("char:selected", { index: i });
              break;
            }
          }
        });
        window.addEventListener("mousemove", (e) => {
          if (this.draggingIdx === -1) return;
          const ch = window.StickForgeStore.getCurrentShot().characters?.[this.draggingIdx];
          if (!ch) return;
          const { xPct, yPct } = getCoords(e);
          ch.x = Math.round(Math.max(10, Math.min(90, xPct)));
          ch.y = Math.round(Math.max(52, Math.min(92, yPct)));
          window.StickForgeBus.emit("char:moved");
        });
        window.addEventListener("mouseup", () => { this.draggingIdx = -1; });
      }

      loop(nowMs) {
        const store = window.StickForgeStore;
        if (!this.lastFrameTs) this.lastFrameTs = nowMs;
        const dt = Math.min(0.1, (nowMs - this.lastFrameTs) / 1000) * store.playbackSpeed;
        this.lastFrameTs = nowMs;

        const shot = store.getCurrentShot();
        if (shot) {
          const badge = this.querySelector("#stageShotBadge");
          if (badge) badge.textContent = `Shot ${store.currentShotIndex + 1} / ${store.shots.length} · ${shot.setting}`;

          if (store.isPlaying) {
            const dur = Number(shot.duration) || 5;
            if (this.lastSpokenShotId !== shot.id) {
              this.lastSpokenShotId = shot.id;
              window.StickForgeRenderer.playSfx(shot.sfx);
              if (store.enableSpeech && "speechSynthesis" in window) {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(shot.narration.replace(/\[[^\]]+\]/g, "")));
              }
            }
            store.shotElapsed += dt;
            store.currentTime = store.getShotStartTime(store.currentShotIndex) + store.shotElapsed;
            if (store.shotElapsed >= dur) {
              if (store.loopShot) {
                store.shotElapsed = 0;
                this.lastSpokenShotId = null;
              } else if (store.currentShotIndex < store.shots.length - 1) {
                store.currentShotIndex++;
                store.shotElapsed = 0;
                window.StickForgeBus.emit("shot:selected", { index: store.currentShotIndex });
              } else {
                store.isPlaying = false;
                this.lastSpokenShotId = null;
                window.StickForgeBus.emit("playback:changed");
              }
            }
            window.StickForgeBus.emit("time:tick");
          } else {
            this.lastSpokenShotId = null;
          }

          const W = this.canvas.width, H = this.canvas.height;
          const tSec = nowMs / 1000;
          const dur = Number(shot.duration) || 5;
          const prog = Math.max(0, Math.min(1, store.shotElapsed / dur));

          this.ctx.clearRect(0, 0, W, H);
          this.ctx.save();
          let zoom = shot.camera === "zoom_in" ? 1 + prog * 0.12 : shot.camera === "zoom_out" ? 1.12 - prog * 0.12 : 1.03;
          let panX = shot.camera === "pan_right" ? (0.5 - prog) * W * 0.06 : 0;
          this.ctx.translate(W / 2 + panX, H / 2);
          this.ctx.scale(zoom, zoom);
          this.ctx.translate(-W / 2, -H / 2);

          window.StickForgeRenderer.drawRichEnvironment(this.ctx, W, H, shot.setting, store.visualStyle, tSec, shot);
          (shot.characters || []).forEach((ch, idx) => {
            window.StickForgeRenderer.drawStickCharacter(
              this.ctx, W, H, ch, idx, !store.isPlaying && idx === store.selectedCharIndex, store.visualStyle, tSec, store.isPlaying
            );
          });
          this.ctx.restore();

          window.StickForgeRenderer.drawTimedCaptions(this.ctx, W, H, shot.narration, store.shotElapsed, dur);
        }
        requestAnimationFrame((ts) => this.loop(ts));
      }

      exportWebm() {
        const store = window.StickForgeStore;
        window.StickForgeRenderer.ensureAudio();
        const stream = this.canvas.captureStream(30);
        const rec = new MediaRecorder(stream);
        const chunks = [];
        rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        rec.onstop = () => {
          this.querySelector("#recBadge").classList.add("hidden");
          const blob = new Blob(chunks, { type: "video/webm" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "stickforge_v4_story.webm";
          a.click();
        };
        store.currentShotIndex = 0; store.shotElapsed = 0; store.currentTime = 0; store.isPlaying = true;
        window.StickForgeBus.emit("playback:changed");
        this.querySelector("#recBadge").classList.remove("hidden");
        rec.start(200);
        const check = setInterval(() => {
          if (!store.isPlaying) { clearInterval(check); if (rec.state === "recording") rec.stop(); }
        }, 250);
      }
    }

        const store = window.StickForgeStore;

        pills.innerHTML = "";
        (shot.characters || []).forEach((c, idx) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = `px-2 py-0.5 rounded text-[11px] font-medium border ${idx === store.selectedCharIndex ? "bg-indigo-600 text-white border-indigo-400" : "bg-studio-bg text-slate-300 border-studio-border"}`;
          b.textContent = c.name;
          b.addEventListener("click", () => {
            store.selectedCharIndex = idx;
            this.sync();
          });
          pills.appendChild(b);
        });
      }

      sync() {
        const store = window.StickForgeStore;
        const shot = store.getCurrentShot();
        if (!shot) return;
        this.querySelector("#inspBgSelect").value = shot.setting;
        this.querySelector("#inspCamSelect").value = shot.camera;
        this.querySelector("#inspShowNamesToggle").checked = store.showCharacterNames;
        this.syncPills();

        const ch = store.getActiveChar();
        if (!ch) return;
        this.querySelector("#inspCharName").value = ch.name || "";
        this.querySelector("#inspModelSelect").value = ch.modelId || "humanoid_std";
        this.querySelector("#inspOutfitStyle").value = ch.outfitStyle || "hoodie";
        this.querySelector("#inspOutfitColor").value = ch.outfit || "#facc15";
        this.querySelector("#inspBadgeText").value = ch.badgeText || "";
        this.querySelector("#inspBadgeColor").value = ch.badgeColor || "#22c55e";
        this.querySelector("#inspExprSelect").value = ch.expr || "neutral";
        this.querySelector("#inspActionSelect").value = ch.action || "idle";

        const att = ch.attachments || { rightHand: ch.prop || "none", leftHand: "none", head: "none", back: "none" };
        this.querySelector("#inspRightHandSelect").value = att.rightHand || "none";
        this.querySelector("#inspLeftHandSelect").value = att.leftHand || "none";
        this.querySelector("#inspHeadSlotSelect").value = att.head || "none";
        this.querySelector("#inspBackSlotSelect").value = att.back || "none";
      }
    }

    class SfTimeline extends HTMLElement {
      connectedCallback() {
        this.render();
        window.StickForgeBus.on("shots:updated", () => this.renderTracks());
        window.StickForgeBus.on("shot:selected", () => this.renderTracks());
        window.StickForgeBus.on("time:tick", () => this.updateReadout());
        window.StickForgeBus.on("playback:changed", () => this.updatePlayBtn());
      }

      render() {
        this.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
              <button id="tlPlayBtn" type="button" class="px-3.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow">▶ Play Movie</button>
              <button id="tlStopBtn" type="button" class="px-2 py-1 rounded bg-studio-card border border-studio-border text-xs text-slate-300">■ Stop</button>
              <span id="tlTimecode" class="font-mono text-xs text-slate-300 bg-studio-bg px-2 py-0.5 rounded border border-studio-border">00:00.0 / 00:19.0</span>
            </div>
            <div class="flex items-center gap-2 text-xs">
              <label class="flex items-center gap-1 text-slate-400 cursor-pointer">
                <input id="tlLoopChk" type="checkbox" class="accent-indigo-500" />
                <span>Loop Shot</span>
              </label>
            </div>
          </div>
          <input id="tlScrubber" type="range" min="0" max="1000" value="0" class="w-full h-1.5 bg-studio-bg rounded-lg accent-indigo-500 cursor-pointer my-1" />
          <div id="tlPicTrack" class="flex h-7 rounded overflow-x-auto bg-studio-bg border border-studio-border gap-1 p-0.5"></div>
        `;

        const store = window.StickForgeStore;
        this.querySelector("#tlPlayBtn").addEventListener("click", () => {
          window.StickForgeRenderer.ensureAudio();
          store.isPlaying = !store.isPlaying;
          if (!store.isPlaying && "speechSynthesis" in window) window.speechSynthesis.cancel();
          this.updatePlayBtn();
        });
        this.querySelector("#tlStopBtn").addEventListener("click", () => {
          store.isPlaying = false;
          store.currentShotIndex = 0; store.shotElapsed = 0; store.currentTime = 0;
          if ("speechSynthesis" in window) window.speechSynthesis.cancel();
          this.updatePlayBtn();
          window.StickForgeBus.emit("shot:selected", { index: 0 });
        });
        this.querySelector("#tlLoopChk").addEventListener("change", (e) => { store.loopShot = e.target.checked; });
        this.querySelector("#tlScrubber").addEventListener("input", (e) => {
          const total = store.getTotalDuration();
          store.currentTime = (Number(e.target.value) / 1000) * total;
          store.shotElapsed = 0;
          this.updateReadout();
        });
        this.renderTracks();
      }

      updatePlayBtn() {
        const btn = this.querySelector("#tlPlayBtn");
        if (btn) btn.textContent = window.StickForgeStore.isPlaying ? "⏸ Pause" : "▶ Play Movie";
      }

      updateReadout() {
        const store = window.StickForgeStore;
        const total = Math.max(1, store.getTotalDuration());
        const tc = this.querySelector("#tlTimecode");
        if (tc) tc.textContent = `${store.currentTime.toFixed(1)}s / ${total.toFixed(1)}s (${store.shots.length} shots)`;
        const scrub = this.querySelector("#tlScrubber");
        if (scrub) scrub.value = Math.round((store.currentTime / total) * 1000);
      }

      renderTracks() {
        const store = window.StickForgeStore;
        const track = this.querySelector("#tlPicTrack");
        if (!track) return;
        track.innerHTML = "";
        const total = Math.max(1, store.getTotalDuration());
        store.shots.forEach((s, i) => {
          const wPct = Math.max(6, ((Number(s.duration) || 5) / total) * 100);
          const item = document.createElement("div");
          item.style.width = `${wPct}%`;
          item.style.minWidth = "85px";
          item.className = `h-full rounded px-2 flex items-center justify-between text-[10px] font-medium cursor-pointer shrink-0 truncate ${i === store.currentShotIndex ? "bg-indigo-600 text-white" : "bg-indigo-950/60 text-indigo-200"}`;
          item.textContent = `#${i + 1} ${s.setting} (${s.duration}s)`;
          item.addEventListener("click", () => {
            store.currentShotIndex = i;
            store.shotElapsed = 0;
            store.currentTime = store.getShotStartTime(i);

        const pills = this.querySelector("#kfPillsWrap");
        if (pills) {
          pills.innerHTML = "";
          this.frames.forEach((_, idx) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = `px-2.5 py-1 rounded text-xs font-bold ${idx === this.activeFrameIdx ? "bg-amber-500 text-slate-950" : "bg-studio-card text-slate-300"}`;
            b.textContent = `Pose ${idx + 1}`;
            b.addEventListener("click", () => {
              this.activeFrameIdx = idx;
              this.syncSliders();
            });
            pills.appendChild(b);
          });
        }
        const cur = this.frames[this.activeFrameIdx];
        if (!cur) return;
        Object.keys(cur).forEach(k => {
          const sld = this.querySelector(`#sld_${k}`);
          const val = this.querySelector(`#val_${k}`);
          if (sld) sld.value = cur[k];
          if (val) val.textContent = `${cur[k]}°`;
        });
      }

      previewLoop(nowMs) {
        if (!this.querySelector("#motionModalWrap").classList.contains("hidden")) {
          const tSec = nowMs / 1000;
          const W = this.pCanvas.width, H = this.pCanvas.height;
          this.pCtx.clearRect(0, 0, W, H);
          this.pCtx.strokeStyle = "#334155";
          this.pCtx.lineWidth = 3;
          this.pCtx.beginPath();
          this.pCtx.moveTo(0, H * 0.82);
          this.pCtx.lineTo(W, H * 0.82);
          this.pCtx.stroke();

          let pose = this.frames[this.activeFrameIdx];
          if (this.previewPlay && this.frames.length > 1) {
            const raw = (tSec * 2.2) % this.frames.length;
            const iA = Math.floor(raw);
            const iB = (iA + 1) % this.frames.length;
            const mu = (1 - Math.cos((raw - iA) * Math.PI)) / 2;
            pose = {};
            Object.keys(this.frames[0]).forEach(k => {
              pose[k] = this.frames[iA][k] * (1 - mu) + this.frames[iB][k] * mu;
            });
          }

          const dummyChar = {
            name: "Motion Rig",
            modelId: "humanoid_std",
            outfit: "#facc15",
            outfitStyle: "hoodie",
            badgeText: "",
            expr: "cool",
            attachments: { rightHand: "none", leftHand: "none", head: "none", back: "none" },
            scale: 1.35,
            x: 50,
            y: 82,
            flip: false
          };
          window.StickForgeRenderer.drawStickCharacter(this.pCtx, W, H, dummyChar, 0, false, "conchaser", tSec, false, pose);
        }
        requestAnimationFrame((ts) => this.previewLoop(ts));
      }
    }

                  <input id="gdriveTokenInput" type="password" placeholder="ya29.a0AfH6SM..." class="w-full bg-studio-bg border border-studio-border rounded px-2.5 py-1 text-white font-mono" />
                  <input id="gdriveFileIdInput" type="text" placeholder="Optional Existing File ID to update..." class="w-full bg-studio-bg border border-studio-border rounded px-2.5 py-1 text-white font-mono" />

                </div>

          });
        });

      }

      setMsg(text, isErr = false) {
        const el = this.querySelector("#cloudStatusMsg");
        if (el) {
          el.textContent = text;
          el.className = `text-[11px] font-mono ${isErr ? "text-rose-400" : "text-emerald-300"}`;
        }
      }

      async pushToCloud() {
        const store = window.StickForgeStore;
        const prov = this.querySelector("#cloudProviderSelect").value;
        const slot = this.querySelector("#cloudSlotName").value.trim() || "default_project";
        const bundle = store.exportFullBundle();

        this.setMsg(`Uploading "${slot}" to ${prov.toUpperCase()}...`);
        try {
          if (prov === "builtin_cloud") {
            if (window.StickForgeBuiltInCloud?.ready) {
              await window.StickForgeBuiltInCloud.saveProject(slot, bundle);
              await this.refreshCloudSlots();
              this.setMsg(`✓ Saved "${slot}" to StickForge Built-in Cloud!`);
              return;
            } else {
              throw new Error("Built-in Cloud session initializing");
            }
          } else if (prov === "aws_s3") {
            const url = this.querySelector("#awsEndpointInput").value.trim();
            const token = this.querySelector("#awsTokenInput").value.trim();
            if (!url) throw new Error("Enter an AWS S3 endpoint or Presigned PUT URL");
            const headers = { "Content-Type": "application/json" };
            if (token) headers["Authorization"] = `Bearer ${token}`;
            const res = await fetch(url, { method: "PUT", headers, body: JSON.stringify(bundle) });
            if (!res.ok) throw new Error(`AWS S3 HTTP ${res.status}`);
            this.setMsg("✓ Uploaded project bundle to AWS S3!");
          } else if (prov === "google_drive") {
            const token = this.querySelector("#gdriveTokenInput").value.trim();
            if (!token) throw new Error("Enter a Google Drive OAuth Bearer token");
            const metadata = { name: `${slot}.stickforge.json`, mimeType: "application/json" };
            const form = new FormData();
            form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
            form.append("file", new Blob([JSON.stringify(bundle)], { type: "application/json" }));
            const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
              method: "POST",
              headers: { "Authorization": `Bearer ${token}` },
              body: form
            });
            if (!res.ok) throw new Error(`Google Drive HTTP ${res.status}`);
            const data = await res.json();
            this.querySelector("#gdriveFileIdInput").value = data.id || "";
            this.setMsg(`✓ Uploaded to Google Drive (File ID: ${data.id})!`);
          } else if (prov === "github_gist") {
            const token = this.querySelector("#ghTokenInput").value.trim();
            const gistId = this.querySelector("#ghGistIdInput").value.trim();
            if (!token) throw new Error("Enter a GitHub Personal Access Token");
            const url = gistId ? `https://api.github.com/gists/${gistId}` : "https://api.github.com/gists";
            const res = await fetch(url, {
              method: gistId ? "PATCH" : "POST",
              headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
              body: JSON.stringify({
                description: "StickForge 2D v4.0 Studio Project Bundle",
                public: false,
                files: { [`${slot}.json`]: { content: JSON.stringify(bundle, null, 2) } }
              })
            });
            if (!res.ok) throw new Error(`GitHub Gist HTTP ${res.status}`);
            const data = await res.json();
            this.querySelector("#ghGistIdInput").value = data.id || "";
            this.setMsg(`✓ Synced to GitHub Gist (ID: ${data.id})!`);
          }
        } catch (err) {
          this.setMsg(`✕ Cloud error: ${err.message}`, true);
        }
      }

      async pullFromCloud() {
        const store = window.StickForgeStore;
        const prov = this.querySelector("#cloudProviderSelect").value;
        try {
          if (prov === "builtin_cloud") {
            await this.refreshCloudSlots();
            this.setMsg("Select any project below to load it.");
          } else if (prov === "aws_s3") {
            const url = this.querySelector("#awsEndpointInput").value.trim();
            const res = await fetch(url);
            const data = await res.json();
            store.importFullBundle(data);
            this.setMsg("✓ Loaded project from AWS S3!");
          } else if (prov === "google_drive") {
            const token = this.querySelector("#gdriveTokenInput").value.trim();
            const fileId = this.querySelector("#gdriveFileIdInput").value.trim();
            const res = await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media`, {
              headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            store.importFullBundle(data);
            this.setMsg("✓ Loaded project from Google Drive!");
          } else if (prov === "github_gist") {
            const gistId = this.querySelector("#ghGistIdInput").value.trim();
            const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}`);
            const gist = await res.json();
            const firstFile = Object.values(gist.files || {})[0];
            if (firstFile?.content) {
              store.importFullBundle(JSON.parse(firstFile.content));
              this.setMsg("✓ Loaded project from GitHub Gist!");
            }
          }
        } catch (err) {
          this.setMsg(`✕ Pull error: ${err.message}`, true);
        }
      }

      async refreshCloudSlots() {
        const listEl = this.querySelector("#cloudSlotsList");
        if (!listEl || !window.StickForgeBuiltInCloud?.ready) return;
        const projects = await window.StickForgeBuiltInCloud.listProjects();
        listEl.innerHTML = "";
        if (!projects.length) {
          listEl.innerHTML = `<div class="text-[11px] text-slate-500">No cloud slots saved yet. Click 'Save to Cloud' above.</div>`;
          return;
        }
        projects.forEach(p => {
          const row = document.createElement("div");
          row.className = "p-2 rounded bg-studio-card border border-studio-border flex items-center justify-between text-xs";
          row.innerHTML = `
            <span class="font-mono text-white">${p.slotName}</span>
            <button type="button" class="px-2 py-0.5 rounded bg-indigo-600 text-white text-[10px] font-bold">Load</button>
          `;
          row.querySelector("button").addEventListener("click", () => {
            window.StickForgeStore.importFullBundle(JSON.parse(p.payloadJson));
            this.setMsg(`✓ Loaded "${p.slotName}" from Cloud!`);
          });
          listEl.appendChild(row);
        });
      }
    }
    customElements.define("sf-cloud-modal", SfCloudModal);
